  dart_mappable: ^4.8.0
  ntp: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  build_runner: ^2.9.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  shared_preferences_platform_interface: ^2.4.1
  go_router_builder:
  riverpod_generator:
  dart_mappable_builder: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images.png
    - assets/logger_config.json
