name: pms_app
description: PMS のシェルアプリ。機能パッケージを組み立てるだけを担当する。
version: 0.0.1+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  feature_shared:
    path: ../../packages/core/feature_shared
  # 機能(実装)。アプリだけが依存してよい
  customer:
    path: ../../packages/features/customer
  # ホーム画面から顧客機能の遷移先・命令を使うため
  customer_api:
    path: ../../packages/features/customer_api
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
