name: pms_app
description: PMS のシェルアプリ。機能パッケージを組み立てるだけを担当する。
version: 0.0.1+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

dependencies:
  flutter:
    sdk: flutter
  feature_shared:
    path: ../../packages/core/feature_shared
  settings_keeper:
    path: ../../packages/core/settings_keeper
  # 機能(実装)。アプリだけが依存してよい。契約は xxx_api.dart、実装は xxx.dart を読み込む
  sales:
    path: ../../packages/features/sales
  system:
    path: ../../packages/features/system
  item:
    path: ../../packages/features/item
  production_process:
    path: ../../packages/features/production_process
  purchasing:
    path: ../../packages/features/purchasing
  production_plan:
    path: ../../packages/features/production_plan
  work_record:
    path: ../../packages/features/work_record
  quality_common:
    path: ../../packages/features/quality_common
  quality_document:
    path: ../../packages/features/quality_document
  quality:
    path: ../../packages/features/quality
  resource:
    path: ../../packages/features/resource
  organization:
    path: ../../packages/features/organization
  app_core:
    path: ../../packages/features/app_core
  app_shell:
    path: ../../packages/ui/app_shell
  flutter_localizations:
    sdk: flutter
  shared_master:
    path: ../../packages/features/shared_master
  # アプリ全体のロガー(共有の loggerProvider へ差し込む)
  logger_provider:
    path: ../../packages/infra/logger_provider
  flutter_riverpod: ^3.4.3 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  go_router: ^18.1.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  # テーマ側のロガー(themeLoggerProvider)を差し込むため
  theme_lib:
    path: ../../packages/ui/theme_lib

dev_dependencies:
  entity_screens:
    path: ../../packages/ui/entity_screens
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

flutter:
  uses-material-design: true
