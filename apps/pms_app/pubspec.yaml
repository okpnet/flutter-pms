name: pms_app
description: "PMS のシェルアプリ。GoRouter を構築する。"
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  import_sorter: ^4.6.0
  view_responsiveness:
    path: ../../packages/ui/view_responsiveness
  theme_lib:
    path: ../../packages/ui/theme_lib
  grid_extensions:
    path: ../../packages/ui/grid_extensions
  logger_provider:
    path: ../../packages/infra/logger_provider
  undo_redo:
    path: ../../packages/foundation/undo_redo
  data_strategist:
    path: ../../packages/foundation/data_strategist
  query_builder:
    path: ../../packages/foundation/query_builder
  trina_grid:
    git:
      url: https://github.com/okpnet/trina_grid
      ref: main
  go_router: ^18.1.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  flutter_riverpod: ^3.4.3 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  riverpod_annotation:
  dart_mappable: ^4.8.0
  ntp: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  build_runner: ^2.9.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  go_router_builder:
  riverpod_generator:
  dart_mappable_builder: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images.png
    - assets/logger_config.json
