name: pms_app
description: "PMS のシェルアプリ。GoRouter を構築する。"
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  import_sorter: ^4.6.0
  view_responsiveness:
    path: ../../packages/ui/view_responsiveness
  theme_lib:
    path: ../../packages/ui/theme_lib
  grid_extensions:
    path: ../../packages/ui/grid_extensions
  logger_provider:
    path: ../../packages/infra/logger_provider
  undo_redo:
    path: ../../packages/foundation/undo_redo
  data_strategist:
    path: ../../packages/foundation/data_strategist
  query_builder:
    path: ../../packages/foundation/query_builder
  app_core:
    path: ../../packages/features/app_core
  app_shell:
    path: ../../packages/ui/app_shell
  settings_keeper:
    path: ../../packages/core/settings_keeper
  page_mediator_extension:
    path: ../../packages/core/page_mediator_extension
  maintenance:
    path: ../../packages/features/maintenance
  dashboard_container:
    path: ../../packages/features/dashboard_container
  pms_authenticator:
    path: ../../packages/features/pms_authenticator
  shared_preferences: ^2.5.3
  feature_shared:
    path: ../../packages/core/feature_shared
  organization:
    path: ../../packages/features/organization
  item:
    path: ../../packages/features/item
  resource:
    path: ../../packages/features/resource
  sales:
    path: ../../packages/features/sales
  purchasing:
    path: ../../packages/features/purchasing
  production_plan:
    path: ../../packages/features/production_plan
  production_process:
    path: ../../packages/features/production_process
  quality:
    path: ../../packages/features/quality
  quality_common:
    path: ../../packages/features/quality_common
  quality_document:
    path: ../../packages/features/quality_document
  system:
    path: ../../packages/features/system
  barcode_entry:
    path: ../../packages/features/barcode_entry
  work_record:
    path: ../../packages/features/work_record
  shared_master:
    path: ../../packages/features/shared_master
  slang: ^4.19.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
