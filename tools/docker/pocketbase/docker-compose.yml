name: app-login-service

services:
  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.40.6}
    image: app-login-pocketbase:${PB_VERSION:-0.40.6}
    container_name: pocketbase
    restart: unless-stopped
    env_file: .env
    environment:
      # --- GraphQL (PostGraphile) 連携 -------------------------------------
      # GET /api/app/graphql-token が発行する HS256 JWT の設定。
      # PB_GRAPHQL_JWT_SECRET は PostGraphile の jwtSecret と同じ値にする（空なら 404 = 連携無効）。
      PB_GRAPHQL_JWT_SECRET: ${PB_GRAPHQL_JWT_SECRET:-}
      PB_GRAPHQL_JWT_TTL_SECONDS: ${PB_GRAPHQL_JWT_TTL_SECONDS:-900}
      PB_GRAPHQL_JWT_AUDIENCE: ${PB_GRAPHQL_JWT_AUDIENCE:-postgraphile}
      PB_GRAPHQL_JWT_DB_ROLE: ${PB_GRAPHQL_JWT_DB_ROLE:-app_user}
      PB_GRAPHQL_JWT_ADMIN_DB_ROLE: ${PB_GRAPHQL_JWT_ADMIN_DB_ROLE:-app_admin}
    ports:
      # Caddy を使う本番では PB_BIND=127.0.0.1 にして直接公開しない
      - "${PB_BIND:-0.0.0.0}:${PB_PORT:-8090}:8090"
    volumes:
      # DB (SQLite: data.db / auxiliary.db) とバックアップ
      - type: bind
        source: ${PB_DATA_DIR:-./data/pb_data}
        target: /pb/pb_data
        bind:
          create_host_path: true
      # アップロードファイル実体 (NAS などに分けられる)
      - type: bind
        source: ${PB_STORAGE_DIR:-./data/storage}
        target: /pb/pb_data/storage
        bind:
          create_host_path: true
      # 開発中はホスト側を直接マウント (本番はイメージに焼き込んだものを使うならコメントアウト)
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- 任意: HTTPS 終端 ---------------------------------------------------
  #   docker compose --profile proxy up -d
  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PB_DOMAIN: ${PB_DOMAIN:-localhost}
      PB_PROXY_MAX_BODY: ${PB_PROXY_MAX_BODY:-110MB}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
