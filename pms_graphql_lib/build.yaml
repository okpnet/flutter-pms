targets:
  $default:
    sources:
      - test_postgraphile/**
    builders:
      graphql_codegen:
        options:
          schemaPath: 
            - "test_postgraphile/graphql/schema.graphql" #Typeやらの
          assetsPath: test_postgraphile/**/*.graphql
          outputDirectory: "generated" #生成されたクラスの保管DIR
          clients: #ここが無いとOptionsが生成されない
            - graphql_flutter