# 機能コード・画面コードの一覧(生成: node tools/entity_gen/page_codes.js)。
# 機能コード(1文字) + 画面コード(1文字) = 画面のコード(例: 品目台帳 II)。大文字英数 36 種ずつ。
# 既に割り当てたコードは変えない(バーコードに印字するため)。画面の追加・削除のたびにレビューする。
