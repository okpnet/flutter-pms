mrp:
  title: Material requirements planning
  menu: Material requirements planning
  controlTitle: Material requirements planning (MRP)
  redoLabel: Run as a re-MRP
  redoNote: "Unchecked: calculates only the orders not yet planned (order MRP). Checked: rebuilds all demand after the orders were reviewed (re-MRP)."
  run: Run MRP
  running: Calculating
  elapsed: Elapsed
  empty:
    title: Not run yet
    message: The result appears here after you press "Run MRP".
  confirm:
    titleOrder: Run MRP?
    titleRedo: Run re-MRP?
    warnHeavy: This is heavy and takes time.
    warnWide: It affects a wide range, including other users' work.
    warnRedo: Re-MRP rebuilds all demand, so the impact is even larger than a normal MRP.
    warnLock: You cannot operate or interrupt while it runs.
    cancel: Cancel
    go: Run
  success:
    title: MRP succeeded
    at: Run at
    mode: Mode
    count: Suggestions
    pending: Needs decision
    late: Late
    unit: ""
  mode:
    order: Order MRP
    redo: Re-MRP
  failure:
    title: The calculation could not be completed
    message: Please wait a while and run it again.
    pendingRemains: Suggestions that need a decision remain. Adopt or reject them, then commit.
    cannotCommit: This result cannot be committed because data changed after the calculation, or a newer calculation exists. Please calculate again.
    code: Error code
  result:
    title: MRP result (suggestions)
    search: Search
    decisionFilter: Decision
    all: All
    noRows: No matching suggestions
    lateYes: Late
    lateNo: ""
  columns:
    itemCode: Item code
    itemName: Item name
    symbol: Symbol
    quantity: Quantity
    allocation: Stock allocation
    needDate: Need date
    releaseDate: Release date
    dueDate: Due date
    late: Late
    needUser: Needs decision (flag)
    message: Message
    purchase: Purchase
    production: Production
    outsource: Outsource
    plan: Material plan
    exception: Exception
    supplyRequest: Supply request
    isNew: New
    isChange: Change
    isCancel: Cancel
    isKeep: Keep
    isOption: Switch option
    subjectEquipment: Equipment (overload)
    subjectStock: Stock (excess)
    subjectMaster: Master data (issue)
  check:
    title: 1. Check (master data problems)
    note: Before MRP, checks item master problems (routings, suppliers, calendars, and so on). It only reads and changes nothing. MRP can still run with problems, and they appear as "master problem" suggestions in the result.
    run: Check for problems
    running: Checking
    none: No problems were found.
    count: Problems
    more: Showing up to 30, most serious first.
  step:
    calc: Calculate and review
    calcNote: '"Run MRP" commits straight away when nothing needs a decision. "Calculate and review" only calculates; you review and decide, then commit or discard.'
    ok: Run
    awaitingTitle: Waiting to be committed
    awaitingNote: Decide to adopt or reject the suggestions that need a decision, then commit. Planning data does not change until you commit. Calculating again without committing invalidates this result.
    resumed: Picked up the previous calculation that was waiting to be committed.
    pendingLeft: Suggestions still waiting for a decision
    adoptShown: Adopt the shown suggestions
    rejectShown: Reject the shown suggestions
    commit: Commit
    commitTitle: Commit this result?
    commitNote: Adopted suggestions are applied to material plans, purchase orders, production plans, and allocation reservations.
    commitForce: Reject pending and commit
    commitForceTitle: Reject the pending suggestions and commit?
    commitForceNote: Every suggestion still waiting for a decision is committed as rejected, and the check for data updated after the calculation is skipped.
    discard: Discard
    discardTitle: Discard this result?
    discardNote: Planning data does not change.
  state:
    title: Status
    committed: Committed
    awaiting: Waiting to be committed
  decision:
    pending: Needs decision
    adopted: Adopted
    rejected: Rejected
    info: Info
