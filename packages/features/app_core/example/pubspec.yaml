name: app_core_example
description: "アプリの基盤(ブート・ダッシュボード・エラー・設定・ログアウト)のビジュアルテスト(Windows 向けの単体確認アプリ)。"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dashboard_container:
    path: ../../dashboard_container
  feature_shared:
    path: ../../../core/feature_shared
  go_router: ^18.1.0
  logger_provider:
    path: ../../../infra/logger_provider
  settings_keeper:
    path: ../../../core/settings_keeper
  theme_lib:
    path: ../../../ui/theme_lib
  app_core:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
