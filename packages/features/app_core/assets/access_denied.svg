<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t d">
  <title id="t">アクセスが拒否されたイメージ</title>
  <desc id="d">工場の通路にある、黄と黒の縞模様の枠で囲まれた鋼鉄のドア。かんぬきに南京錠がかかっています。左には「WARNING ACCESS DENIED」の赤い警告板があり、赤いランプのテンキーが付いています。このページを表示する権限がないことを表します。</desc>
  
  <defs>
    <clipPath id="card"><rect width="480" height="360" rx="24"/></clipPath>
    <pattern id="haz" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="#12202a"/><rect width="13" height="26" fill="#f2b705"/>
    </pattern>
    <pattern id="truss" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 0 L30 30 M30 0 L0 30" stroke="#adc5c7" stroke-width="3" fill="none"/>
    </pattern>
  </defs>
  <g clip-path="url(#card)">
    <rect width="480" height="360" fill="#c9dcdd"/>

    <!-- 背景: 上部のトラス、右の支柱、配管、タンク -->
    <rect y="0" width="480" height="36" fill="url(#truss)"/>
    <rect y="0" width="480" height="5" fill="#adc5c7"/><rect y="31" width="480" height="5" fill="#adc5c7"/>
    <rect x="446" y="36" width="30" height="262" fill="url(#truss)"/>
    <rect x="444" y="36" width="4" height="262" fill="#adc5c7"/><rect x="474" y="36" width="4" height="262" fill="#adc5c7"/>
    <rect x="196" y="72" width="256" height="24" rx="12" fill="#adc5c7"/>
    <rect x="426" y="72" width="24" height="122" rx="12" fill="#adc5c7"/>
    <rect x="0" y="118" width="70" height="22" rx="11" fill="#adc5c7"/>
    <rect x="0" y="230" width="34" height="68" rx="6" fill="#adc5c7"/>
    <rect x="404" y="232" width="48" height="66" rx="6" fill="#adc5c7"/>

    <!-- 床 -->
    <rect y="298" width="480" height="62" fill="#9bb4b6"/>
    <rect y="296" width="480" height="4" fill="#adc5c7"/>
    <path d="M0 316 H112 L88 360 M368 316 H480 M368 316 L392 360" fill="none" stroke="#f2b705" stroke-width="4" stroke-linejoin="round"/>

    <!-- 警告板 -->
    <g>
      <rect x="28" y="38" width="140" height="238" rx="5" fill="#16232b" stroke="#b3261e" stroke-width="4"/>
      <rect x="28" y="38" width="140" height="38" rx="5" fill="#b3261e"/>
      <text x="98" y="65" text-anchor="middle" font-family="'Arial Narrow','Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,Arial,sans-serif" font-size="23" font-weight="800" letter-spacing="1" fill="#ffffff">WARNING</text>
      <circle cx="98" cy="134" r="40" fill="none" stroke="#e0584d" stroke-width="3" opacity=".55"/>
      <path d="M82 128 v-16 a16 16 0 0 1 32 0 v16" fill="none" stroke="#e0584d" stroke-width="7" stroke-linecap="round"/>
      <rect x="74" y="126" width="48" height="40" rx="6" fill="#2b3a44" stroke="#e0584d" stroke-width="3"/>
      <circle cx="98" cy="142" r="5.5" fill="#16232b"/><path d="M95.5 144 h5 l2 12 h-9 Z" fill="#16232b"/>
      <text x="98" y="209" text-anchor="middle" font-family="'Arial Narrow','Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#ffffff">ACCESS</text>
      <text x="98" y="248" text-anchor="middle" font-family="'Arial Narrow','Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#ffffff">DENIED</text>
      <rect x="40" y="258" width="116" height="3" rx="1.5" fill="#b3261e"/>
    </g>

    <!-- 鋼鉄のドア（ハザード柄の枠、ヒンジ、かんぬきと南京錠） -->
    <g>
      <rect x="196" y="40" width="212" height="260" rx="4" fill="url(#haz)" stroke="#12202a" stroke-width="3"/>
      <rect x="210" y="54" width="184" height="236" rx="3" fill="#6f8794" stroke="#12202a" stroke-width="3"/>
      <rect x="219" y="62" width="166" height="220" rx="2" fill="#5d7381" stroke="#12202a" stroke-width="2"/>
      <path d="M219 62 H312 L219 196 Z" fill="#a4b8c3" opacity=".28"/>
      <circle cx="226" cy="70" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="378" cy="70" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="226" cy="110" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="378" cy="110" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="226" cy="150" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="378" cy="150" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="226" cy="190" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="378" cy="190" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="226" cy="230" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="378" cy="230" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="226" cy="270" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="378" cy="270" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="262" cy="68" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="262" cy="272" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="302" cy="68" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="302" cy="272" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="342" cy="68" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <circle cx="342" cy="272" r="2.6" fill="#a4b8c3" stroke="#12202a" stroke-width="1"/>
      <g>
        <rect x="203" y="84" width="24" height="32" rx="3" fill="#a4b8c3" stroke="#12202a" stroke-width="2.5"/>
        <circle cx="215" cy="92" r="2.2" fill="#5d7381"/><circle cx="215" cy="108" r="2.2" fill="#5d7381"/>
        <rect x="203" y="226" width="24" height="32" rx="3" fill="#a4b8c3" stroke="#12202a" stroke-width="2.5"/>
        <circle cx="215" cy="234" r="2.2" fill="#5d7381"/><circle cx="215" cy="250" r="2.2" fill="#5d7381"/>
      </g>
      <rect x="288" y="172" width="92" height="10" rx="5" fill="#a4b8c3" stroke="#12202a" stroke-width="2.5"/>
      <rect x="346" y="152" width="26" height="50" rx="3" fill="#6f8794" stroke="#12202a" stroke-width="2.5"/>
      <rect x="352" y="158" width="8" height="38" rx="3" fill="#a4b8c3" stroke="#12202a" stroke-width="1.5"/>
      <rect x="374" y="160" width="14" height="34" rx="3" fill="#6f8794" stroke="#12202a" stroke-width="2.5"/>
      <path d="M354 202 v-9 a8 8 0 0 1 16 0 v9" fill="none" stroke="#12202a" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M354 202 v-9 a8 8 0 0 1 16 0 v9" fill="none" stroke="#a4b8c3" stroke-width="2" stroke-linecap="round"/>
      <rect x="349" y="201" width="26" height="24" rx="4" fill="#a4b8c3" stroke="#12202a" stroke-width="2.5"/>
      <circle cx="362" cy="210" r="3.2" fill="#12202a"/><rect x="360.8" y="210" width="2.4" height="8" rx="1" fill="#12202a"/>
    </g>

    <!-- テンキー（赤いランプ） -->
    <g>
      <rect x="412" y="146" width="30" height="52" rx="4" fill="#27343d" stroke="#12202a" stroke-width="2.5"/>
      <rect x="416" y="151" width="22" height="9" rx="2" fill="#ff5a4d"/>
      <circle cx="427" cy="206" r="3" fill="#ff5a4d"/>
      <rect x="418" y="171" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="425" y="171" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="432" y="171" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="418" y="177" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="425" y="177" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="432" y="177" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="418" y="183" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="425" y="183" width="5" height="4" rx="1" fill="#a4b8c3"/>
      <rect x="432" y="183" width="5" height="4" rx="1" fill="#a4b8c3"/>
    </g>

    <!-- 床のプレート -->
    <g>
      <rect x="146" y="320" width="188" height="30" rx="3" fill="#a4b8c3" stroke="#12202a" stroke-width="2.5"/>
      <text x="240" y="332" text-anchor="middle" font-family="'Arial Narrow','Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,Arial,sans-serif" font-size="8.5" font-weight="700" letter-spacing=".4" fill="#12202a">ACCESS TO PRODUCTION FLOORS</text>
      <text x="240" y="344" text-anchor="middle" font-family="'Arial Narrow','Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,Arial,sans-serif" font-size="8.5" font-weight="700" letter-spacing=".4" fill="#12202a">REQUIRES CLEARANCE</text>
    </g>
  </g>
</svg>
