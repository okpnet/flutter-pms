  inspected: 点検結果を記録しました。次のバーコードを読み取ってください。
  supplied: 支給を登録しました。次のバーコードを読み取ってください。
  qtyOverSupply: 登録できる数量は{remain}{unit}までです。それ以下の数量を入力してください。
  failed: 登録できませんでした。通信の状態を確認して、もう一度お試しください。
