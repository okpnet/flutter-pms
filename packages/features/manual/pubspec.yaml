name: manual
description: "マニュアル(Wiki)。品質管理文書のページを、Markdown を正本に、閲覧・編集(Markdown / ビジュアル)・履歴・書き出しで育てる。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  feature_shared:
    path: ../../core/feature_shared
  baton_lib:
    path: ../../core/baton_lib
  app_shell:
    path: ../../ui/app_shell
  markdown_pdf:
    path: ../../foundation/markdown_pdf
  markdown_ast:
    path: ../../foundation/markdown_ast
  markdown_view:
    path: ../../foundation/markdown_view
  wysiwyg_editor:
    path: ../../foundation/wysiwyg_editor
  approval_stamp:
    path: ../../foundation/approval_stamp
  approval_stamp_view:
    path: ../../ui/approval_stamp_view
  manual_model:
    path: ../../model_providers/manual_model
  pms_graphql:
    path: ../../infra/pms_graphql
  graphql: ^5.2.3
  gql: ^1.0.1
  file_picker: ^13.3.2
  flutter_riverpod: ^3.4.3 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  go_router: ^18.1.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  slang: ^4.19.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

dev_dependencies:
