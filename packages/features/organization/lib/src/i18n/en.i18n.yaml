approvalDefaults:
  title: Standard approval patterns
  back: Back
  hint: Choose, for each kind of registration, the approval pattern that makes it an approval request. "No approval" does not ask for approval. Press Save to apply. Approval patterns themselves (steps and approvers) are registered in the approval pattern ledger.
  none: No approval (not set)
  unknown: '(pattern not in the list) ${id}'
  documentNote: A document (such as the manual) cannot be registered without an approval pattern. When no approval is needed, choose a pattern without approval steps.
  empty: No approval patterns are registered. Register them in the approval pattern ledger.
  loadFailed: Could not load the standard approval patterns.
  unsaved: There are unsaved changes.
  save: Save
  revert: Revert to saved
  saved: Saved.
  saveFailed: Could not save.
