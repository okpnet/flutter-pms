# Company information strings (English). Keys missing here fall back to the base language (ja).
approvalSteps:
  title: Approval steps
  back: Back
  pattern: 'Approval pattern: ${name}'
  hint: Approval goes from the top step down. Drag a row to reorder; the priority is renumbered. Double-click a row to change its department or position, or to delete the step.
  empty: There are no approval steps. Use "Add step" (a pattern with no steps is treated as no approval).
  loadFailed: Could not load the approval steps.
  actionFailed: Could not save. Please try again.
  add: Add step
  colStep: Step
  colDepartment: Department
  colPosition: Position
  stepLabel: 'Step ${n}'
