  unknown: '(一覧に無いパターン) ${id}'
  documentNote: 文書(マニュアルなど)は、承認パターンが無いと登録できません。承認が要らないときは、承認の段が無いパターンを選びます。
  empty: 承認パターンが登録されていません。承認パターンの台帳で登録してください。
  loadFailed: 標準の承認パターンを読み込めませんでした。
  unsaved: 未保存の変更があります。
  save: 保存
  revert: 保存済みに戻す
