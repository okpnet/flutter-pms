  hint: 登録が申請になる対象ごとに、使う承認パターンを選びます。「承認不要」は、その対象の登録で承認を求めません。変更は「保存」で反映されます。承認パターンの登録(承認の段・承認できる人)は、承認パターンの台帳で行います。
