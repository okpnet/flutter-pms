name: user_profile_example
description: "ユーザー情報の表示(顔写真・自分のイメージ)のビジュアルテスト(Windows 向けの単体確認アプリ)。"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  app_shell:
    path: ../../../ui/app_shell
  feature_shared:
    path: ../../../core/feature_shared
  logger_provider:
    path: ../../../infra/logger_provider
  pbapi:
    path: ../../../infra/pbapi
  theme_lib:
    path: ../../../ui/theme_lib
  user_profile:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
