name: theme_lib
description: "機能共通のテーマ管理(システム/ライト/ダーク切替、JSONの取り込み・書き出し)。"
version: 0.1.0
publish_to: "none"

resolution: workspace

environment:
  sdk: ^3.12.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  logger_provider:
    path: ../../infra/logger_provider

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # 追加のテーマ(外部のJSONファイル)。ThemeAssets / ThemeManager.importAssets で取り込む。
  assets:
    - themes/ocean.json
    - themes/forest.json
    - themes/rose.json
