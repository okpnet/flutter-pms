# yaml-language-server: $schema=../../schema.json

UnitPage:
  kind: read
  from: shared_unit
  filter: true # 要件0044レビュー: 他の全Read画面と同様に付与されるべきだが欠落していた
  requiredWhere:
    - languageCode # 要件0044レビュー: labels解決に必要、他の全Read画面と同様に欠落していた
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - shared_unit_id
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 4本)
    - name: spec_measurement_count
      arrayType: toFirstOne
      as: spec_measurement_count
      using: shared_unit_id
      from: v_unit_spec_measurement_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: item_size_kind_count
      arrayType: toFirstOne
      as: item_size_kind_count
      using: shared_unit_id
      from: v_unit_item_size_kind_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: item_lot_count
      arrayType: toFirstOne
      as: item_lot_count
      using: shared_unit_id
      from: v_unit_item_lot_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: envelope_measurement_count
      arrayType: toFirstOne
      as: envelope_measurement_count
      using: shared_unit_id
      from: v_unit_envelope_measurement_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 単位の書き込み
UnitPageEdit:
  kind: edit
  from: shared_unit
  requiredWhere:
    - shared_unit_id  
  generateRfe: true
  columns:
    - shared_unit_id
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields # 要件0044レビュー: 読み込み用アーム(AppellationLabelsReadFields)
        # が誤って参照されていたため編集用アームに修正(他のEdit画面と同じ既知のパターン)
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove
