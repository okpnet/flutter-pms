# complaint_order_page画面 - Edit(ミューテーション)
#
# 画面仕様: source/views/ #ComplaintOrderPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintOrderPageEdit(
  $transComplaintOrderId: UUID!
  $transComplaintId: UUID
  $transOrderId: UUID
  $remarks: String
) {
  updateTransComplaintOrderByTransComplaintOrderId(
    input: {
      transComplaintOrderId: $transComplaintOrderId
      transComplaintOrderPatch: {
        transComplaintId: $transComplaintId
        transOrderId: $transOrderId
        remarks: $remarks
      }
    }
  ) {
    transComplaintOrder {
      transComplaintOrderId
      transComplaintId
      transOrderId
      remarks
    }
  }
}
