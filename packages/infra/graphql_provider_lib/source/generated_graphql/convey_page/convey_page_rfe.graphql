# convey_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #ConveyPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ConveyPageRfe(
  $transConveyId: UUID!
) {
  transConveyByTransConveyId(transConveyId: $transConveyId) {
    transConveyId
    transVisiterId
    receive
    conveyAt
    quantity
    locationHistoryId
    locationId
    staffHistoryId
    staffId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
