# inventory_apply_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #InventoryApplyPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query InventoryApplyPageRead(
  $first: Int!
  $offset: Int
  $filter: TransInventoryApplyFilter = {and: []}
  $orderBy: [TransInventoryAppliesOrderBy!]
  $languageCodeId: UUID!
  $transInventoryRequestId: UUID!
  $removed: Boolean = false
) {
  allTransInventoryApplies(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transInventoryRequestId: { equalTo: $transInventoryRequestId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transInventoryApplyId
      registerAt
      transInventoryRequestId
      conveyId
      staffHistoryId
      staffId
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
