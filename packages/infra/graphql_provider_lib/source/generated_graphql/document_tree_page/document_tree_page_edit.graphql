# document_tree_page画面 - Edit(ミューテーション)
#
# 画面仕様: source/views/ #DocumentTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DocumentTreePageEdit(
  $mstrDocumentTreeId: UUID!
  $parentMstrDocumentId: UUID
  $remarks: String
) {
  updateMstrDocumentTreeByMstrDocumentTreeId(
    input: {
      mstrDocumentTreeId: $mstrDocumentTreeId
      mstrDocumentTreePatch: {
        parentMstrDocumentId: $parentMstrDocumentId
        remarks: $remarks
      }
    }
  ) {
    mstrDocumentTree {
      mstrDocumentTreeId
      parentMstrDocumentId
      remarks
    }
  }
}
