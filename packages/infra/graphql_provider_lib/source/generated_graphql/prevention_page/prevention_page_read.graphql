# prevention_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #PreventionPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PreventionPageRead(
  $first: Int!
  $offset: Int
  $filter: TransPreventionFilter = {and: []}
  $orderBy: [TransPreventionsOrderBy!]
  $languageCodeId: UUID!
  $transRiskId: UUID!
  $removed: Boolean = false
) {
  allTransPreventions(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transRiskId: { equalTo: $transRiskId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPreventionId
      transRiskId

      labels: transLabelByTitles {
        transLabelId

        value: transLabelValuesByTransLabelId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            labelValue
          }
        }
      }

      number

      detailTexts: transTextByDetails {
        transTextId

        value: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            charCount
            leadText
          }
        }
      }

      symbol
      remarks

      prevention_detail_count: vPreventionPreventionDetailCountByTransPreventionId {
        transPreventionId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
