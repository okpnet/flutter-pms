# prevention_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #PreventionPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PreventionPageRfe(
  $transPreventionId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  transPreventionByTransPreventionId(transPreventionId: $transPreventionId) {
    transPreventionId
    transRiskId

    labels: transLabelByTitles {
      transLabelId

      ja: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          transLabelId
          labelValue
        }
      }

      en: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          transLabelId
          labelValue
        }
      }

      remarks
    }

    number

    detailTexts: transTextByDetails {
      transTextId

      ja: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      en: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      remarks
    }

    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
