query TaskRiskPageRfe(
  $transTaskRiskId: UUID!
) {
  transTaskRiskByTransTaskRiskId(transTaskRiskId: $transTaskRiskId) {
    transTaskRiskId
    mstrTaskId
    riskId
    remarks
    updateUserId
