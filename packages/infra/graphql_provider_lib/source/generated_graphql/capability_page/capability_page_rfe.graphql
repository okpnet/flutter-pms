# capability_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #CapabilityPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query CapabilityPageRfe(
  $mstrCapabilityId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  mstrCapabilityByMstrCapabilityId(mstrCapabilityId: $mstrCapabilityId) {
    mstrCapabilityId
    code

    labels: sharedAppellationByNames {
      sharedAppellationsId
      sharedDictionaryBySharedDictionaryNameId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }

      sharedDictionaryBySharedDictionaryPronunciationId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }

      sharedDictionaryBySharedDictionaryNicknameId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }
    }

    detailTexts: sharedTextByDetails {
      sharedTextId

      ja: sharedTextValuesBySharedTextId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          textValue
        }
      }

      en: sharedTextValuesBySharedTextId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          textValue
        }
      }
    }

    referenceValue
    max
    min
    step
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
