# order_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #OrderPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderPageRfe(
  $transOrderId: UUID!
) {
  transOrderByTransOrderId(transOrderId: $transOrderId) {
    transOrderId
    orderNumber
    customerOrderNumber
    stakeholderHistoryId
    stakeholderId
    stakeholderContactHistoryId
    stakeholderContactId
    controlCode1
    controlCode2
    controlCode3
    orderProcessingDate
    deliveryDate
    deadline
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
