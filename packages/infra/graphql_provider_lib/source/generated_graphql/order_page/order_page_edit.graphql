# order_page画面 - Edit(ミューテーション)
#
# 画面仕様: source/views/ #OrderPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OrderPageEdit(
  $transOrderId: UUID!
  $orderNumber: String
  $customerOrderNumber: String
  $stakeholderHistoryId: UUID
  $stakeholderId: UUID
  $stakeholderContactHistoryId: UUID
  $stakeholderContactId: UUID
  $controlCode1: String
  $controlCode2: String
  $controlCode3: String
  $orderProcessingDate: Datetime
  $deliveryDate: Datetime
  $deadline: Datetime
  $remarks: String
) {
  updateTransOrderByTransOrderId(
    input: {
      transOrderId: $transOrderId
      transOrderPatch: {
        orderNumber: $orderNumber
        customerOrderNumber: $customerOrderNumber
        stakeholderHistoryId: $stakeholderHistoryId
        stakeholderId: $stakeholderId
        stakeholderContactHistoryId: $stakeholderContactHistoryId
        stakeholderContactId: $stakeholderContactId
        controlCode1: $controlCode1
        controlCode2: $controlCode2
        controlCode3: $controlCode3
        orderProcessingDate: $orderProcessingDate
        deliveryDate: $deliveryDate
        deadline: $deadline
        remarks: $remarks
      }
    }
  ) {
    transOrder {
      transOrderId
      orderNumber
      customerOrderNumber
      stakeholderHistoryId
      stakeholderId
      stakeholderContactHistoryId
      stakeholderContactId
      controlCode1
      controlCode2
      controlCode3
      orderProcessingDate
      deliveryDate
      deadline
      remarks
    }
  }
}
