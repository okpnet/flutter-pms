# order_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #OrderPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderPageRead(
  $first: Int!
  $offset: Int
  $filter: TransOrderFilter = {and: []}
  $orderBy: [TransOrdersOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransOrders(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transOrderId
      orderNumber
      customerOrderNumber
      stakeholderHistoryId
      stakeholderId
      stakeholderContactHistoryId
      stakeholderContactId
      controlCode1
      controlCode2
      controlCode3
      orderProcessingDate
      deliveryDate
      deadline
      symbol
      remarks

      shipping_order_count: vOrderShippingOrderCountByTransOrderId {
        transOrderId
      }

      order_risk_count: vOrderOrderRiskCountByTransOrderId {
        transOrderId
      }

      order_detail_count: vOrderOrderDetailCountByTransOrderId {
        transOrderId
      }

      complaint_order_count: vOrderComplaintOrderCountByTransOrderId {
        transOrderId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
