# order_detail_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #OrderDetailPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderDetailPageRfe(
  $transOrderDetailId: UUID!
) {
  transOrderDetailByTransOrderDetailId(transOrderDetailId: $transOrderDetailId) {
    transOrderDetailId
    transOrderId
    itemHistoryId
    itemId
    quantity
    cost
    deliveryDate
    deadline
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
