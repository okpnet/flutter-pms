# complaint_file_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #ComplaintFilePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ComplaintFilePageRead(
  $first: Int!
  $offset: Int
  $filter: TransComplaintFileFilter = {and: []}
  $orderBy: [TransComplaintFilesOrderBy!]
  $languageCodeId: UUID!
  $transComplaintId: UUID!
  $removed: Boolean = false
) {
  allTransComplaintFiles(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transComplaintId: { equalTo: $transComplaintId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transComplaintFileId
      transComplaintId
      transFileId
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
