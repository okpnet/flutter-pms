# complaint_file_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #ComplaintFilePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ComplaintFilePageRfe(
  $transComplaintFileId: UUID!
) {
  transComplaintFileByTransComplaintFileId(transComplaintFileId: $transComplaintFileId) {
    transComplaintFileId
    transComplaintId
    transFileId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
