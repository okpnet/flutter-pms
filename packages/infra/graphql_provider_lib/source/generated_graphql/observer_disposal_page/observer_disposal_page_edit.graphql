mutation ObserverDisposalPageEdit(
  $transObserverDisposalId: UUID!
  $enable: Boolean
  $observeSchedule: Datetime
  $observeAt: Datetime
  $observerStaffHistoryId: UUID
  $observerStaffId: UUID
  $remarks: String
) {
  updateTransObserverDisposalByTransObserverDisposalId(
    input: {
      transObserverDisposalId: $transObserverDisposalId
      transObserverDisposalPatch: {
        enable: $enable
        observeSchedule: $observeSchedule
        observeAt: $observeAt
        observerStaffHistoryId: $observerStaffHistoryId
        observerStaffId: $observerStaffId
        remarks: $remarks
      }
    }
  ) {
    transObserverDisposal {
      transObserverDisposalId
      enable
      observeSchedule
      observeAt
      observerStaffHistoryId
      observerStaffId
      remarks
    }
  }
}
