# order_risk_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #OrderRiskPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderRiskPageRead(
  $first: Int!
  $offset: Int
  $filter: TransOrderRiskFilter = {and: []}
  $orderBy: [TransOrderRisksOrderBy!]
  $languageCodeId: UUID!
  $transOrderId: UUID!
  $removed: Boolean = false
) {
  allTransOrderRisks(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transOrderId: { equalTo: $transOrderId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transOrderRiskId
      transOrderId
      transRiskId
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
