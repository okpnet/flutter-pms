# observer_preventive_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #ObserverPreventivePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ObserverPreventivePageRead(
  $first: Int!
  $offset: Int
  $filter: TransObserverPreventiveFilter = {and: []}
  $orderBy: [TransObserverPreventivesOrderBy!]
  $languageCodeId: UUID!
  $transRecurrencePreventionId: UUID!
  $removed: Boolean = false
) {
  allTransObserverPreventives(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transRecurrencePreventionId: { equalTo: $transRecurrencePreventionId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transObserverPreventiveId
      transObserverDisposalId
      transRecurrencePreventionId
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
