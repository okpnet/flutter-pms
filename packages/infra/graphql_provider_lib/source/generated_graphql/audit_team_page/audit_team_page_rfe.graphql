# audit_team_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #AuditTeamPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AuditTeamPageRfe(
  $transAuditTeamId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  transAuditTeamByTransAuditTeamId(transAuditTeamId: $transAuditTeamId) {
    transAuditTeamId
    transAuditId

    labels: transLabelByNames {
      transLabelId

      ja: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          transLabelId
          labelValue
        }
      }

      en: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          transLabelId
          labelValue
        }
      }

      remarks
    }

    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
