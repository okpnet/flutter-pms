# audit_team_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #AuditTeamPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AuditTeamPageRead(
  $first: Int!
  $offset: Int
  $filter: TransAuditTeamFilter = {and: []}
  $orderBy: [TransAuditTeamsOrderBy!]
  $languageCodeId: UUID!
  $transAuditId: UUID!
  $removed: Boolean = false
) {
  allTransAuditTeams(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transAuditId: { equalTo: $transAuditId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transAuditTeamId
      transAuditId

      labels: transLabelByNames {
        transLabelId

        value: transLabelValuesByTransLabelId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            labelValue
          }
        }
      }

      symbol
      remarks

      auditor_count: vAuditTeamAuditorCountByTransAuditTeamId {
        transAuditTeamId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
