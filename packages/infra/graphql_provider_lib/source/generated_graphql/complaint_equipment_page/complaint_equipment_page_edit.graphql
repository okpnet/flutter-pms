# complaint_equipment_page画面 - Edit(ミューテーション)
#
# 画面仕様: source/views/ #ComplaintEquipmentPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintEquipmentPageEdit(
  $transComplaintEquipmentId: UUID!
  $transComplaintId: UUID
  $equipmentHistoryId: UUID
  $equipmentId: UUID
  $remarks: String
) {
  updateTransComplaintEquipmentByTransComplaintEquipmentId(
    input: {
      transComplaintEquipmentId: $transComplaintEquipmentId
      transComplaintEquipmentPatch: {
        transComplaintId: $transComplaintId
        equipmentHistoryId: $equipmentHistoryId
        equipmentId: $equipmentId
        remarks: $remarks
      }
    }
  ) {
    transComplaintEquipment {
      transComplaintEquipmentId
      transComplaintId
      equipmentHistoryId
      equipmentId
      remarks
    }
  }
}
