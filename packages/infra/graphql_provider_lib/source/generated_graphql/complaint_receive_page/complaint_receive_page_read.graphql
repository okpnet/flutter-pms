# complaint_receive_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #ComplaintReceivePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ComplaintReceivePageRead(
  $first: Int!
  $offset: Int
  $filter: TransComplaintReceiveFilter = {and: []}
  $orderBy: [TransComplaintReceivesOrderBy!]
  $languageCodeId: UUID!
  $transComplaintId: UUID!
  $removed: Boolean = false
) {
  allTransComplaintReceives(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transComplaintId: { equalTo: $transComplaintId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transComplaintReceiveId
      transComplaintId
      receiveAt
      receiveStaffHistoryId
      receiveStaffId

      detailTexts: transTextByDetails {
        transTextId

        value: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            charCount
            leadText
          }
        }
      }

      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
