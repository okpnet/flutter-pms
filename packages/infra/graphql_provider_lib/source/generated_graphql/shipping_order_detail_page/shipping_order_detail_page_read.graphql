# shipping_order_detail_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #ShippingOrderDetailPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ShippingOrderDetailPageRead(
  $first: Int!
  $offset: Int
  $filter: TransShippingOrderDetailFilter = {and: []}
  $orderBy: [TransShippingOrderDetailsOrderBy!]
  $languageCodeId: UUID!
  $transShippingOrderId: UUID!
  $removed: Boolean = false
) {
  allTransShippingOrderDetails(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transShippingOrderId: { equalTo: $transShippingOrderId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transShippingOrderDetailId
      transShippingOrderId
      transOrderDetailId
      estimatedShippingDate
      estimatedArrivalDate
      shippingQuantity
      symbol
      remarks

      shipping_order_detail_record_count: vShippingOrderDetailShippingOrderDetailRecordCountByTransShippingOrderDetailId {
        transShippingOrderDetailId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
