# operations_plan_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #OperationsPlanPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OperationsPlanPageRead(
  $first: Int!
  $offset: Int
  $filter: TransOperationsPlanFilter = {and: []}
  $orderBy: [TransOperationsPlansOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransOperationsPlans(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transOperationsPlanId
      transResourcePlanId
      deadline
      symbol
      remarks

      work_plan_count: vOperationsPlanWorkPlanCountByTransOperationsPlanId {
        transOperationsPlanId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
