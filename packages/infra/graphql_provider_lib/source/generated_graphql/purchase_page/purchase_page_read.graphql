# purchase_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #PurchasePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchasePageRead(
  $first: Int!
  $offset: Int
  $filter: TransPurchaseFilter = {and: []}
  $orderBy: [TransPurchasesOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransPurchases(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPurchaseId
      stakeholderHistoryId
      stakeholderId
      stakeholderContactHistoryId
      stakeholderContactId
      purchaseCtrl1
      purchaseCtrl2
      purchaseCtrl3
      registerAt
      purchaseOrderDate
      deadline
      symbol
      remarks

      purchase_detail_count: vPurchasePurchaseDetailCountByTransPurchaseId {
        transPurchaseId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
