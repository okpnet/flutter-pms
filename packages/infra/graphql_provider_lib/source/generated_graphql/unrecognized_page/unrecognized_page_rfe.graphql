# unrecognized_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #UnrecognizedPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query UnrecognizedPageRfe(
  $transUnrecognizedId: UUID!
) {
  transUnrecognizedByTransUnrecognizedId(transUnrecognizedId: $transUnrecognizedId) {
    transUnrecognizedId
    controlCode1
    controlCode2
    controlCode3
    decisionDate
    deadline
    expectedCompletionDate
    plannedShippingDate
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
