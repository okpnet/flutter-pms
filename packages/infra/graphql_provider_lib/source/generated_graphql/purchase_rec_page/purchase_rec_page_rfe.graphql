# purchase_rec_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #PurchaseRecPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchaseRecPageRfe(
  $transPurchaseRecId: UUID!
) {
  transPurchaseRecByTransPurchaseRecId(transPurchaseRecId: $transPurchaseRecId) {
    transPurchaseRecId
    transPurchaseDetailId
    receiveAt
    quantity
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
