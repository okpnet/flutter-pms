# purchase_rec_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #PurchaseRecPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchaseRecPageRead(
  $first: Int!
  $offset: Int
  $filter: TransPurchaseRecFilter = {and: []}
  $orderBy: [TransPurchaseRecsOrderBy!]
  $languageCodeId: UUID!
  $transPurchaseDetailId: UUID!
  $removed: Boolean = false
) {
  allTransPurchaseRecs(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transPurchaseDetailId: { equalTo: $transPurchaseDetailId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPurchaseRecId
      transPurchaseDetailId
      receiveAt
      quantity
      symbol
      remarks

      purchase_rec_visiter_count: vPurchaseRecPurchaseRecVisiterCountByTransPurchaseRecId {
        transPurchaseRecId
      }

      purchase_certification_count: vPurchaseRecPurchaseCertificationCountByTransPurchaseRecId {
        transPurchaseRecId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
