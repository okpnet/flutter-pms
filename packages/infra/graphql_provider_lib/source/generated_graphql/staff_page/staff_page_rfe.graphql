# staff_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #StaffPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query StaffPageRfe(
  $infoStaffId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  infoStaffByInfoStaffId(infoStaffId: $infoStaffId) {
    infoStaffId
    infoCompanyId
    code

    labels: sharedAppellationByNames {
      sharedAppellationsId
      sharedDictionaryBySharedDictionaryNameId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }

      sharedDictionaryBySharedDictionaryPronunciationId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }

      sharedDictionaryBySharedDictionaryNicknameId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }
    }

    sex
    phone
    privatePhone
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
