# resource_plan_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #ResourcePlanPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ResourcePlanPageRead(
  $first: Int!
  $offset: Int
  $filter: TransResourcePlanFilter = {and: []}
  $orderBy: [TransResourcePlansOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransResourcePlans(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transResourcePlanId
      transOrderDetailId
      transUnrecognizedDetailId
      registerAt
      quantity
      inventoryResavation
      deadline
      itemHistoryId
      itemId
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
