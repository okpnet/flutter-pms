# inspect_sch_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #InspectSchPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query InspectSchPageRfe(
  $transInspectSchId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  transInspectSchByTransInspectSchId(transInspectSchId: $transInspectSchId) {
    transInspectSchId
    code

    labels: transLabelByTitles {
      transLabelId

      ja: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          transLabelId
          labelValue
        }
      }

      en: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          transLabelId
          labelValue
        }
      }

      remarks
    }

    equipmentHistoryId
    equipmentId

    requirementTexts: transTextByRequirements {
      transTextId

      ja: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      en: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      remarks
    }

    attentionTexts: transTextByAttentions {
      transTextId

      ja: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      en: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      remarks
    }

    recommendationTexts: transTextByRecommendations {
      transTextId

      ja: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      en: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          transTextId
          textValue
        }
      }

      remarks
    }

    inspectionOperationHistoryId
    inspectionOperationId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
