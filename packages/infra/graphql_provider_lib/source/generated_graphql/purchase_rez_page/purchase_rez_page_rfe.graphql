# purchase_rez_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #PurchaseRezPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchaseRezPageRfe(
  $transPurchaseRezId: UUID!
) {
  transPurchaseRezByTransPurchaseRezId(transPurchaseRezId: $transPurchaseRezId) {
    transPurchaseRezId
    transPurchaseDetailId
    quantity
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
