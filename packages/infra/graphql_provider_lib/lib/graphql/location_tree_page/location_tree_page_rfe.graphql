# location_tree_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #LocationTreePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query LocationTreePageRfe(
  $mstrLocationTreeId: UUID!
) {
  mstrLocationTreeByMstrLocationTreeId(mstrLocationTreeId: $mstrLocationTreeId) {
    mstrLocationTreeId
    parentMstrLocationId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
