# assign_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: source/views/ #AssignPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AssignPageRfe(
  $infoAssignId: UUID!
) {
  infoAssignByInfoAssignId(infoAssignId: $infoAssignId) {
    infoAssignId
    infoStaffId
    infoPositionId
    infoOfficeId
    infoDepartmentId
    enable
    priority
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
