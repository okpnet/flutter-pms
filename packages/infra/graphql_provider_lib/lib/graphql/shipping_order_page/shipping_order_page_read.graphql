# shipping_order_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #ShippingOrderPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ShippingOrderPageRead(
  $first: Int!
  $offset: Int
  $filter: TransShippingOrderFilter = {and: []}
  $orderBy: [TransShippingOrdersOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransShippingOrders(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transShippingOrderId
      transOrderId
      estimatedShippingDate
      code
      estimatedArrivalDate
      stakeholderHistoryId
      stakeholderId
      symbol
      remarks

      shipping_order_detail_count: vShippingOrderShippingOrderDetailCountByTransShippingOrderId {
        transShippingOrderId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
