# currency_rate_latest_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #CurrencyRateLatestPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query CurrencyRateLatestPageRead(
  $first: Int!
  $offset: Int
  $filter: VCurrencyRateLatestFilter = {and: []}
  $orderBy: [VCurrencyRateLatestsOrderBy!]
) {
  allVCurrencyRateLatests(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrCurrencyId
      code
      currencySymbol
      minorUnit
      rateAuto
      isBase
      rateDate
      rate
      autoFetched
      source
      symbol
    }
  }
}
