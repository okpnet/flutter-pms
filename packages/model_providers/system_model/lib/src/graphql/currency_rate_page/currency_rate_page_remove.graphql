# currency_rate_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #CurrencyRatePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation CurrencyRatePageRemove(
  $transExchangeRateId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateTransExchangeRateByTransExchangeRateId(
    input: {
      transExchangeRateId: $transExchangeRateId
      transExchangeRatePatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    transExchangeRate {
      transExchangeRateId
      remove
    }
  }
}
