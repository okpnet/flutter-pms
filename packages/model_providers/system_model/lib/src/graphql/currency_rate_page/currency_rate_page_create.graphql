# currency_rate_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #CurrencyRatePageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation CurrencyRatePageCreate(
  $mstrCurrencyId: UUID
  $rateDate: Date!
  $rate: BigFloat!
  $autoFetched: Boolean
  $source: String
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  createTransExchangeRate(
    input: {
      transExchangeRate: {
        mstrCurrencyId: $mstrCurrencyId
        rateDate: $rateDate
        rate: $rate
        autoFetched: $autoFetched
        source: $source
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    transExchangeRate {
      transExchangeRateId
      mstrCurrencyId
      rateDate
      rate
      autoFetched
      source
      remarks
      updateUserId
      updateUserHistoryId
    }
  }
}
