# unit_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #UnitPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation UnitPageEdit(
  $sharedUnitId: UUID!
  $names: UUID
  $details: UUID
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateSharedUnitBySharedUnitId(
    input: {
      sharedUnitId: $sharedUnitId
      sharedUnitPatch: {
        names: $names
        details: $details
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    sharedUnit {
      sharedUnitId
      names
      details
      remarks
    }
  }
}
