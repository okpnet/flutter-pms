# unit_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #UnitPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query UnitPageRfe(
  $sharedUnitId: UUID!
) {
  sharedUnitBySharedUnitId(sharedUnitId: $sharedUnitId) {
    sharedUnitId
    names
    details
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
