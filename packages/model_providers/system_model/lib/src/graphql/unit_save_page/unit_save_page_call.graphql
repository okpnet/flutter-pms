# unit_save_page画面 - Call(DBの関数の呼び出し)
#
# 画面仕様: gql/*.yaml #UnitSavePageCall
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation UnitSavePageCall(
  $pUnitId: UUID
  $pName: JSON
  $pPronunciation: JSON
  $pNickname: JSON
  $pDetail: JSON
  $pRemarks: String
  $pStaffId: UUID
) {
  unitSave(
    input: {
      pUnitId: $pUnitId
      pName: $pName
      pPronunciation: $pPronunciation
      pNickname: $pNickname
      pDetail: $pDetail
      pRemarks: $pRemarks
      pStaffId: $pStaffId
    }
  ) {
    sharedUnit {
      sharedUnitId
      symbol
      remarks
    }
  }
}
