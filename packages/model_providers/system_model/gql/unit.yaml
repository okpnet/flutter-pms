# yaml-language-server: $schema=../../schema.json

UnitPage:
  kind: read
  from: shared_unit
  filter: true # 要件0044レビュー: 他の全Read画面と同様に付与されるべきだが欠落していた
  requiredWhere:
    - languageCode # 要件0044レビュー: labels解決に必要、他の全Read画面と同様に欠落していた
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - shared_unit_id
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 4本)
    - name: spec_measurement_count
      arrayType: toFirstOne
      as: spec_measurement_count
      using: shared_unit_id
      from: v_unit_spec_measurement_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: item_size_kind_count
      arrayType: toFirstOne
      as: item_size_kind_count
      using: shared_unit_id
      from: v_unit_item_size_kind_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: item_lot_count
      arrayType: toFirstOne
      as: item_lot_count
      using: shared_unit_id
      from: v_unit_item_lot_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: envelope_measurement_count
      arrayType: toFirstOne
      as: envelope_measurement_count
      using: shared_unit_id
      from: v_unit_envelope_measurement_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 単位の更新(平らな列だけ。渡した列だけが変わる。名称(names)・詳細(details)の ID は、共通関数で作る・変える)。論理削除は UnitPageRemove(remove = true)
UnitPageEdit:
  kind: edit
  from: shared_unit
  requiredWhere:
    - shared_unit_id
  generateRfe: true
  withUpdater: true # 更新者(update_user_id・update_user_history_id)を、Edit・Remove の引数にする(ログイン中の担当者を渡す)
  columns:
    - shared_unit_id
    - names
    - details
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# ---- 登録(kind: create)。記号(symbol)は DB が採番する ----
UnitPageCreate:
  kind: create
  from: shared_unit
  columns:
    - names
    - details
    - remarks
    - update_user_id
    - update_user_history_id

# ---- 共通関数(kind: function)。呼称・文章(言語別の値)を作る・変える。返った ID を、本体の names・details に渡す ----
# doc/query/20261116_0001_common_functions.sql。渡した言語の値だけ入れ替える(言語コード → 値 の JSON。例 {"ja": "キログラム"})。空文字で値が空になる(行は残る)。
# 名称には、いずれかの言語に空でない値が必要。担当者は p_staff_id・p_staff_history_id、省略時は JWT の staff_id。
# エラー(errcode): APL00 担当者・言語が無い / APL01 対象が無い / APL02 必須・空にできない / APL03 JSON の型が違う。

# 呼称(名称・読み・略称)の登録・更新(p_appellation_id が無ければ新規)
UnitAppellationSavePageCall:
  kind: function
  mutation: sharedAppellationSave
  returns: sharedAppellation
  columns:
    - shared_appellations_id

# 文章(詳細)の登録・更新(p_text_id が無ければ新規)
UnitTextSavePageCall:
  kind: function
  mutation: sharedTextSave
  returns: sharedText
  columns:
    - shared_text_id
