# yaml-language-server: $schema=../../schema.json

UnitPage:
  kind: read
  from: shared_unit
  filter: true # 要件0044レビュー: 他の全Read画面と同様に付与されるべきだが欠落していた
  requiredWhere:
    - languageCode # 要件0044レビュー: labels解決に必要、他の全Read画面と同様に欠落していた
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - shared_unit_id
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 4本)
    - name: spec_measurement_count
      arrayType: toFirstOne
      as: spec_measurement_count
      using: shared_unit_id
      from: v_unit_spec_measurement_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: item_size_kind_count
      arrayType: toFirstOne
      as: item_size_kind_count
      using: shared_unit_id
      from: v_unit_item_size_kind_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: item_lot_count
      arrayType: toFirstOne
      as: item_lot_count
      using: shared_unit_id
      from: v_unit_item_lot_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: envelope_measurement_count
      arrayType: toFirstOne
      as: envelope_measurement_count
      using: shared_unit_id
      from: v_unit_envelope_measurement_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 単位の書き込み
UnitPageEdit:
  kind: edit
  from: shared_unit
  requiredWhere:
    - shared_unit_id  
  generateRfe: true
  columns:
    - shared_unit_id
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields # 要件0044レビュー: 読み込み用アーム(AppellationLabelsReadFields)
        # が誤って参照されていたため編集用アームに修正(他のEdit画面と同じ既知のパターン)
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# ---- DB の関数(kind: function)。呼称(多言語の辞書)・文章を含む登録・更新を、1回の呼び出し = 1トランザクションで行う ----
# doc/query/20261114_0002_appellation_functions.sql。更新は「渡した項目だけ」(NULL は今のまま。文字は空文字で消す)。
# 名称・読み・略称・詳細は、言語コード → 値 の JSON(例 {"ja": "キログラム"})。渡した言語の値だけ入れ替える。名称の ja は必須。
# 担当者は p_staff_id、省略時は JWT の staff_id。エラー(errcode): APL00 担当者・言語 / APL01 対象が無い / APL02 必須・空にできない / APL03 コードの重複。

# 単位の登録・更新(p_unit_id が無ければ新規)。削除は UnitPageRemove(remove = true)
UnitSavePageCall:
  kind: function
  mutation: unitSave
  returns: sharedUnit
  columns:
    - shared_unit_id
    - symbol
    - remarks
