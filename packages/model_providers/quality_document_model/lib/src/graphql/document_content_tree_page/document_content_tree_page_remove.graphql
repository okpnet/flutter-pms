# document_content_tree_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #DocumentContentTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DocumentContentTreePageRemove(
  $mstrDocumentContentTreeId: UUID!
  $remove: Boolean!
) {
  updateMstrDocumentContentTreeByMstrDocumentContentTreeId(
    input: {
      mstrDocumentContentTreeId: $mstrDocumentContentTreeId
      mstrDocumentContentTreePatch: { remove: $remove }
    }
  ) {
    mstrDocumentContentTree {
      mstrDocumentContentTreeId
      remove
    }
  }
}
