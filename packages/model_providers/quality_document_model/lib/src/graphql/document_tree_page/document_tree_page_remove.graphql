# document_tree_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #DocumentTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DocumentTreePageRemove(
  $mstrDocumentTreeId: UUID!
  $remove: Boolean!
) {
  updateMstrDocumentTreeByMstrDocumentTreeId(
    input: {
      mstrDocumentTreeId: $mstrDocumentTreeId
      mstrDocumentTreePatch: { remove: $remove }
    }
  ) {
    mstrDocumentTree {
      mstrDocumentTreeId
      remove
    }
  }
}
