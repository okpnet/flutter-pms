# document_tree_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #DocumentTreePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query DocumentTreePageRfe(
  $mstrDocumentTreeId: UUID!
) {
  mstrDocumentTreeByMstrDocumentTreeId(mstrDocumentTreeId: $mstrDocumentTreeId) {
    mstrDocumentTreeId
    parentMstrDocumentId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
