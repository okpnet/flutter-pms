# scan_equipment_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ScanEquipmentPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ScanEquipmentPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrEquipmentFilter = {and: []}
  $orderBy: [MstrEquipmentsOrderBy!]
  $removed: Boolean = false
) {
  allMstrEquipments(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrEquipmentId
      code
      symbol
      mstrItemId
    }
  }
}
