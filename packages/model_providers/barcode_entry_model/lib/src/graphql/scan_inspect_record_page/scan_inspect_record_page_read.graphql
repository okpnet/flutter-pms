# scan_inspect_record_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ScanInspectRecordPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ScanInspectRecordPageRead(
  $first: Int!
  $offset: Int
  $filter: TransInspectRecordFilter = {and: []}
  $orderBy: [TransInspectRecordsOrderBy!]
  $transInspectSchDetailId: UUID!
  $removed: Boolean = false
) {
  allTransInspectRecords(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transInspectSchDetailId: { equalTo: $transInspectSchDetailId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transInspectRecordId
      transInspectSchDetailId
      result
      symbol
    }
  }
}
