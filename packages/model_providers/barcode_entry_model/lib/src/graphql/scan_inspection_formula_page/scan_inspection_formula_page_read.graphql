# scan_inspection_formula_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ScanInspectionFormulaPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ScanInspectionFormulaPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrInspectionFormulaFilter = {and: []}
  $orderBy: [MstrInspectionFormulasOrderBy!]
  $removed: Boolean = false
) {
  allMstrInspectionFormulas(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrInspectionFormulaId
      formulaClass
      argClass
      typeClass
      formatClass
    }
  }
}
