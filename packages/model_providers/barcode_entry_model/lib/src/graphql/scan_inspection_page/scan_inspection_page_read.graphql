# scan_inspection_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ScanInspectionPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ScanInspectionPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrInspectionFilter = {and: []}
  $orderBy: [MstrInspectionsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allMstrInspections(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrInspectionId
      code

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }
    }
  }
}
