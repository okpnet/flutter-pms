# scan_container_child_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ScanContainerChildPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ScanContainerChildPageRead(
  $first: Int!
  $offset: Int
  $filter: TransContainerTreeFilter = {and: []}
  $orderBy: [TransContainerTreesOrderBy!]
  $removed: Boolean = false
) {
  allTransContainerTrees(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transContainerTreeId
      transContainerId
      parentTransContainerId
    }
  }
}
