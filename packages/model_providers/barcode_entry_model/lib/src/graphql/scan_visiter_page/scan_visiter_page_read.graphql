# scan_visiter_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ScanVisiterPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ScanVisiterPageRead(
  $first: Int!
  $offset: Int
  $filter: TransVisiterFilter = {and: []}
  $orderBy: [TransVisitersOrderBy!]
  $transContainerId: UUID!
  $removed: Boolean = false
) {
  allTransVisiters(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transContainerId: { equalTo: $transContainerId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transVisiterId
      transContainerId
      status
      quantity
      symbol
    }
  }
}
