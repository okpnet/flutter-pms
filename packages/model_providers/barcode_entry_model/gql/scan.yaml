# yaml-language-server: $schema=../../schema.json
#
# バーコード実績登録(barcode_entry)の読み込み。symbol で対象を引く(読み込み専用。symbol は読込しかできない)。
# 登録(作業実績・入庫/払出・受入)は、work_record_model・purchasing_model の `~PageCreate` を使う。
# 共通の部品(呼称・更新者)は gql_shared を使う。

# 作業指示(工程。trans_work_plan)を symbol で引く。指示数量は作業計画(trans_operations_plan)、品目は資源計画(trans_resource_plan)
ScanWorkPlanPage:
  # 子のレコード数(v_*_count)を読まない軽い読み込み(symbol の照会用。要件0056の対象外)
  lightRead: true
  kind: read
  from: trans_work_plan
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_work_plan_id
    - symbol
    - sequence
    # 登録できるか(停止・打ち切り・全部キャンセルの判定は DB のビュー v_work_plan_registrable。親の生産計画をたどった最上位の受注明細まで見る)
    - name: registrable
      as: registrable
      arrayType: toFirstOne
      using: trans_work_plan_id
      from: v_work_plan_registrable
      pick:
        - registrable
        - stopped
        - closed
    - mstr_task_id
    - name: task
      as: task
      arrayType: toFirstOne
      using: mstr_task_id
      kind: read
      from: mstr_task
      columns:
        - mstr_task_id
        - name: labels
          as: labels
          arrayType: toFirstOne
          using: names
          pick:
            - name
          <<: *AppellationLabelsReadFields
    - trans_operations_plan_id
    - name: operations_plan
      as: operations_plan
      arrayType: toFirstOne
      using: trans_operations_plan_id
      kind: read
      from: trans_operations_plan
      columns:
        - trans_operations_plan_id
        - quantity
        - trans_resource_plan_id
        - name: resource_plan
          as: resource_plan
          arrayType: toFirstOne
          using: trans_resource_plan_id
          kind: read
          from: trans_resource_plan
          columns:
            - trans_resource_plan_id
            - item_id
            - item_history_id

# 作業指示ごとの作業実績(完了数量・開始の判定)
ScanWorkRecordPage:
  # 子のレコード数(v_*_count)を読まない軽い読み込み(symbol の照会用。要件0056の対象外)
  lightRead: true
  kind: read
  from: trans_work_record
  filter: true
  requiredWhere:
    - trans_work_plan_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_work_record_id
    - trans_work_plan_id
    - nth_time
    - start_at
    - stop_at
    - qty

