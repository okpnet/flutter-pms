# 品目を symbol または id で引く(名称つき)
ScanItemPage:
  # 子のレコード数(v_*_count)を読まない軽い読み込み(symbol の照会用。要件0056の対象外)
  lightRead: true
  kind: read
  from: mstr_item
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_item_id
    - code
    - symbol
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
      <<: *AppellationLabelsReadFields
    - name: unit # 単位(略称があれば略称、無ければ正式名で表示する)
      arrayType: toFirstOne
      using: shared_unit_id
      <<: *UnitReadFields

