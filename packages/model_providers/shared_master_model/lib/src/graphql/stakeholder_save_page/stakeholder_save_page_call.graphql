# stakeholder_save_page画面 - Call(DBの関数の呼び出し)
#
# 画面仕様: gql/*.yaml #StakeholderSavePageCall
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation StakeholderSavePageCall(
  $pStakeholderId: UUID
  $pCode: String
  $pControlCode: String
  $pName: JSON
  $pPronunciation: JSON
  $pNickname: JSON
  $pIsCustomer: Boolean
  $pIsSupplier: Boolean
  $pIsLogistics: Boolean
  $pMail: String
  $pShippingKindId: UUID
  $pRemarks: String
  $pStaffId: UUID
  $pClearShippingKind: Boolean
) {
  stakeholderSave(
    input: {
      pStakeholderId: $pStakeholderId
      pCode: $pCode
      pControlCode: $pControlCode
      pName: $pName
      pPronunciation: $pPronunciation
      pNickname: $pNickname
      pIsCustomer: $pIsCustomer
      pIsSupplier: $pIsSupplier
      pIsLogistics: $pIsLogistics
      pMail: $pMail
      pShippingKindId: $pShippingKindId
      pRemarks: $pRemarks
      pStaffId: $pStaffId
      pClearShippingKind: $pClearShippingKind
    }
  ) {
    mstrStakeholder {
      mstrStakeholderId
      code
      symbol
      remarks
    }
  }
}
