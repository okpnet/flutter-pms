# stakeholder_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #StakeholderPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation StakeholderPageEdit(
  $mstrStakeholderId: UUID!
  $remarks: String
) {
  updateMstrStakeholderByMstrStakeholderId(
    input: {
      mstrStakeholderId: $mstrStakeholderId
      mstrStakeholderPatch: {
        remarks: $remarks
      }
    }
  ) {
    mstrStakeholder {
      mstrStakeholderId
      remarks
    }
  }
}
