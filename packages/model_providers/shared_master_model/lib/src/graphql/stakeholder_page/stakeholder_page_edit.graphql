# stakeholder_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #StakeholderPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation StakeholderPageEdit(
  $mstrStakeholderId: UUID!
  $code: String
  $controlCode: String
  $names: UUID
  $isCustomer: Boolean
  $isSupplier: Boolean
  $isLogistics: Boolean
  $mail: String
  $mstrCurrencyId: UUID
  $acceptanceDay: Int
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateMstrStakeholderByMstrStakeholderId(
    input: {
      mstrStakeholderId: $mstrStakeholderId
      mstrStakeholderPatch: {
        code: $code
        controlCode: $controlCode
        names: $names
        isCustomer: $isCustomer
        isSupplier: $isSupplier
        isLogistics: $isLogistics
        mail: $mail
        mstrCurrencyId: $mstrCurrencyId
        acceptanceDay: $acceptanceDay
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    mstrStakeholder {
      mstrStakeholderId
      code
      controlCode
      names
      isCustomer
      isSupplier
      isLogistics
      mail
      mstrCurrencyId
      acceptanceDay
      remarks
    }
  }
}
