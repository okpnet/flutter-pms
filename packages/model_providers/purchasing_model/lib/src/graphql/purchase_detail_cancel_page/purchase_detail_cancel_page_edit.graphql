# purchase_detail_cancel_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #PurchaseDetailCancelPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PurchaseDetailCancelPageEdit(
  $transPurchaseDetailId: UUID!
  $cancelQuantity: BigFloat
) {
  updateTransPurchaseDetailByTransPurchaseDetailId(
    input: {
      transPurchaseDetailId: $transPurchaseDetailId
      transPurchaseDetailPatch: {
        cancelQuantity: $cancelQuantity
      }
    }
  ) {
    transPurchaseDetail {
      transPurchaseDetailId
      cancelQuantity
    }
  }
}
