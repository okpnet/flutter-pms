# purchase_detail_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #PurchaseDetailPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchaseDetailPageRfe(
  $transPurchaseDetailId: UUID!
) {
  transPurchaseDetailByTransPurchaseDetailId(transPurchaseDetailId: $transPurchaseDetailId) {
    transPurchaseDetailId
    transPurchaseId
    transResourcePlanId
    restockingPurchase
    quantity
    cost
    period
    itemHistoryId
    itemId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
