# purchase_detail_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #PurchaseDetailPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PurchaseDetailPageEdit(
  $transPurchaseDetailId: UUID!
  $transPurchaseId: UUID
  $transResourcePlanId: UUID
  $restockingPurchase: Boolean
  $quantity: BigFloat
  $unitPrice: BigFloat
  $priceAdjustment: BigFloat
  $fixedPrice: BigFloat
  $materialSupply: Boolean
  $paidSupply: Boolean
  $period: Datetime
  $itemHistoryId: UUID
  $itemId: UUID
  $remarks: String
) {
  updateTransPurchaseDetailByTransPurchaseDetailId(
    input: {
      transPurchaseDetailId: $transPurchaseDetailId
      transPurchaseDetailPatch: {
        transPurchaseId: $transPurchaseId
        transResourcePlanId: $transResourcePlanId
        restockingPurchase: $restockingPurchase
        quantity: $quantity
        unitPrice: $unitPrice
        priceAdjustment: $priceAdjustment
        fixedPrice: $fixedPrice
        materialSupply: $materialSupply
        paidSupply: $paidSupply
        period: $period
        itemHistoryId: $itemHistoryId
        itemId: $itemId
        remarks: $remarks
      }
    }
  ) {
    transPurchaseDetail {
      transPurchaseDetailId
      transPurchaseId
      transResourcePlanId
      restockingPurchase
      quantity
      unitPrice
      priceAdjustment
      fixedPrice
      materialSupply
      paidSupply
      period
      itemHistoryId
      itemId
      remarks
    }
  }
}
