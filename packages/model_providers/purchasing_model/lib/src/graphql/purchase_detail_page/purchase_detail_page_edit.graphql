# purchase_detail_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #PurchaseDetailPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PurchaseDetailPageEdit(
  $transPurchaseDetailId: UUID!
  $transPurchaseId: UUID
  $transResourcePlanId: UUID
  $restockingPurchase: Boolean
  $quantity: BigFloat
  $cost: BigFloat
  $period: Datetime
  $itemHistoryId: UUID
  $itemId: UUID
  $remarks: String
) {
  updateTransPurchaseDetailByTransPurchaseDetailId(
    input: {
      transPurchaseDetailId: $transPurchaseDetailId
      transPurchaseDetailPatch: {
        transPurchaseId: $transPurchaseId
        transResourcePlanId: $transResourcePlanId
        restockingPurchase: $restockingPurchase
        quantity: $quantity
        cost: $cost
        period: $period
        itemHistoryId: $itemHistoryId
        itemId: $itemId
        remarks: $remarks
      }
    }
  ) {
    transPurchaseDetail {
      transPurchaseDetailId
      transPurchaseId
      transResourcePlanId
      restockingPurchase
      quantity
      cost
      period
      itemHistoryId
      itemId
      remarks
    }
  }
}
