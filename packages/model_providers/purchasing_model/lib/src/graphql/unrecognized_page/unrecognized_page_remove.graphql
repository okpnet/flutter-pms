# unrecognized_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #UnrecognizedPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation UnrecognizedPageRemove(
  $transUnrecognizedId: UUID!
  $remove: Boolean!
) {
  updateTransUnrecognizedByTransUnrecognizedId(
    input: {
      transUnrecognizedId: $transUnrecognizedId
      transUnrecognizedPatch: { remove: $remove }
    }
  ) {
    transUnrecognized {
      transUnrecognizedId
      remove
    }
  }
}
