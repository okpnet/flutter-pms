# purchase_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #PurchasePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchasePageRfe(
  $transPurchaseId: UUID!
) {
  transPurchaseByTransPurchaseId(transPurchaseId: $transPurchaseId) {
    transPurchaseId
    stakeholderHistoryId
    stakeholderId
    stakeholderContactHistoryId
    stakeholderContactId
    purchaseCtrl1
    purchaseCtrl2
    purchaseCtrl3
    registerAt
    purchaseOrderDate
    deadline
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
