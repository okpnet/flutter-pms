# purchase_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #PurchasePageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PurchasePageCreate(
  $stakeholderHistoryId: UUID
  $stakeholderId: UUID
  $registerAt: Datetime
  $purchaseOrderDate: Datetime
  $deadline: Datetime
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  createTransPurchase(
    input: {
      transPurchase: {
        stakeholderHistoryId: $stakeholderHistoryId
        stakeholderId: $stakeholderId
        registerAt: $registerAt
        purchaseOrderDate: $purchaseOrderDate
        deadline: $deadline
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    transPurchase {
      transPurchaseId
      stakeholderHistoryId
      stakeholderId
      registerAt
      purchaseOrderDate
      deadline
      remarks
      updateUserId
      updateUserHistoryId
    }
  }
}
