# unrecognized_detail_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #UnrecognizedDetailPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation UnrecognizedDetailPageEdit(
  $transUnrecognizedDetailId: UUID!
  $transUnrecognizedId: UUID
  $quantity: BigFloat
  $unitPrice: BigFloat
  $priceAdjustment: BigFloat
  $fixedPrice: BigFloat
  $materialSupply: Boolean
  $paidSupply: Boolean
  $deadline: Datetime
  $itemHistoryId: UUID
  $itemId: UUID
  $remarks: String
) {
  updateTransUnrecognizedDetailByTransUnrecognizedDetailId(
    input: {
      transUnrecognizedDetailId: $transUnrecognizedDetailId
      transUnrecognizedDetailPatch: {
        transUnrecognizedId: $transUnrecognizedId
        quantity: $quantity
        unitPrice: $unitPrice
        priceAdjustment: $priceAdjustment
        fixedPrice: $fixedPrice
        materialSupply: $materialSupply
        paidSupply: $paidSupply
        deadline: $deadline
        itemHistoryId: $itemHistoryId
        itemId: $itemId
        remarks: $remarks
      }
    }
  ) {
    transUnrecognizedDetail {
      transUnrecognizedDetailId
      transUnrecognizedId
      quantity
      unitPrice
      priceAdjustment
      fixedPrice
      materialSupply
      paidSupply
      deadline
      itemHistoryId
      itemId
      remarks
    }
  }
}
