# purchase_rec_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #PurchaseRecPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PurchaseRecPageEdit(
  $transPurchaseRecId: UUID!
  $transPurchaseDetailId: UUID
  $receiveAt: Datetime
  $quantity: BigFloat
  $remarks: String
) {
  updateTransPurchaseRecByTransPurchaseRecId(
    input: {
      transPurchaseRecId: $transPurchaseRecId
      transPurchaseRecPatch: {
        transPurchaseDetailId: $transPurchaseDetailId
        receiveAt: $receiveAt
        quantity: $quantity
        remarks: $remarks
      }
    }
  ) {
    transPurchaseRec {
      transPurchaseRecId
      transPurchaseDetailId
      receiveAt
      quantity
      remarks
    }
  }
}
