# complaint_purchase_rec_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #ComplaintPurchaseRecPageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintPurchaseRecPageCreate(
  $transComplaintId: UUID
  $transPurchaseRecId: UUID
  $quantity: BigFloat
  $remarks: String
) {
  createTransComplaintPurchaseRec(
    input: {
      transComplaintPurchaseRec: {
        transComplaintId: $transComplaintId
        transPurchaseRecId: $transPurchaseRecId
        quantity: $quantity
        remarks: $remarks
      }
    }
  ) {
    transComplaintPurchaseRec {
      transComplaintPurchaseRecId
      transComplaintId
      transPurchaseRecId
      quantity
      remarks
    }
  }
}
