# yaml-language-server: $schema=../../schema.json

# 発注金額合計(supplier × item × 納期 × 受入済み)(ダッシュボード用。要件20261027_0001)
PurchaseAmountPage:
  kind: read
  from: v_purchase_amount
  filter: true
  columns:
    - supplier_id
    - mstr_item_kind_id
    - mstr_item_id
    - mstr_item_provision_ids
    - period
    - is_received
    - purchase_detail_count
    - purchase_quantity
    - received_quantity
    - purchase_amount
    - received_amount
