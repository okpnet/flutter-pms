# yaml-language-server: $schema=../../schema.json

# 発注明細の残(v_purchase_detail_balance)。停止中は open_quantity が 0。全部キャンセルは cancel_closed で判定する。
PurchaseDetailBalancePage:
  kind: read
  from: v_purchase_detail_balance
  filter: true
  columns:
    - trans_purchase_detail_id
    - symbol
    - trans_purchase_id
    - item_id
    - stop
    - material_supply
    - paid_supply
    - is_outsource
    - quantity
    - cancel_quantity
    - received_quantity
    - returned_quantity
    - replacement_quantity
    - remaining_quantity
    - open_quantity
    - cancel_closed

# ---- 更新(キャンセル・停止。計画変更の登録と一緒に行う。数量そのものは書き換えない) ----

# 発注明細のキャンセル数量(累計。0 ≤ cancel_quantity ≤ quantity)
PurchaseDetailCancelPageEdit:
  kind: edit
  from: trans_purchase_detail
  requiredWhere:
    - trans_purchase_detail_id
  columns:
    - trans_purchase_detail_id
    - cancel_quantity
    - update_user_id
    - update_user_history_id

# 発注明細の停止・再開
PurchaseDetailStopPageEdit:
  kind: edit
  from: trans_purchase_detail
  requiredWhere:
    - trans_purchase_detail_id
  columns:
    - trans_purchase_detail_id
    - stop
    - update_user_id
    - update_user_history_id
