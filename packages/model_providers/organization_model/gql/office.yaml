# yaml-language-server: $schema=../../schema.json

# 事業所の読み込み
# (要件0034追記4: CompanyPage.officesがこのOfficePageをアンカー参照するため、
#  YAMLのアンカー/エイリアスの制約上、CompanyPageより前に定義する必要がある。
#  以前はCompanyPageより後に定義されており、標準的なYAMLパーサでは
#  前方参照エラーになる不具合があったため、この位置に移動した)
OfficePage: &OfficePage
  kind: read
  from: info_office
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_office_id
    - info_company_id
    - info_address_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: # 2026/09/29　追加
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: info_address_id
      as: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *AddressReadFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 事業所の更新(平らな列だけ。渡した列だけが変わる。名称(names)の ID は共通関数で、住所(info_address_id)は住所の登録・更新で作る)。論理削除は OfficePageRemove(remove = true)
OfficePageEdit:
  kind: edit
  from: info_office
  requiredWhere:
    - info_office_id
  generateRfe: true
  withUpdater: true
  columns:
    - info_office_id
    - info_company_id
    - code
    - names
    - info_address_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 事業所の登録(kind: create)。記号(symbol)は DB が採番する
OfficePageCreate:
  kind: create
  from: info_office
  columns:
    - info_company_id
    - code
    - names
    - info_address_id
    - remarks
    - update_user_id
    - update_user_history_id

# 事業所の住所の更新・登録(住所は事業所と 1 対 1。住所1・住所2・建物は呼称の ID で、共通関数で作る)
OfficeAddressPageEdit:
  kind: edit
  from: info_address
  requiredWhere:
    - info_address_id
  generateRfe: true
  withUpdater: true
  columns:
    - info_address_id
    - country_code_2
    - zip_code
    - address1
    - address2
    - building
    - phone
    - fax_number
    - update_user_id
    - update_user_history_id

OfficeAddressPageCreate:
  kind: create
  from: info_address
  columns:
    - country_code_2
    - zip_code
    - address1
    - address2
    - building
    - phone
    - fax_number
    - update_user_id
    - update_user_history_id

# 共通関数(kind: function)。呼称(言語別の値)を作る・変える。名称・住所1・住所2・建物のそれぞれで呼ぶ
OfficeAppellationSavePageCall:
  kind: function
  mutation: sharedAppellationSave
  returns: sharedAppellation
  columns:
    - shared_appellations_id
