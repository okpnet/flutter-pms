# staff_icon_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #StaffIconPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query StaffIconPageRfe(
  $infoStaffIconId: UUID!
) {
  infoStaffIconByInfoStaffIconId(infoStaffIconId: $infoStaffIconId) {
    infoStaffIconId
    staffId
    staffHistoryId
    names
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
