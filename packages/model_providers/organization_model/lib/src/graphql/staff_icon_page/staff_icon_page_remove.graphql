# staff_icon_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #StaffIconPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation StaffIconPageRemove(
  $infoStaffIconId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateInfoStaffIconByInfoStaffIconId(
    input: {
      infoStaffIconId: $infoStaffIconId
      infoStaffIconPatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    infoStaffIcon {
      infoStaffIconId
      remove
    }
  }
}
