# assign_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #AssignPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AssignPageEdit(
  $infoAssignId: UUID!
  $infoStaffId: UUID
  $infoPositionId: UUID
  $infoOfficeId: UUID
  $infoDepartmentId: UUID
  $enable: Boolean
  $priority: Int
  $remarks: String
) {
  updateInfoAssignByInfoAssignId(
    input: {
      infoAssignId: $infoAssignId
      infoAssignPatch: {
        infoStaffId: $infoStaffId
        infoPositionId: $infoPositionId
        infoOfficeId: $infoOfficeId
        infoDepartmentId: $infoDepartmentId
        enable: $enable
        priority: $priority
        remarks: $remarks
      }
    }
  ) {
    infoAssign {
      infoAssignId
      infoStaffId
      infoPositionId
      infoOfficeId
      infoDepartmentId
      enable
      priority
      remarks
    }
  }
}
