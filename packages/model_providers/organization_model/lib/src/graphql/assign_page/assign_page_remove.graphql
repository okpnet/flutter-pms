# assign_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #AssignPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AssignPageRemove(
  $infoAssignId: UUID!
  $remove: Boolean!
) {
  updateInfoAssignByInfoAssignId(
    input: {
      infoAssignId: $infoAssignId
      infoAssignPatch: { remove: $remove }
    }
  ) {
    infoAssign {
      infoAssignId
      remove
    }
  }
}
