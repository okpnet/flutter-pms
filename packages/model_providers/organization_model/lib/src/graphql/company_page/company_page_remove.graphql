# company_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #CompanyPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation CompanyPageRemove(
  $infoCompanyId: UUID!
  $remove: Boolean!
) {
  updateInfoCompanyByInfoCompanyId(
    input: {
      infoCompanyId: $infoCompanyId
      infoCompanyPatch: { remove: $remove }
    }
  ) {
    infoCompany {
      infoCompanyId
      remove
    }
  }
}
