# approval_defaults_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ApprovalDefaultsPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ApprovalDefaultsPageRead(
  $first: Int!
  $offset: Int
  $filter: InfoAppFilter = {and: []}
  $orderBy: [InfoAppsOrderBy!]
  $removed: Boolean = false
) {
  allInfoApps(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoAppId
      documentApprovalPatternId
      orderApprovalPatternId
      purchaseApprovalPatternId
      unrecognizedApprovalPatternId
      shippingOrderApprovalPatternId
      complaintApprovalPatternId
      disposalApprovalPatternId
      recurrencePreventionApprovalPatternId
      updateAt
      remove
    }
  }
}
