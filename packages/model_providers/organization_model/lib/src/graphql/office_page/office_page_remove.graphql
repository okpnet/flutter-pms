# office_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #OfficePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OfficePageRemove(
  $infoOfficeId: UUID!
  $remove: Boolean!
) {
  updateInfoOfficeByInfoOfficeId(
    input: {
      infoOfficeId: $infoOfficeId
      infoOfficePatch: { remove: $remove }
    }
  ) {
    infoOffice {
      infoOfficeId
      remove
    }
  }
}
