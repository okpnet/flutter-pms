# office_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #OfficePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OfficePageEdit(
  $infoOfficeId: UUID!
  $infoCompanyId: UUID
  $code: String
  $names: UUID
  $infoAddressId: UUID
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateInfoOfficeByInfoOfficeId(
    input: {
      infoOfficeId: $infoOfficeId
      infoOfficePatch: {
        infoCompanyId: $infoCompanyId
        code: $code
        names: $names
        infoAddressId: $infoAddressId
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    infoOffice {
      infoOfficeId
      infoCompanyId
      code
      names
      infoAddressId
      remarks
    }
  }
}
