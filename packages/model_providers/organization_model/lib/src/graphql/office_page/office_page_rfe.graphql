# office_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #OfficePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OfficePageRfe(
  $infoOfficeId: UUID!
) {
  infoOfficeByInfoOfficeId(infoOfficeId: $infoOfficeId) {
    infoOfficeId
    infoCompanyId
    code
    names
    infoAddressId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
