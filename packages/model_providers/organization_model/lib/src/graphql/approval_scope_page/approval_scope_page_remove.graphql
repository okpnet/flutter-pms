# approval_scope_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ApprovalScopePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ApprovalScopePageRemove(
  $mstrApprovalScopePatternId: UUID!
  $remove: Boolean!
) {
  updateMstrApprovalScopePatternByMstrApprovalScopePatternId(
    input: {
      mstrApprovalScopePatternId: $mstrApprovalScopePatternId
      mstrApprovalScopePatternPatch: { remove: $remove }
    }
  ) {
    mstrApprovalScopePattern {
      mstrApprovalScopePatternId
      remove
    }
  }
}
