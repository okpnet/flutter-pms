# approval_operation_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ApprovalOperationPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ApprovalOperationPageRemove(
  $mstrApprovalPatternId: UUID!
  $remove: Boolean!
) {
  updateMstrApprovalPatternByMstrApprovalPatternId(
    input: {
      mstrApprovalPatternId: $mstrApprovalPatternId
      mstrApprovalPatternPatch: { remove: $remove }
    }
  ) {
    mstrApprovalPattern {
      mstrApprovalPatternId
      remove
    }
  }
}
