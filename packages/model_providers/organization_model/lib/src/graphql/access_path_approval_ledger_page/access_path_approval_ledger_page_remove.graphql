# access_path_approval_ledger_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #AccessPathApprovalLedgerPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AccessPathApprovalLedgerPageRemove(
  $infoAccessPathApprovalId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateInfoAccessPathApprovalByInfoAccessPathApprovalId(
    input: {
      infoAccessPathApprovalId: $infoAccessPathApprovalId
      infoAccessPathApprovalPatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    infoAccessPathApproval {
      infoAccessPathApprovalId
      remove
    }
  }
}
