# department_tree_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #DepartmentTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DepartmentTreePageRemove(
  $infoDepartmentTreeId: UUID!
  $remove: Boolean!
) {
  updateInfoDepartmentTreeByInfoDepartmentTreeId(
    input: {
      infoDepartmentTreeId: $infoDepartmentTreeId
      infoDepartmentTreePatch: { remove: $remove }
    }
  ) {
    infoDepartmentTree {
      infoDepartmentTreeId
      remove
    }
  }
}
