# position_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #PositionPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PositionPageRemove(
  $infoPositionId: UUID!
  $remove: Boolean!
) {
  updateInfoPositionByInfoPositionId(
    input: {
      infoPositionId: $infoPositionId
      infoPositionPatch: { remove: $remove }
    }
  ) {
    infoPosition {
      infoPositionId
      remove
    }
  }
}
