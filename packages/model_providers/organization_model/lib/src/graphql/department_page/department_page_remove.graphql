# department_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #DepartmentPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DepartmentPageRemove(
  $infoDepartmentId: UUID!
  $remove: Boolean!
) {
  updateInfoDepartmentByInfoDepartmentId(
    input: {
      infoDepartmentId: $infoDepartmentId
      infoDepartmentPatch: { remove: $remove }
    }
  ) {
    infoDepartment {
      infoDepartmentId
      remove
    }
  }
}
