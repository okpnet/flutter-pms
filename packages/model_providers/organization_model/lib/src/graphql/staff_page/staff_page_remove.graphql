# staff_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #StaffPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation StaffPageRemove(
  $infoStaffId: UUID!
  $remove: Boolean!
) {
  updateInfoStaffByInfoStaffId(
    input: {
      infoStaffId: $infoStaffId
      infoStaffPatch: { remove: $remove }
    }
  ) {
    infoStaff {
      infoStaffId
      remove
    }
  }
}
