# staff_ledger_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #StaffLedgerPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation StaffLedgerPageRemove(
  $infoStaffId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateInfoStaffByInfoStaffId(
    input: {
      infoStaffId: $infoStaffId
      infoStaffPatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    infoStaff {
      infoStaffId
      remove
    }
  }
}
