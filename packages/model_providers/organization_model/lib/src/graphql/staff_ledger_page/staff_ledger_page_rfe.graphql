# staff_ledger_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #StaffLedgerPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query StaffLedgerPageRfe(
  $infoStaffId: UUID!
) {
  infoStaffByInfoStaffId(infoStaffId: $infoStaffId) {
    infoStaffId
    code
    names
    sex
    phone
    privatePhone
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
