# shipping_order_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ShippingOrderPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ShippingOrderPageRemove(
  $transShippingOrderId: UUID!
  $remove: Boolean!
) {
  updateTransShippingOrderByTransShippingOrderId(
    input: {
      transShippingOrderId: $transShippingOrderId
      transShippingOrderPatch: { remove: $remove }
    }
  ) {
    transShippingOrder {
      transShippingOrderId
      remove
    }
  }
}
