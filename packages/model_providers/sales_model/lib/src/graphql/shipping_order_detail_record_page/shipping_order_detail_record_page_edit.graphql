# shipping_order_detail_record_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #ShippingOrderDetailRecordPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ShippingOrderDetailRecordPageEdit(
  $transShippingOrderDetailRecordId: UUID!
  $transShippingOrderDetailId: UUID
  $shippingDate: Datetime
  $shippingQuantity: BigFloat
  $remarks: String
) {
  updateTransShippingOrderDetailRecordByTransShippingOrderDetailRecordId(
    input: {
      transShippingOrderDetailRecordId: $transShippingOrderDetailRecordId
      transShippingOrderDetailRecordPatch: {
        transShippingOrderDetailId: $transShippingOrderDetailId
        shippingDate: $shippingDate
        shippingQuantity: $shippingQuantity
        remarks: $remarks
      }
    }
  ) {
    transShippingOrderDetailRecord {
      transShippingOrderDetailRecordId
      transShippingOrderDetailId
      shippingDate
      shippingQuantity
      remarks
    }
  }
}
