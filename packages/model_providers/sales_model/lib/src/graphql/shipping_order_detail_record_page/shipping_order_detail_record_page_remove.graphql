# shipping_order_detail_record_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ShippingOrderDetailRecordPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ShippingOrderDetailRecordPageRemove(
  $transShippingOrderDetailRecordId: UUID!
  $remove: Boolean!
) {
  updateTransShippingOrderDetailRecordByTransShippingOrderDetailRecordId(
    input: {
      transShippingOrderDetailRecordId: $transShippingOrderDetailRecordId
      transShippingOrderDetailRecordPatch: { remove: $remove }
    }
  ) {
    transShippingOrderDetailRecord {
      transShippingOrderDetailRecordId
      remove
    }
  }
}
