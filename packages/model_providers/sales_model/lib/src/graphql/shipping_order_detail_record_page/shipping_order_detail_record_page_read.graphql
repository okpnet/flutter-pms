# shipping_order_detail_record_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ShippingOrderDetailRecordPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ShippingOrderDetailRecordPageRead(
  $first: Int!
  $offset: Int
  $filter: TransShippingOrderDetailRecordFilter = {and: []}
  $orderBy: [TransShippingOrderDetailRecordsOrderBy!]
  $languageCodeId: UUID!
  $transShippingOrderDetailId: UUID!
  $removed: Boolean = false
) {
  allTransShippingOrderDetailRecords(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transShippingOrderDetailId: { equalTo: $transShippingOrderDetailId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transShippingOrderDetailRecordId
      transShippingOrderDetailId
      shippingDate
      shippingQuantity
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
