# order_detail_balance_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #OrderDetailBalancePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderDetailBalancePageRead(
  $first: Int!
  $offset: Int
  $filter: VOrderDetailBalanceFilter = {and: []}
  $orderBy: [VOrderDetailBalancesOrderBy!]
) {
  allVOrderDetailBalances(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transOrderDetailId
      symbol
      transOrderId
      itemId
      stop
      customerProperty
      quantity
      cancelQuantity
      shippedQuantity
      returnedQuantity
      replacementQuantity
      remainingQuantity
      openQuantity
      cancelClosed
      settlementAmount
    }
  }
}
