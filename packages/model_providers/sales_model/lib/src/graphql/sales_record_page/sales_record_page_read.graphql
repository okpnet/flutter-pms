# sales_record_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #SalesRecordPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query SalesRecordPageRead(
  $first: Int!
  $offset: Int
  $filter: VSalesRecordFilter = {and: []}
  $orderBy: [VSalesRecordsOrderBy!]
) {
  allVSalesRecords(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      customerId
      mstrItemKindId
      mstrItemId
      mstrItemProvisionIds
      deliveryDate
      isShipped
      orderDetailCount
      orderQuantity
      shippedQuantity
      orderAmount
      shippedAmount
    }
  }
}
