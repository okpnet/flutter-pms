# order_detail_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #OrderDetailPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OrderDetailPageEdit(
  $transOrderDetailId: UUID!
  $transOrderId: UUID
  $itemHistoryId: UUID
  $itemId: UUID
  $quantity: BigFloat
  $unitPrice: BigFloat
  $priceAdjustment: BigFloat
  $fixedPrice: BigFloat
  $deliveryDate: Datetime
  $deadline: Datetime
  $remarks: String
) {
  updateTransOrderDetailByTransOrderDetailId(
    input: {
      transOrderDetailId: $transOrderDetailId
      transOrderDetailPatch: {
        transOrderId: $transOrderId
        itemHistoryId: $itemHistoryId
        itemId: $itemId
        quantity: $quantity
        unitPrice: $unitPrice
        priceAdjustment: $priceAdjustment
        fixedPrice: $fixedPrice
        deliveryDate: $deliveryDate
        deadline: $deadline
        remarks: $remarks
      }
    }
  ) {
    transOrderDetail {
      transOrderDetailId
      transOrderId
      itemHistoryId
      itemId
      quantity
      unitPrice
      priceAdjustment
      fixedPrice
      deliveryDate
      deadline
      remarks
    }
  }
}
