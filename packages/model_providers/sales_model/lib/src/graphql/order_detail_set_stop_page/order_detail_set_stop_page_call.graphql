# order_detail_set_stop_page画面 - Call(DBの関数の呼び出し)
#
# 画面仕様: gql/*.yaml #OrderDetailSetStopPageCall
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OrderDetailSetStopPageCall(
  $pOrderDetailId: UUID
  $pStop: Boolean
  $pChangeReasonId: UUID
  $pReason: String
  $pStakeholderId: UUID
  $pStaffId: UUID
  $pParentPlanChangeId: UUID
  $pRemarks: String
) {
  orderDetailSetStop(
    input: {
      pOrderDetailId: $pOrderDetailId
      pStop: $pStop
      pChangeReasonId: $pChangeReasonId
      pReason: $pReason
      pStakeholderId: $pStakeholderId
      pStaffId: $pStaffId
      pParentPlanChangeId: $pParentPlanChangeId
      pRemarks: $pRemarks
    }
  ) {
    transPlanChange {
      transPlanChangeId
      changeAt
      oldQuantity
      newQuantity
      cancelQuantity
      oldStop
      newStop
      discontinue
      release
      hold
      scrap
      deliver
      transContainerId
      symbol
    }
  }
}
