# shipping_order_detail_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ShippingOrderDetailPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ShippingOrderDetailPageRemove(
  $transShippingOrderDetailId: UUID!
  $remove: Boolean!
) {
  updateTransShippingOrderDetailByTransShippingOrderDetailId(
    input: {
      transShippingOrderDetailId: $transShippingOrderDetailId
      transShippingOrderDetailPatch: { remove: $remove }
    }
  ) {
    transShippingOrderDetail {
      transShippingOrderDetailId
      remove
    }
  }
}
