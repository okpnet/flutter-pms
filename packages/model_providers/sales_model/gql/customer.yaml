# yaml-language-server: $schema=../../schema.json

# 顧客
CustomerPage:
  kind: read
  <<: *StakeholderReadFields
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
    - column: is_customer
      operator: =
      value: true

# 顧客の書き込み(0055追加: page.mdの顧客情報)
CustomerPageEdit:
  kind: edit
  <<: *StakeholderEditFields
  generateRfe: true
