# yaml-language-server: $schema=../../schema.json

# 出荷予定受注実績状況(ダッシュボード用。要件20261027_0001)
ShippingOrderStatusPage:
  kind: read
  from: v_shipping_order_status
  filter: true
  columns:
    - customer_id
    - mstr_item_kind_id
    - mstr_item_id
    - mstr_item_provision_ids
    - delivery_date
    - estimated_shipping_date
    - shipping_date
    - shipping_detail_count
    - shipped_detail_count
    - scheduled_quantity
    - shipped_quantity
    - remaining_quantity
    - scheduled_amount
    - shipped_amount
