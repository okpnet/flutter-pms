# yaml-language-server: $schema=../../schema.json

# 受注明細の残(v_order_detail_balance)。残 = 数量 − キャンセル + 代品ありの返品 − 出荷。
# 停止中は open_quantity が 0。全部キャンセルは cancel_closed で判定する(数量・キャンセル数量を自前で計算しない)。
OrderDetailBalancePage:
  kind: read
  from: v_order_detail_balance
  filter: true
  columns:
    - trans_order_detail_id
    - symbol
    - trans_order_id
    - item_id
    - stop
    - customer_property
    - quantity
    - cancel_quantity
    - shipped_quantity
    - returned_quantity
    - replacement_quantity
    - remaining_quantity
    - open_quantity
    - cancel_closed
    - settlement_amount

# 受注明細精算(trans_order_detail_settlement。精算1件 = 請求書1行。読み取り。登録は DB の関数ができてから)
OrderDetailSettlementPage:
  kind: read
  from: trans_order_detail_settlement
  filter: true
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - trans_order_detail_settlement_id
    - trans_order_detail_id
    - settlement_kind_id
    - settle_at
    - quantity
    - amount
    - trans_plan_change_id
    - reason
    - staff_id
    - symbol
    - remarks
    - update_at

# ---- 取り消し(追記のみの表。remove だけを書く edit が ~PageRemove を生成する)。登録・更新は、下の DB の関数で行う ----

# 受注明細精算の取り消し(remove だけを書く。~PageRemove を生成する)
OrderDetailSettlementPageEdit:
  kind: edit
  from: trans_order_detail_settlement
  requiredWhere:
    - trans_order_detail_settlement_id
  columns:
    - trans_order_detail_settlement_id
    - remarks

# ---- DB の関数(kind: function)。1回の呼び出し = 1トランザクション。本体の更新と計画変更の記録をまとめる ----
# PostGraphile v4 は複数の mutation を巻き戻さないため、操作はクライアントの複数の mutation ではなく、この関数で行う。
# 担当者は p_staff_id、省略時は JWT の staff_id。エラーは errcode で判定する(OPR00 担当者・マスタ / OPR01 対象 / OPR02 数量・引数 / OPR03 今の状態では不可、ほか VIS*)。

# 受注明細のキャンセル(一部・全部)。キャンセル数量を加算し、計画変更を記録する。p_quantity は 0 より大きく、残以下
OrderDetailCancelPageCall:
  kind: function
  mutation: orderDetailCancel
  returns: transPlanChange
  columns:
    - trans_plan_change_id
    - change_at
    - old_quantity
    - new_quantity
    - cancel_quantity
    - old_stop
    - new_stop
    - discontinue
    - release
    - hold
    - scrap
    - deliver
    - trans_container_id
    - symbol

# 受注明細の停止・再開(p_stop)。MRP は停止中を凍結する。全部キャンセル済みは停止できない
OrderDetailSetStopPageCall:
  kind: function
  mutation: orderDetailSetStop
  returns: transPlanChange
  columns:
    - trans_plan_change_id
    - change_at
    - old_quantity
    - new_quantity
    - cancel_quantity
    - old_stop
    - new_stop
    - discontinue
    - release
    - hold
    - scrap
    - deliver
    - trans_container_id
    - symbol

# 受注明細の納期・数量の変更。MRP が見る完了期限は p_new_deadline(出荷納期だけを変えても MRP には反映されない)。数量はキャンセル数量と出荷済みの合計以上
OrderDetailChangePageCall:
  kind: function
  mutation: orderDetailChange
  returns: transPlanChange
  columns:
    - trans_plan_change_id
    - change_at
    - old_quantity
    - new_quantity
    - cancel_quantity
    - old_stop
    - new_stop
    - discontinue
    - release
    - hold
    - scrap
    - deliver
    - trans_container_id
    - symbol

# 受注明細の精算(精算1件 = 請求書1行)。精算区分が引き渡す(delivery)なら、続けて品物の引き渡し(LotDeliverPageCall)を呼ぶ
OrderDetailSettlePageCall:
  kind: function
  mutation: orderDetailSettle
  returns: transOrderDetailSettlement
  columns:
    - trans_order_detail_settlement_id
    - trans_order_detail_id
    - settlement_kind_id
    - settle_at
    - quantity
    - amount
    - trans_plan_change_id
    - symbol
