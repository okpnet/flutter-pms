# yaml-language-server: $schema=../../schema.json

# trans_orderの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
OrderPage: &OrderPage
  kind: read
  from: trans_order
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_order_id
    - order_number
    - customer_order_number
    - stakeholder_history_id
    - stakeholder_id
    - stakeholder_contact_history_id
    - stakeholder_contact_id
    - control_code1
    - control_code2
    - control_code3
    - order_processing_date
    - delivery_date
    - deadline
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 4本)
    - name: shipping_order_count
      arrayType: toFirstOne
      as: shipping_order_count
      using: trans_order_id
      from: v_order_shipping_order_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: order_risk_count
      arrayType: toFirstOne
      as: order_risk_count
      using: trans_order_id
      from: v_order_order_risk_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: order_detail_count
      arrayType: toFirstOne
      as: order_detail_count
      using: trans_order_id
      from: v_order_order_detail_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: complaint_order_count
      arrayType: toFirstOne
      as: complaint_order_count
      using: trans_order_id
      from: v_order_complaint_order_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_orderの書き込み
OrderPageEdit:
  kind: edit
  from: trans_order
  requiredWhere:
    - trans_order_id
  generateRfe: true
  columns:
    - trans_order_id
    - order_number
    - customer_order_number
    - stakeholder_history_id
    - stakeholder_id
    - stakeholder_contact_history_id
    - stakeholder_contact_id
    - control_code1
    - control_code2
    - control_code3
    - order_processing_date
    - delivery_date
    - deadline
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# trans_order_detailの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
OrderDetailPage: &OrderDetailPage
  kind: read
  from: trans_order_detail
  filter: true
  requiredWhere:
    - languageCode
    - trans_order_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_order_detail_id
    - trans_order_id
    - item_history_id
    - item_id
    - quantity
    - unit_price
    - price_adjustment
    - fixed_price
    - delivery_date
    - deadline
    - symbol
    - remarks
    # キャンセル・停止・顧客所有(受注・発注まわりの仕様。残は OrderDetailBalancePage を使う)
    - cancel_quantity
    - stop
    - customer_property
    # 残・状態(DBのビュー v_order_detail_balance。停止中は open_quantity が 0、全部キャンセルは cancel_closed)
    - name: balance
      arrayType: toFirstOne
      as: balance
      using: trans_order_detail_id
      from: v_order_detail_balance
      columns:
        - trans_order_detail_id
        - remaining_quantity
        - open_quantity
        - cancel_closed
        - shipped_quantity
        - returned_quantity
        - replacement_quantity
        - settlement_amount
    # MRP用のマスタ不備の件数(計算列)
    - master_error_count
    # 子のレコード数(要件0056。DBのビュー 2本)
    - name: shipping_order_detail_count
      arrayType: toFirstOne
      as: shipping_order_detail_count
      using: trans_order_detail_id
      from: v_order_detail_shipping_order_detail_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: order_detail_risk_count
      arrayType: toFirstOne
      as: order_detail_risk_count
      using: trans_order_detail_id
      from: v_order_detail_order_detail_risk_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_order_detailの書き込み
OrderDetailPageEdit:
  kind: edit
  from: trans_order_detail
  requiredWhere:
    - trans_order_detail_id
  generateRfe: true
  columns:
    - trans_order_detail_id
    - trans_order_id
    - item_history_id
    - item_id
    - quantity
    - unit_price
    - price_adjustment
    - fixed_price
    - delivery_date
    - deadline
    - customer_property
    - remarks
    - update_user_id
    - update_user_history_id
    - remove


# ---- 登録(kind: create)。営業の取得元(GraphQL 版)の「新規」で使う ----

# trans_orderの登録(ID・symbol はトリガーが採番する)
OrderPageCreate:
  kind: create
  from: trans_order
  columns:
    - order_number
    - customer_order_number
    - stakeholder_history_id
    - stakeholder_id
    - order_processing_date
    - delivery_date
    - deadline
    - remarks
    - update_user_id
    - update_user_history_id

# trans_order_detailの登録(キャンセル数量・停止は既定値。操作の DB 関数で変える)
OrderDetailPageCreate:
  kind: create
  from: trans_order_detail
  columns:
    - trans_order_id
    - item_history_id
    - item_id
    - quantity
    - unit_price
    - price_adjustment
    - fixed_price
    - delivery_date
    - deadline
    - customer_property
    - remarks
    - update_user_id
    - update_user_history_id
