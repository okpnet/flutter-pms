# yaml-language-server: $schema=../../schema.json

# 出荷納期遵守状況(ダッシュボード用。要件20261027_0001)
ShippingDeliveryCompliancePage:
  kind: read
  from: v_shipping_delivery_compliance
  filter: true
  columns:
    - customer_id
    - mstr_item_kind_id
    - mstr_item_id
    - mstr_item_provision_ids
    - delivery_date
    - estimated_shipping_date
    - shipping_date
    - shipping_detail_count
    - on_time_count
    - late_count
    - overdue_count
    - pending_count
    - schedule_kept_count
    - schedule_missed_count
    - scheduled_quantity
    - shipped_quantity
