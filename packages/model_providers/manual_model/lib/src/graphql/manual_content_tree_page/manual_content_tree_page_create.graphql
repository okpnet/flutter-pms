# manual_content_tree_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #ManualContentTreePageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ManualContentTreePageCreate(
  $mstrDocumentContentId: UUID
  $parentMstrDocumentContentId: UUID
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  createMstrDocumentContentTree(
    input: {
      mstrDocumentContentTree: {
        mstrDocumentContentId: $mstrDocumentContentId
        parentMstrDocumentContentId: $parentMstrDocumentContentId
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    mstrDocumentContentTree {
      mstrDocumentContentTreeId
      mstrDocumentContentId
      parentMstrDocumentContentId
      updateUserId
      updateUserHistoryId
    }
  }
}
