# manual_tier_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ManualTierPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ManualTierPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrDocumentTierFilter = {and: []}
  $orderBy: [MstrDocumentTiersOrderBy!]
  $removed: Boolean = false
) {
  allMstrDocumentTiers(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrDocumentTierId
      code
      identifier
      tierNumber
    }
  }
}
