# department_access_path_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #DepartmentAccessPathPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DepartmentAccessPathPageRemove(
  $infoDepartmentAccessPathId: UUID!
  $remove: Boolean!
) {
  updateInfoDepartmentAccessPathByInfoDepartmentAccessPathId(
    input: {
      infoDepartmentAccessPathId: $infoDepartmentAccessPathId
      infoDepartmentAccessPathPatch: { remove: $remove }
    }
  ) {
    infoDepartmentAccessPath {
      infoDepartmentAccessPathId
      remove
    }
  }
}
