mutation DepartmentAccessPathPageEdit(
  $infoDepartmentAccessPathId: UUID!
  $infoDepartmentId: UUID
  $infoAccessPathId: UUID
  $write: Boolean
  $remarks: String
) {
  updateInfoDepartmentAccessPathByInfoDepartmentAccessPathId(
    input: {
      infoDepartmentAccessPathId: $infoDepartmentAccessPathId
      infoDepartmentAccessPathPatch: {
        infoDepartmentId: $infoDepartmentId
        infoAccessPathId: $infoAccessPathId
        write: $write
        remarks: $remarks
      }
    }
  ) {
    infoDepartmentAccessPath {
      infoDepartmentAccessPathId
      infoDepartmentId
      infoAccessPathId
      write
      remarks
    }
  }
}
