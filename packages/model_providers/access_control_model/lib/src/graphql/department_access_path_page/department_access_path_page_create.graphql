# department_access_path_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #DepartmentAccessPathPageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DepartmentAccessPathPageCreate(
  $infoDepartmentId: UUID
  $infoAccessPathId: UUID
  $write: Boolean
  $symbol: String
  $remarks: String
) {
  createInfoDepartmentAccessPath(
    input: {
      infoDepartmentAccessPath: {
        infoDepartmentId: $infoDepartmentId
        infoAccessPathId: $infoAccessPathId
        write: $write
        symbol: $symbol
        remarks: $remarks
      }
    }
  ) {
    infoDepartmentAccessPath {
      infoDepartmentAccessPathId
      infoDepartmentId
      infoAccessPathId
      write
      symbol
      remarks
    }
  }
}
