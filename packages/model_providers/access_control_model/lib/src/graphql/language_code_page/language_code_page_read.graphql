# language_code_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #LanguageCodePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query LanguageCodePageRead(
  $first: Int!
  $offset: Int
  $filter: SharedLanguageCodeFilter = {and: []}
  $orderBy: [SharedLanguageCodesOrderBy!]
  $removed: Boolean = false
) {
  allSharedLanguageCodes(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      sharedLanguageCodeId
      code
      label
      priority
      isDefault
    }
  }
}
