# dictionary_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #DictionaryPageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DictionaryPageCreate(
  $remarks: String
) {
  createSharedDictionary(
    input: {
      sharedDictionary: {
        remarks: $remarks
      }
    }
  ) {
    sharedDictionary {
      sharedDictionaryId
      remarks
    }
  }
}
