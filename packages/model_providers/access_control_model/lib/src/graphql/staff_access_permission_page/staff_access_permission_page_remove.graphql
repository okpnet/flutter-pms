# staff_access_permission_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #StaffAccessPermissionPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation StaffAccessPermissionPageRemove(
  $infoStaffAccessPermissionId: UUID!
  $remove: Boolean!
) {
  updateInfoStaffAccessPermissionByInfoStaffAccessPermissionId(
    input: {
      infoStaffAccessPermissionId: $infoStaffAccessPermissionId
      infoStaffAccessPermissionPatch: { remove: $remove }
    }
  ) {
    infoStaffAccessPermission {
      infoStaffAccessPermissionId
      remove
    }
  }
}
