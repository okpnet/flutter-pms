# access_path_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #AccessPathPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AccessPathPageEdit(
  $infoAccessPathId: UUID!
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
  $nameJa: String!
  $nameEn: String!
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String!
  $pronunciationEn: String!
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String!
  $nicknameEn: String!
  $usecasePath: String
  $remarks: String
) {
  updateInfoAccessPathByInfoAccessPathId(
    input: {
      infoAccessPathId: $infoAccessPathId
      infoAccessPathPatch: {
        sharedAppellationToNames: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $nameJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $nameEn }
                      ]
                    }
                  }
                }
              }

              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $pronunciationJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $pronunciationEn }
                      ]
                    }
                  }
                }
              }

              sharedDictionaryToSharedDictionaryNicknameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nicknameSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $nicknameJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $nicknameEn }
                      ]
                    }
                  }
                }
              }
            }
          }
        }

        usecasePath: $usecasePath
        remarks: $remarks
      }
    }
  ) {
    infoAccessPath {
      infoAccessPathId

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId

          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }

          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId

          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }

          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId

          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }

          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      usecasePath
      remarks
    }
  }
}
