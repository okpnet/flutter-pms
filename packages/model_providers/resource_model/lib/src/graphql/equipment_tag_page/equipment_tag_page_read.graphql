# equipment_tag_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #EquipmentTagPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query EquipmentTagPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrEquipmentTagFilter = {and: []}
  $orderBy: [MstrEquipmentTagsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allMstrEquipmentTags(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrEquipmentTagId
      names

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      transFileId

      file: transFileByTransFileId {
        transFileId
        name
        mediaType
      }

      symbol
      remarks
      updateAt
      remove
    }
  }
}
