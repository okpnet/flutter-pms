# equipment_tag_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #EquipmentTagPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation EquipmentTagPageRemove(
  $mstrEquipmentTagId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateMstrEquipmentTagByMstrEquipmentTagId(
    input: {
      mstrEquipmentTagId: $mstrEquipmentTagId
      mstrEquipmentTagPatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    mstrEquipmentTag {
      mstrEquipmentTagId
      remove
    }
  }
}
