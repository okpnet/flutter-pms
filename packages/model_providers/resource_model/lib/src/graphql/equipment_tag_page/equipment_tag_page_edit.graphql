# equipment_tag_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #EquipmentTagPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation EquipmentTagPageEdit(
  $mstrEquipmentTagId: UUID!
  $names: UUID
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateMstrEquipmentTagByMstrEquipmentTagId(
    input: {
      mstrEquipmentTagId: $mstrEquipmentTagId
      mstrEquipmentTagPatch: {
        names: $names
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    mstrEquipmentTag {
      mstrEquipmentTagId
      names
      remarks
    }
  }
}
