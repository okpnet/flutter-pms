# location_tree_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #LocationTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation LocationTreePageRemove(
  $mstrLocationTreeId: UUID!
  $remove: Boolean!
) {
  updateMstrLocationTreeByMstrLocationTreeId(
    input: {
      mstrLocationTreeId: $mstrLocationTreeId
      mstrLocationTreePatch: { remove: $remove }
    }
  ) {
    mstrLocationTree {
      mstrLocationTreeId
      remove
    }
  }
}
