# license_holders_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #LicenseHoldersPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation LicenseHoldersPageRemove(
  $mstrStaffLicenseId: UUID!
  $remove: Boolean!
) {
  updateMstrStaffLicenseByMstrStaffLicenseId(
    input: {
      mstrStaffLicenseId: $mstrStaffLicenseId
      mstrStaffLicensePatch: { remove: $remove }
    }
  ) {
    mstrStaffLicense {
      mstrStaffLicenseId
      remove
    }
  }
}
