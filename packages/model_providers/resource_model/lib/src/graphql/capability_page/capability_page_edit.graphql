# capability_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #CapabilityPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation CapabilityPageEdit(
  $mstrCapabilityId: UUID!
  $code: String
  $names: UUID
  $details: UUID
  $referenceValue: BigFloat
  $max: BigFloat
  $min: BigFloat
  $step: BigFloat
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateMstrCapabilityByMstrCapabilityId(
    input: {
      mstrCapabilityId: $mstrCapabilityId
      mstrCapabilityPatch: {
        code: $code
        names: $names
        details: $details
        referenceValue: $referenceValue
        max: $max
        min: $min
        step: $step
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    mstrCapability {
      mstrCapabilityId
      code
      names
      details
      referenceValue
      max
      min
      step
      remarks
    }
  }
}
