# inspection_operation_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #InspectionOperationPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation InspectionOperationPageRemove(
  $mstrInspectionOperationId: UUID!
  $remove: Boolean!
) {
  updateMstrInspectionOperationByMstrInspectionOperationId(
    input: {
      mstrInspectionOperationId: $mstrInspectionOperationId
      mstrInspectionOperationPatch: { remove: $remove }
    }
  ) {
    mstrInspectionOperation {
      mstrInspectionOperationId
      remove
    }
  }
}
