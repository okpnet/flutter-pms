# license_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #LicensePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation LicensePageRemove(
  $mstrLicenseId: UUID!
  $remove: Boolean!
) {
  updateMstrLicenseByMstrLicenseId(
    input: {
      mstrLicenseId: $mstrLicenseId
      mstrLicensePatch: { remove: $remove }
    }
  ) {
    mstrLicense {
      mstrLicenseId
      remove
    }
  }
}
