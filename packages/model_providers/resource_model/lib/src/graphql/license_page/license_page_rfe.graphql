# license_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #LicensePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query LicensePageRfe(
  $mstrLicenseId: UUID!
) {
  mstrLicenseByMstrLicenseId(mstrLicenseId: $mstrLicenseId) {
    mstrLicenseId
    code
    names
    details
    publicLicense
    customerLicense
    organizationLicense
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
