# license_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #LicensePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation LicensePageEdit(
  $mstrLicenseId: UUID!
  $code: String
  $names: UUID
  $details: UUID
  $publicLicense: Boolean
  $customerLicense: Boolean
  $organizationLicense: Boolean
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateMstrLicenseByMstrLicenseId(
    input: {
      mstrLicenseId: $mstrLicenseId
      mstrLicensePatch: {
        code: $code
        names: $names
        details: $details
        publicLicense: $publicLicense
        customerLicense: $customerLicense
        organizationLicense: $organizationLicense
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    mstrLicense {
      mstrLicenseId
      code
      names
      details
      publicLicense
      customerLicense
      organizationLicense
      remarks
    }
  }
}
