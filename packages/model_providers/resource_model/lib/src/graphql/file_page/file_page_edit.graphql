# file_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #FilePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation FilePageEdit(
  $transFileId: UUID!
  $binaryData: String
  $name: String
  $mediaType: String
  $remarks: String
) {
  updateTransFileByTransFileId(
    input: {
      transFileId: $transFileId
      transFilePatch: {
        binaryData: $binaryData
        name: $name
        mediaType: $mediaType
        remarks: $remarks
      }
    }
  ) {
    transFile {
      transFileId
      binaryData
      name
      mediaType
      remarks
      remarks
    }
  }
}
