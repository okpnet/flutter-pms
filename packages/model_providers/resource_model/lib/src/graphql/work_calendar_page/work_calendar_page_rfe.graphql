# work_calendar_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #WorkCalendarPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query WorkCalendarPageRfe(
  $mstrWorkCalendarId: UUID!
) {
  mstrWorkCalendarByMstrWorkCalendarId(mstrWorkCalendarId: $mstrWorkCalendarId) {
    mstrWorkCalendarId
    workDate
    mstrEquipmentId
    startTime
    workInterval {
      seconds
      minutes
      hours
      days
      months
      years
    }
    holiday
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
