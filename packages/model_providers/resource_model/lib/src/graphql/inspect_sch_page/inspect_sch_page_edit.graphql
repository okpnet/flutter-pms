# inspect_sch_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #InspectSchPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation InspectSchPageEdit(
  $transInspectSchId: UUID!
  $code: String
  $transLabelId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
  $ja: String!
  $en: String!
  $remarks: String
  $equipmentHistoryId: UUID
  $equipmentId: UUID
  $requirementTextsTransTextId: UUID!
  $requirementTextsJa: String!
  $requirementTextsEn: String!
  $requirementTextsRemarks: String
  $attentionTextsTransTextId: UUID!
  $attentionTextsJa: String!
  $attentionTextsEn: String!
  $attentionTextsRemarks: String
  $recommendationTextsTransTextId: UUID!
  $recommendationTextsJa: String!
  $recommendationTextsEn: String!
  $recommendationTextsRemarks: String
  $inspectionOperationHistoryId: UUID
  $inspectionOperationId: UUID
) {
  updateTransInspectSchByTransInspectSchId(
    input: {
      transInspectSchId: $transInspectSchId
      transInspectSchPatch: {
        code: $code

        transLabelToTitles: {
          updateByTransLabelId: {
            transLabelId: $transLabelId
            transLabelPatch: {
              transLabelValuesUsingTransLabelId: {
                deleteOthers: true
                create: [
                  { sharedLanguageCodeId: $jaLanguageCodeId, labelValue: $ja }
                  { sharedLanguageCodeId: $enLanguageCodeId, labelValue: $en }
                ]
              }

              remarks: $remarks
            }
          }
        }

        equipmentHistoryId: $equipmentHistoryId
        equipmentId: $equipmentId

        transTextToRequirements: {
          updateByTransTextId: {
            transTextId: $requirementTextsTransTextId
            transTextPatch: {
              transTextValuesUsingTransTextId: {
                deleteOthers: true
                create: [
                  { sharedLanguageCodeId: $jaLanguageCodeId, textValue: $requirementTextsJa }
                  { sharedLanguageCodeId: $enLanguageCodeId, textValue: $requirementTextsEn }
                ]
              }

              remarks: $requirementTextsRemarks
            }
          }
        }

        transTextToAttentions: {
          updateByTransTextId: {
            transTextId: $attentionTextsTransTextId
            transTextPatch: {
              transTextValuesUsingTransTextId: {
                deleteOthers: true
                create: [
                  { sharedLanguageCodeId: $jaLanguageCodeId, textValue: $attentionTextsJa }
                  { sharedLanguageCodeId: $enLanguageCodeId, textValue: $attentionTextsEn }
                ]
              }

              remarks: $attentionTextsRemarks
            }
          }
        }

        transTextToRecommendations: {
          updateByTransTextId: {
            transTextId: $recommendationTextsTransTextId
            transTextPatch: {
              transTextValuesUsingTransTextId: {
                deleteOthers: true
                create: [
                  { sharedLanguageCodeId: $jaLanguageCodeId, textValue: $recommendationTextsJa }
                  { sharedLanguageCodeId: $enLanguageCodeId, textValue: $recommendationTextsEn }
                ]
              }

              remarks: $recommendationTextsRemarks
            }
          }
        }

        inspectionOperationHistoryId: $inspectionOperationHistoryId
        inspectionOperationId: $inspectionOperationId
        remarks: $remarks
      }
    }
  ) {
    transInspectSch {
      transInspectSchId
      code

      labels: transLabelByTitles {
        transLabelId

        ja: transLabelValuesByTransLabelId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            labelValue
          }
        }

        en: transLabelValuesByTransLabelId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            labelValue
          }
        }

        remarks
      }

      equipmentHistoryId
      equipmentId

      requirementTexts: transTextByRequirements {
        transTextId

        ja: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        en: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        remarks
      }

      attentionTexts: transTextByAttentions {
        transTextId

        ja: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        en: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        remarks
      }

      recommendationTexts: transTextByRecommendations {
        transTextId

        ja: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        en: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        remarks
      }

      inspectionOperationHistoryId
      inspectionOperationId
      remarks
    }
  }
}
