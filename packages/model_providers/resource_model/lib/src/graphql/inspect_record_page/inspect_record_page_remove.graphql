# inspect_record_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #InspectRecordPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation InspectRecordPageRemove(
  $transInspectRecordId: UUID!
  $remove: Boolean!
) {
  updateTransInspectRecordByTransInspectRecordId(
    input: {
      transInspectRecordId: $transInspectRecordId
      transInspectRecordPatch: { remove: $remove }
    }
  ) {
    transInspectRecord {
      transInspectRecordId
      remove
    }
  }
}
