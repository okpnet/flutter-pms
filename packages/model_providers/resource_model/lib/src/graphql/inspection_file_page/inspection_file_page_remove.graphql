# inspection_file_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #InspectionFilePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation InspectionFilePageRemove(
  $transInspectImpFileId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateTransInspectImpFileByTransInspectImpFileId(
    input: {
      transInspectImpFileId: $transInspectImpFileId
      transInspectImpFilePatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    transInspectImpFile {
      transInspectImpFileId
      remove
    }
  }
}
