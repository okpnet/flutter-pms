# inspection_file_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #InspectionFilePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query InspectionFilePageRfe(
  $transInspectImpFileId: UUID!
) {
  transInspectImpFileByTransInspectImpFileId(transInspectImpFileId: $transInspectImpFileId) {
    transInspectImpFileId
    transInspectRecordId
    titles
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
