# inspection_status_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #InspectionStatusPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query InspectionStatusPageRead(
  $first: Int!
  $offset: Int
  $filter: VInspectionStatusFilter = {and: []}
  $orderBy: [VInspectionStatusesOrderBy!]
) {
  allVInspectionStatuses(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrEquipmentId
      supplierId
      isImplemented
      result
      scheduleDetailCount
      overdueCount
      nextScheduledStartDate
      lastImplementDate
    }
  }
}
