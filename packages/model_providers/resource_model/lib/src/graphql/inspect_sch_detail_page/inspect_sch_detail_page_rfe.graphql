# inspect_sch_detail_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #InspectSchDetailPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query InspectSchDetailPageRfe(
  $transInspectSchDetailId: UUID!
) {
  transInspectSchDetailByTransInspectSchDetailId(transInspectSchDetailId: $transInspectSchDetailId) {
    transInspectSchDetailId
    transInspectSchId
    transPurchaseDetailId
    scheduledStartDate
    scheduledEndDate
    stakeholderHistoryId
    stakeholderId
    inspectionHistoryId
    inspectionId
    inspectionFormulaHistoryId
    inspectionFormulaId
    inspectionKindHistoryId
    inspectionKindId
    inspectionOperationTaskHistoryId
    inspectionOperationTaskId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
