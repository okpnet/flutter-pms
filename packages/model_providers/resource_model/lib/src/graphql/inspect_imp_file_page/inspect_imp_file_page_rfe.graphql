# inspect_imp_file_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #InspectImpFilePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query InspectImpFilePageRfe(
  $transInspectImpFileId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  transInspectImpFileByTransInspectImpFileId(transInspectImpFileId: $transInspectImpFileId) {
    transInspectImpFileId
    transInspectRecordId
    transFileId

    labels: transLabelByTitles {
      transLabelId

      ja: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          labelValue
        }
      }

      en: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          labelValue
        }
      }

      remarks
    }

    class
    transFileReminderId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
