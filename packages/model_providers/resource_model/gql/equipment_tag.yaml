# yaml-language-server: $schema=../../schema.json

# 設備タグ(mstr_equipment_tag)。ファイルのバイナリは PocketBase にあり、DB は trans_file に名前・種類だけを持つ。
# 登録・差し替えは、trans_file とタグの行を 1 トランザクションで作る入れ子の登録で、生成器が対応していないため、
# 取得元(resource の EquipmentTagRepository)が GraphQL の文を組み立てる(pms_graphql の SharedFileLink)。
# 名称(names)は共通関数(sharedAppellationSave)で作り、返った ID を渡す。

# 共有ファイルの名前・種類(trans_file)
ResourceFileBodyFields: &ResourceFileBodyFields
  kind: read
  from: trans_file
  columns:
    - trans_file_id
    - name
    - media_type

# 設備タグの読み込み
EquipmentTagPage: &EquipmentTagPage
  kind: read
  from: mstr_equipment_tag
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_equipment_tag_id
    - names
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - trans_file_id
    - name: file
      as: file
      arrayType: toFirstOne
      using: trans_file_id
      <<: *ResourceFileBodyFields
    - symbol
    - remarks
    - update_at

# 設備タグの更新・取り消し(備考・名称の付け替え・remove)。ファイルの差し替えは入れ子の登録で行う
EquipmentTagPageEdit:
  kind: edit
  withUpdater: true
  from: mstr_equipment_tag
  requiredWhere:
    - mstr_equipment_tag_id
  generateRfe: true
  columns:
    - mstr_equipment_tag_id
    - names
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 呼称(名称)の登録・更新(p_appellation_id が無ければ新規)
EquipmentTagAppellationSavePageCall:
  kind: function
  mutation: sharedAppellationSave
  returns: sharedAppellation
  columns:
    - shared_appellations_id
