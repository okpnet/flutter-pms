# yaml-language-server: $schema=../../schema.json

# 点検整備実施状況(equipment × supplier × 実施済み × 結果)(ダッシュボード用。要件20261027_0001)
InspectionStatusPage:
  kind: read
  from: v_inspection_status
  filter: true
  columns:
    - mstr_equipment_id
    - supplier_id
    - is_implemented
    - result
    - schedule_detail_count
    - overdue_count
    - next_scheduled_start_date
    - last_implement_date
