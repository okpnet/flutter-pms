# yaml-language-server: $schema=../../schema.json

# 資格読み込み
# 作業に必要な公的、私的をとわず資格を定義する
LicensePage: &LicensePage
  kind: read
  from: mstr_license
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_license_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextReadFields
    - public_license
    - customer_license
    - organization_license
    - update_interval 
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: staff_license_count
      arrayType: toFirstOne
      as: staff_license_count
      using: mstr_license_id
      from: v_license_staff_license_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 資格の更新(平らな列だけ。渡した列だけが変わる。名称(names)・詳細(details)の ID は、共通関数で作る・変える)。論理削除は LicensePageRemove(remove = true)
# 作業に必要な公的、私的をとわず資格を定義する
LicensePageEdit:
  kind: edit
  from: mstr_license
  requiredWhere:
    - mstr_license_id
  generateRfe: true
  withUpdater: true # 更新者を、Edit・Remove の引数にする(ログイン中の担当者を渡す)
  columns:
    - mstr_license_id
    - code
    - names
    - details
    - public_license
    - customer_license
    - organization_license
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 資格の登録(kind: create)。記号(symbol)は DB が採番する
LicensePageCreate:
  kind: create
  from: mstr_license
  columns:
    - code
    - names
    - details
    - public_license
    - customer_license
    - organization_license
    - remarks
    - update_user_id
    - update_user_history_id

# 共通関数(kind: function)。呼称・文章(言語別の値)を作る・変える。返った ID を、本体の names・details に渡す
LicenseAppellationSavePageCall:
  kind: function
  mutation: sharedAppellationSave
  returns: sharedAppellation
  columns:
    - shared_appellations_id

LicenseTextSavePageCall:
  kind: function
  mutation: sharedTextSave
  returns: sharedText
  columns:
    - shared_text_id

# 資格を持つ担当者の読み込み
# 資格を持っている担当者が該当する
LicenseHoldersPage:
  kind: read
  from: mstr_license
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_license_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextReadFields
    - public_license
    - customer_license
    - organization_license
    - update_interval 
    - name: licenses # 要件0045レビュー: 元はlicenses(mstr_license(1)→mstr_staff_license(多))が
      # toFirstOne、内側のstaff(junction行(1)→info_staff(1))がtoManyと基数が入れ替わっていた
      # (schema.jsonの方針どおり基数はスキーマ側で検証されないため生成側で修正)。
      from: mstr_staff_license
      arrayType: toMany
      as: licenses
      using: mstr_license_id
      defaultWhere:
        - column: remove
          operator: "="
          value: false
      columns:
        - mstr_staff_license_id
        - info_staff_id
        - name: staff
          arrayType: toFirstOne
          as: staff
          using: info_staff_id
          <<: *StaffPage
        - mstr_license_id
        - name: license
          arrayType: toFirstOne
          as: license
          using: mstr_license_id
          <<: *LicensePage
        - start_at
        - stop_at
        - abeyance
        - abeyance_at
        - revocation
        - revocation_at
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: staff_license_count
      arrayType: toFirstOne
      as: staff_license_count
      using: mstr_license_id
      from: v_license_staff_license_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 資格を持つ担当者の書き込み(LicenseHoldersPage側の編集画面)
# 上記と同じ理由でStaffLicenseEditFieldsをそのまま参照する。
LicenseHoldersPageEdit:
  <<: *StaffLicenseEditFields
  requiredWhere: # 要件0028: info_staff_idは1対多で非一意のためRFEの単一レコード取得条件に
    # 使えない。from自身のPKに修正(元はinfo_staff_idだった)。
    - mstr_staff_license_id
  generateRfe: true
