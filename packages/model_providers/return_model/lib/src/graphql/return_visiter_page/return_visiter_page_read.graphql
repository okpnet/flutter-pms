# return_visiter_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ReturnVisiterPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ReturnVisiterPageRead(
  $first: Int!
  $offset: Int
  $filter: TransReturnVisiterFilter = {and: []}
  $orderBy: [TransReturnVisitersOrderBy!]
  $removed: Boolean = false
) {
  allTransReturnVisiters(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transReturnVisiterId
      transReturnDetailId
      transVisiterId
      symbol
      remarks
      updateAt
      remove
    }
  }
}
