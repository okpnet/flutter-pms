# return_visiter_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ReturnVisiterPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ReturnVisiterPageRemove(
  $transReturnVisiterId: UUID!
  $remove: Boolean!
) {
  updateTransReturnVisiterByTransReturnVisiterId(
    input: {
      transReturnVisiterId: $transReturnVisiterId
      transReturnVisiterPatch: { remove: $remove }
    }
  ) {
    transReturnVisiter {
      transReturnVisiterId
      remove
    }
  }
}
