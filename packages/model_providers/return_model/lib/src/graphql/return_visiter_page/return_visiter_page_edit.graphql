# return_visiter_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #ReturnVisiterPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ReturnVisiterPageEdit(
  $transReturnVisiterId: UUID!
  $remarks: String
) {
  updateTransReturnVisiterByTransReturnVisiterId(
    input: {
      transReturnVisiterId: $transReturnVisiterId
      transReturnVisiterPatch: {
        remarks: $remarks
      }
    }
  ) {
    transReturnVisiter {
      transReturnVisiterId
      remarks
    }
  }
}
