# return_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ReturnPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ReturnPageRemove(
  $transReturnId: UUID!
  $remove: Boolean!
) {
  updateTransReturnByTransReturnId(
    input: {
      transReturnId: $transReturnId
      transReturnPatch: { remove: $remove }
    }
  ) {
    transReturn {
      transReturnId
      remove
    }
  }
}
