# plan_change_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #PlanChangePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PlanChangePageRemove(
  $transPlanChangeId: UUID!
  $remove: Boolean!
) {
  updateTransPlanChangeByTransPlanChangeId(
    input: {
      transPlanChangeId: $transPlanChangeId
      transPlanChangePatch: { remove: $remove }
    }
  ) {
    transPlanChange {
      transPlanChangeId
      remove
    }
  }
}
