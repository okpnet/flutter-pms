# plan_change_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #PlanChangePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PlanChangePageRead(
  $first: Int!
  $offset: Int
  $filter: VPlanChangeFilter = {and: []}
  $orderBy: [VPlanChangesOrderBy!]
  $languageCodeId: UUID!
) {
  allVPlanChanges(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPlanChangeId
      symbol
      parentTransPlanChangeId
      changeAt
      transOrderDetailId
      transPurchaseDetailId
      transOperationsPlanId
      transInventoryRequestId
      transVisiterId
      transShippingOrderDetailId
      isOrderDetail
      isPurchaseDetail
      isOperationsPlan
      isInventoryRequest
      isVisiter
      isShippingOrderDetail
      itemId

      item: mstrItemByItemId {
        mstrItemId
        code
        symbol

        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }

      rootTransOrderDetailId

      root_order_detail: transOrderDetailByRootTransOrderDetailId {
        transOrderDetailId
        symbol
      }

      isCancel
      isQuantityChange
      isDateChange
      isPostpone
      isAdvance
      isStop
      isResume
      isDiscontinue
      isRelease
      isHold
      isScrap
      isDeliver
      hasSettlement
      isRoot
      hasChildren
      customerCause
      supplierCause
      qualityCause
      fromMrp
      isReflected
      isUnreflected
      oldQuantity
      newQuantity
      cancelQuantity
      oldDate
      newDate
      oldStop
      newStop
      transContainerId
      transOrderDetailSettlementId
      changeReasonId
      reason
      stakeholderId
      staffId
      transMrpSuggestionId
      reflectedTransMrpRunId
      remarks
      updateAt
    }
  }
}
