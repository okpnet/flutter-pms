# plan_change_unreflected_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #PlanChangeUnreflectedPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PlanChangeUnreflectedPageRead(
  $first: Int!
  $offset: Int
  $filter: VPlanChangeUnreflectedFilter = {and: []}
  $orderBy: [VPlanChangeUnreflectedsOrderBy!]
) {
  allVPlanChangeUnreflecteds(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPlanChangeId
      symbol
      changeAt
      transOrderDetailId
      transPurchaseDetailId
      transOperationsPlanId
      staffId
    }
  }
}
