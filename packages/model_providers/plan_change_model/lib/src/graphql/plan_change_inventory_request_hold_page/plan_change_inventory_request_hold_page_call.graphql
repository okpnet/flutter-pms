# plan_change_inventory_request_hold_page画面 - Call(DBの関数の呼び出し)
#
# 画面仕様: gql/*.yaml #PlanChangeInventoryRequestHoldPageCall
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PlanChangeInventoryRequestHoldPageCall(
  $pInventoryRequestId: UUID
  $pContainerId: UUID
  $pChangeReasonId: UUID
  $pReason: String
  $pStaffId: UUID
  $pParentPlanChangeId: UUID
  $pRemarks: String
  $pLocationId: UUID
) {
  inventoryRequestHold(
    input: {
      pInventoryRequestId: $pInventoryRequestId
      pContainerId: $pContainerId
      pChangeReasonId: $pChangeReasonId
      pReason: $pReason
      pStaffId: $pStaffId
      pParentPlanChangeId: $pParentPlanChangeId
      pRemarks: $pRemarks
      pLocationId: $pLocationId
    }
  ) {
    transPlanChange {
      transPlanChangeId
      symbol
      release
      hold
      scrap
      deliver
      transContainerId
    }
  }
}
