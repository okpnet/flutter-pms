# cost_item_unit_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #CostItemUnitPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query CostItemUnitPageRead(
  $first: Int!
  $offset: Int
  $filter: VItemUnitCostFilter = {and: []}
  $orderBy: [VItemUnitCostsOrderBy!]
) {
  allVItemUnitCosts(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      itemId
      itemSymbol
      itemCode
      purchaseCost
      productionCost
      componentCost
      unitCost
      hasSupplier
      hasComponents
      rateMissing
    }
  }
}
