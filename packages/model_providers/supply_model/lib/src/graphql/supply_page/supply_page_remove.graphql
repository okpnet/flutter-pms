# supply_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #SupplyPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation SupplyPageRemove(
  $transSupplyId: UUID!
  $remove: Boolean!
) {
  updateTransSupplyByTransSupplyId(
    input: {
      transSupplyId: $transSupplyId
      transSupplyPatch: { remove: $remove }
    }
  ) {
    transSupply {
      transSupplyId
      remove
    }
  }
}
