# supply_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #SupplyPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query SupplyPageRead(
  $first: Int!
  $offset: Int
  $filter: TransSupplyFilter = {and: []}
  $orderBy: [TransSuppliesOrderBy!]
  $removed: Boolean = false
) {
  allTransSupplies(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transSupplyId
      code
      supplyAt
      stakeholderId
      receive
      counterpartOwns
      companyOwns
      transOrderId
      transPurchaseId
      transPlanChangeId
      transComplaintId
      reason
      staffId
      symbol
      remarks
      updateAt
      remove
    }
  }
}
