# supply_detail_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #SupplyDetailPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query SupplyDetailPageRead(
  $first: Int!
  $offset: Int
  $filter: TransSupplyDetailFilter = {and: []}
  $orderBy: [TransSupplyDetailsOrderBy!]
  $removed: Boolean = false
) {
  allTransSupplyDetails(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transSupplyDetailId
      transSupplyId
      itemId
      quantity
      unitPrice
      scheduledAt
      transOrderDetailId
      transPurchaseDetailId
      transResourcePlanId
      symbol
      remarks
      updateAt
      remove
    }
  }
}
