# yaml-language-server: $schema=../../schema.json

# 支給(trans_supply)。receive / counterpart_owns / company_owns の組は boolean のまま扱う(場面ごとの定数にしない)。
SupplyPage:
  kind: read
  from: trans_supply
  filter: true
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - trans_supply_id
    - code
    - supply_at
    - stakeholder_id
    - receive
    - counterpart_owns
    - company_owns
    - trans_order_id
    - trans_purchase_id
    - trans_plan_change_id
    - trans_complaint_id
    - reason
    - staff_id
    - symbol
    - remarks
    - update_at

# 支給明細(予定を含む)
SupplyDetailPage:
  kind: read
  from: trans_supply_detail
  filter: true
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - trans_supply_detail_id
    - trans_supply_id
    - item_id
    - quantity
    - unit_price
    - scheduled_at
    - trans_order_detail_id
    - trans_purchase_detail_id
    - trans_resource_plan_id
    - symbol
    - remarks
    - update_at

# 支給とロット(棚ビジター)のつなぎ。数量は棚ビジターの行が持つ
SupplyVisiterPage:
  kind: read
  from: trans_supply_visiter
  filter: true
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - trans_supply_visiter_id
    - trans_supply_detail_id
    - trans_visiter_id
    - symbol
    - remarks
    - update_at

# 支給明細ごとの予定・つないだ数量・未受入・今の数量(v_supply_detail_balance)。画面の表示は、この列の boolean で決める
SupplyDetailBalancePage:
  kind: read
  from: v_supply_detail_balance
  filter: true
  columns:
    - trans_supply_detail_id
    - symbol
    - trans_supply_id
    - stakeholder_id
    - receive
    - counterpart_owns
    - company_owns
    - paid_supply
    - paid_by_switch
    - unit_price
    - paid_amount
    - item_id
    - trans_order_detail_id
    - trans_purchase_detail_id
    - trans_resource_plan_id
    - scheduled_at
    - quantity
    - linked_lot_quantity
    - linked_issue_quantity
    - remaining_quantity
    - current_quantity

# 支給の取り消し(remove だけを書く。~PageRemove を生成する)
SupplyPageEdit:
  kind: edit
  from: trans_supply
  requiredWhere:
    - trans_supply_id
  columns:
    - trans_supply_id
    - remarks

# 支給明細の取り消し。自社手配へ切り替えるときは、その品目の支給明細を取り消して再MRP する
SupplyDetailPageEdit:
  kind: edit
  from: trans_supply_detail
  requiredWhere:
    - trans_supply_detail_id
  columns:
    - trans_supply_detail_id
    - remarks

# 支給のつなぎの取り消し
SupplyVisiterPageEdit:
  kind: edit
  from: trans_supply_visiter
  requiredWhere:
    - trans_supply_visiter_id
  columns:
    - trans_supply_visiter_id
    - remarks

# ---- DB の関数(kind: function)。1回の呼び出し = 1トランザクション。本体の更新と計画変更の記録をまとめる ----
# PostGraphile v4 は複数の mutation を巻き戻さないため、操作はクライアントの複数の mutation ではなく、この関数で行う。
# 担当者は p_staff_id、省略時は JWT の staff_id。エラーは errcode で判定する(OPR00 担当者・マスタ / OPR01 対象 / OPR02 数量・引数 / OPR03 今の状態では不可、ほか VIS*)。
# p_details は jsonb の配列(item_id・quantity・unit_price・scheduled_at・受注明細または発注明細・resource_plan_id・lot_id・container_id・hold・visiter_ids)。
# 在庫を動かすのは「渡す・返す場面」だけ。返却不要(譲渡)・無償 → 有償の切り替え(p_complaint_id)は既存のロットをつなぐだけで、ロットの一部だけなら関数が先に分ける。

# 支給の登録(伝票・明細・ロットのつなぎ)。場面(receive・counterpart_owns・company_owns の組)は画面の選択肢から決める
SupplyRegisterPageCall:
  kind: function
  mutation: supplyRegister
  returns: transSupply
  columns:
    - trans_supply_id
    - code
    - supply_at
    - stakeholder_id
    - receive
    - counterpart_owns
    - company_owns
    - trans_order_id
    - trans_purchase_id
    - symbol
