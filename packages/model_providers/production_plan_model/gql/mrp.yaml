    - trans_order_detail_id
    - trans_unrecognized_detail_id
    - trans_resource_plan_id
    - parent_trans_operations_plan_id
    - trans_purchase_detail_id
    - trans_operations_plan_id
    - stakeholder_history_id
    - stakeholder_id
    - cost
    - asking_price
    - trans_mrp_suggestion_task_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - mstr_equipment_id
    - load_date
    - message
    - applied_at
    - symbol
    - remarks
    - update_at

# MRPの発注予定(v_mrp_purchase_plan。1行は実行×区分×仕入先×発注日×納期)
MrpPurchasePlanPage:
  kind: read
  from: v_mrp_purchase_plan
  filter: true
  columns:
    - plan_key
    - trans_mrp_run_id
    - kind
    - stakeholder_id
    - release_date
    - due_date
    - line_count
    - amount
    - late_count
    - pending_count

# MRPのマスタ不備(v_mrp_master_issue)
MrpMasterIssuePage:
  kind: read
  from: v_mrp_master_issue
  filter: true
  columns:
    - issue_key
    - item_id
    - item_code
    - issue_code
    - severity
    - message
    - ref_table
