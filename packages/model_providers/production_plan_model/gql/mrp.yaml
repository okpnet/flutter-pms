# yaml-language-server: $schema=../../schema.json

# MRP(資材所要量計画)の読み込み。計算・確定・破棄などの操作はDBのメソッド(lib/src/graphql/mrp_method/)で行う。
# 名称が必要な画面は、ID で既存の読み込みを引く。

# MRP実行(trans_mrp_run)
MrpRunPage:
  kind: read
  from: trans_mrp_run
  filter: true
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_run_id
    - run_mode
    - status
    - run_at
    - committed_at
    - staff_history_id
    - staff_id
    - params
    - suggestion_count
    - pending_count
    - late_count
    - overload_count
    - symbol
    - remarks
    - update_at

# MRP提案の品目(コードと名称だけ。画面に出すための軽い結合)
MrpItemFields: &MrpItemFields
  kind: read
  from: mstr_item
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_item_id
    - code
    - control_code
    - symbol
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
      <<: *AppellationLabelsReadFields

# MRP提案の品目の履歴
MrpItemHistoryFields: &MrpItemHistoryFields
  kind: read
  from: history_mstr_item
  columns:
    - history_id
    - mstr_item_id
    - revision
    - name: master
      as: master
      arrayType: toFirstOne
      using: mstr_item_id
      <<: *MrpItemFields

# MRP提案の利害関係者(仕入先・顧客。コード・symbol・名称)
MrpStakeholderFields: &MrpStakeholderFields
  kind: read
  from: mstr_stakeholder
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_stakeholder_id
    - code
    - control_code
    - symbol
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
      <<: *AppellationLabelsReadFields

# MRP提案の利害関係者の履歴
MrpStakeholderHistoryFields: &MrpStakeholderHistoryFields
  kind: read
  from: history_mstr_stakeholder
  columns:
    - history_id
    - mstr_stakeholder_id
    - revision
    - name: master
      as: master
      arrayType: toFirstOne
      using: mstr_stakeholder_id
      <<: *MrpStakeholderFields

# MRP提案の設備(コード・symbol)
MrpEquipmentFields: &MrpEquipmentFields
  kind: read
  from: mstr_equipment
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_equipment_id
    - code
    - control_code
    - symbol

# MRP提案の外注可能の履歴(symbol)
MrpOutsourceAvailableHistoryFields: &MrpOutsourceAvailableHistoryFields
  kind: read
  from: history_mstr_outsource_available
  columns:
    - history_id
    - mstr_outsource_available_id
    - revision
    - name: master
      as: master
      arrayType: toFirstOne
      using: mstr_outsource_available_id
      kind: read
      from: mstr_outsource_available
      columns:
        - mstr_outsource_available_id
        - symbol

# MRP提案が参照する trans_order_detail(symbol)
MrpOrderDetailFields: &MrpOrderDetailFields
  kind: read
  from: trans_order_detail
  columns:
    - trans_order_detail_id
    - symbol

# MRP提案が参照する trans_unrecognized_detail(symbol)
MrpUnrecognizedDetailFields: &MrpUnrecognizedDetailFields
  kind: read
  from: trans_unrecognized_detail
  columns:
    - trans_unrecognized_detail_id
    - symbol

# MRP提案が参照する trans_resource_plan(symbol)
MrpResourcePlanFields: &MrpResourcePlanFields
  kind: read
  from: trans_resource_plan
  columns:
    - trans_resource_plan_id
    - symbol

# MRP提案が参照する trans_operations_plan(symbol)
MrpOperationsPlanFields: &MrpOperationsPlanFields
  kind: read
  from: trans_operations_plan
  columns:
    - trans_operations_plan_id
    - symbol

# MRP提案が参照する trans_purchase_detail(symbol)
MrpPurchaseDetailFields: &MrpPurchaseDetailFields
  kind: read
  from: trans_purchase_detail
  columns:
    - trans_purchase_detail_id
    - symbol

# MRP提案(trans_mrp_suggestion)
MrpSuggestionPage:
  kind: read
  from: trans_mrp_suggestion
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_suggestion_id
    - trans_mrp_run_id
    - parent_trans_mrp_suggestion_id
    - seq
    - kind
    - decision
    - need_user
    - late
    - item_history_id
    - item_id
    - name: item
      as: item
      arrayType: toFirstOne
      using: [item_history_id, item_id]
      <<: *MrpItemHistoryFields
    - bom_level
    - plan_kind
    - quantity
    - allocated_quantity
    - old_quantity
    - need_at
    - release_at
    - due_at
    - old_due_at
    - trans_order_detail_id
    - name: order_detail
      as: order_detail
      arrayType: toFirstOne
      using: trans_order_detail_id
      <<: *MrpOrderDetailFields
    - trans_unrecognized_detail_id
    - name: unrecognized_detail
      as: unrecognized_detail
      arrayType: toFirstOne
      using: trans_unrecognized_detail_id
      <<: *MrpUnrecognizedDetailFields
    - trans_resource_plan_id
    - name: resource_plan
      as: resource_plan
      arrayType: toFirstOne
      using: trans_resource_plan_id
      <<: *MrpResourcePlanFields
    - parent_trans_operations_plan_id
    - name: parent_operations_plan
      as: parent_operations_plan
      arrayType: toFirstOne
      using: parent_trans_operations_plan_id
      <<: *MrpOperationsPlanFields
    - trans_purchase_detail_id
    - name: purchase_detail
      as: purchase_detail
      arrayType: toFirstOne
      using: trans_purchase_detail_id
      <<: *MrpPurchaseDetailFields
    - trans_operations_plan_id
    - name: operations_plan
      as: operations_plan
      arrayType: toFirstOne
      using: trans_operations_plan_id
      <<: *MrpOperationsPlanFields
    - stakeholder_history_id
    - stakeholder_id
    - name: stakeholder
      as: stakeholder
      arrayType: toFirstOne
      using: [stakeholder_history_id, stakeholder_id]
      <<: *MrpStakeholderHistoryFields
    - cost
    - asking_price
    - trans_mrp_suggestion_task_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - name: outsource_available
      as: outsource_available
      arrayType: toFirstOne
      using: [mstr_outsource_available_history_id, mstr_outsource_available_id]
      <<: *MrpOutsourceAvailableHistoryFields
    - mstr_equipment_id
    - name: equipment
      as: equipment
      arrayType: toFirstOne
      using: mstr_equipment_id
      <<: *MrpEquipmentFields
    - load_date
    - message
    - applied_at
    - symbol
    - remarks
    - update_at

# MRP提案工程(trans_mrp_suggestion_task)
MrpSuggestionTaskPage:
  kind: read
  from: trans_mrp_suggestion_task
  filter: true
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_suggestion_task_id
    - trans_mrp_suggestion_id
    - trans_work_plan_id
    - mstr_task_id
    - sequence
    - mstr_equipment_available_history_id
    - mstr_equipment_available_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - outsource_trans_mrp_suggestion_id
    - cost
    - interval_plan
    - start_at
    - completion_at
    - symbol
    - remarks
    - update_at

# MRP引当(trans_mrp_pegging。需要の提案と供給の対応)
MrpPeggingPage:
  kind: read
  from: trans_mrp_pegging
  filter: true
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_pegging_id
    - trans_mrp_run_id
    - demand_trans_mrp_suggestion_id
    - supply_kind
    - supply_trans_mrp_suggestion_id
    - trans_purchase_detail_id
    - trans_operations_plan_id
    - quantity
    - need_at
    - available_at
    - symbol
    - remarks
    - update_at

# MRP設備負荷(trans_mrp_load。設備×日)
MrpLoadPage:
  kind: read
  from: trans_mrp_load
  filter: true
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_load_id
    - trans_mrp_run_id
    - mstr_equipment_id
    - name: equipment
      as: equipment
      arrayType: toFirstOne
      using: mstr_equipment_id
      <<: *MrpEquipmentFields
    - load_date
    - capacity_hours
    - committed_hours
    - planned_hours
    - load_rate
    - symbol
    - remarks
    - update_at

# 要判断のMRP提案(v_mrp_pending_suggestion。1行は提案)
MrpPendingSuggestionPage:
  kind: read
  from: v_mrp_pending_suggestion
  filter: true
  requiredWhere:
    - languageCode
  columns:
    - trans_mrp_suggestion_id
    - trans_mrp_run_id
    - parent_trans_mrp_suggestion_id
    - seq
    - kind
    - decision
    - need_user
    - late
    - item_history_id
    - item_id
    - name: item
      as: item
      arrayType: toFirstOne
      using: item_id
      <<: *MrpItemFields
    - bom_level
    - plan_kind
    - quantity
    - allocated_quantity
    - old_quantity
    - need_at
    - release_at
    - due_at
    - old_due_at
    - trans_order_detail_id
    - trans_unrecognized_detail_id
    - trans_resource_plan_id
    - parent_trans_operations_plan_id
    - trans_purchase_detail_id
    - trans_operations_plan_id
    - stakeholder_history_id
    - stakeholder_id
    - name: stakeholder
      as: stakeholder
      arrayType: toFirstOne
      using: stakeholder_id
      <<: *MrpStakeholderFields
    - cost
    - asking_price
    - trans_mrp_suggestion_task_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - mstr_equipment_id
    - load_date
    - message
    - applied_at
    - symbol
    - remarks
    - update_at

# MRPの発注予定(v_mrp_purchase_plan。1行は実行×区分×仕入先×発注日×納期)
MrpPurchasePlanPage:
  kind: read
  from: v_mrp_purchase_plan
  filter: true
  requiredWhere:
    - languageCode
  columns:
    - plan_key
    - trans_mrp_run_id
    - kind
    - stakeholder_id
    - name: stakeholder
      as: stakeholder
      arrayType: toFirstOne
      using: stakeholder_id
      <<: *MrpStakeholderFields
    - release_date
    - due_date
    - line_count
    - amount
    - late_count
    - pending_count

# MRPのマスタ不備(v_mrp_master_issue)
MrpMasterIssuePage:
  kind: read
  from: v_mrp_master_issue
  filter: true
  requiredWhere:
    - languageCode
  columns:
    - issue_key
    - item_id
    - name: item
      as: item
      arrayType: toFirstOne
      using: item_id
      <<: *MrpItemFields
    - item_code
    - issue_code
    - severity
    - message
    - ref_table
    - ref_id

# 資材計画の充足状況(v_resource_plan_coverage。1行は資材計画)
ResourcePlanCoveragePage:
  kind: read
  from: v_resource_plan_coverage
  filter: true
  requiredWhere:
    - languageCode
  columns:
    - trans_resource_plan_id
    - item_id
    - name: item
      as: item
      arrayType: toFirstOne
      using: item_id
      <<: *MrpItemFields
    - plan_kind
    - trans_order_detail_id
    - trans_unrecognized_detail_id
    - parent_trans_operations_plan_id
    - deadline
    - quantity
    - inventory_resavation
    - issued
    - remaining
    - reserved_stock
    - reserved_purchase
    - reserved_production
    - shortage
