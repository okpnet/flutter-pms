# yaml-language-server: $schema=../../schema.json

# MRP(資材所要量計画)の読み込み。計算・確定・破棄などの操作はDBのメソッド(lib/src/graphql/mrp_method/)で行う。
# 名称が必要な画面は、ID で既存の読み込みを引く。

# MRP実行(trans_mrp_run)
MrpRunPage:
  kind: read
  from: trans_mrp_run
  filter: true
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_run_id
    - run_mode
    - status
    - run_at
    - committed_at
    - staff_history_id
    - staff_id
    - params
    - suggestion_count
    - pending_count
    - late_count
    - overload_count
    - symbol
    - remarks
    - update_at

# MRP提案の品目(コードと名称だけ。画面に出すための軽い結合)
MrpItemFields: &MrpItemFields
  kind: read
  from: mstr_item
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_item_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
      <<: *AppellationLabelsReadFields

# MRP提案の品目の履歴
MrpItemHistoryFields: &MrpItemHistoryFields
  kind: read
  from: history_mstr_item
  columns:
    - history_id
    - mstr_item_id
    - revision
    - name: master
      as: master
      arrayType: toFirstOne
      using: mstr_item_id
      <<: *MrpItemFields

# MRP提案(trans_mrp_suggestion)
MrpSuggestionPage:
  kind: read
  from: trans_mrp_suggestion
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_suggestion_id
    - trans_mrp_run_id
    - parent_trans_mrp_suggestion_id
    - seq
    - kind
    - decision
    - need_user
    - late
    - item_history_id
    - item_id
    - name: item
      as: item
      arrayType: toFirstOne
      using: [item_history_id, item_id]
      <<: *MrpItemHistoryFields
    - bom_level
    - plan_kind
    - quantity
    - allocated_quantity
    - old_quantity
    - need_at
    - release_at
    - due_at
    - old_due_at
    - trans_order_detail_id
    - trans_unrecognized_detail_id
    - trans_resource_plan_id
    - parent_trans_operations_plan_id
    - trans_purchase_detail_id
    - trans_operations_plan_id
    - stakeholder_history_id
    - stakeholder_id
    - cost
    - asking_price
    - trans_mrp_suggestion_task_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - mstr_equipment_id
    - load_date
    - message
    - applied_at
    - symbol
    - remarks
    - update_at

# MRP提案工程(trans_mrp_suggestion_task)
MrpSuggestionTaskPage:
  kind: read
  from: trans_mrp_suggestion_task
  filter: true
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_suggestion_task_id
    - trans_mrp_suggestion_id
    - trans_work_plan_id
    - mstr_task_id
    - sequence
    - mstr_equipment_available_history_id
    - mstr_equipment_available_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - outsource_trans_mrp_suggestion_id
    - cost
    - interval_plan
    - start_at
    - completion_at
    - symbol
    - remarks
    - update_at

# MRP引当(trans_mrp_pegging。需要の提案と供給の対応)
MrpPeggingPage:
  kind: read
  from: trans_mrp_pegging
  filter: true
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_mrp_pegging_id
    - trans_mrp_run_id
    - demand_trans_mrp_suggestion_id
    - supply_kind
    - supply_trans_mrp_suggestion_id
    - trans_purchase_detail_id
    - trans_operations_plan_id
    - quantity
    - need_at
    - available_at
    - symbol
    - remarks
    - update_at

# MRP設備負荷(trans_mrp_load。設備×日)
