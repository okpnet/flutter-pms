# ---- DB の関数(kind: function)。1回の呼び出し = 1トランザクション。本体の更新と計画変更の記録をまとめる ----
# PostGraphile v4 は複数の mutation を巻き戻さないため、操作はクライアントの複数の mutation ではなく、この関数で行う。
# 担当者は p_staff_id、省略時は JWT の staff_id。エラーは errcode で判定する(OPR00 担当者・マスタ / OPR01 対象 / OPR02 数量・引数 / OPR03 今の状態では不可、ほか VIS*)。

# 生産計画の停止・再開。打ち切り済みは変えられない
OperationsPlanSetStopPageCall:
  kind: function
  mutation: operationsPlanSetStop
  returns: transPlanChange
  columns:
    - trans_plan_change_id
    - change_at
    - old_quantity
    - new_quantity
    - cancel_quantity
    - old_stop
    - new_stop
    - discontinue
    - release
    - hold
    - scrap
    - deliver
    - trans_container_id
    - symbol

# 生産計画の打ち切り(戻さない)。仕掛品は処置が必要(LotReleasePageCall など)
OperationsPlanDiscontinuePageCall:
  kind: function
  mutation: operationsPlanDiscontinue
  returns: transPlanChange
  columns:
    - trans_plan_change_id
    - change_at
    - old_quantity
    - new_quantity
    - cancel_quantity
    - old_stop
    - new_stop
    - discontinue
    - release
    - hold
    - scrap
    - deliver
    - trans_container_id
    - symbol


# ---- 登録(kind: create)。生産計画の取得元(GraphQL 版)の「新規」で使う ----

# trans_resource_planの登録(ID・symbol はトリガーが採番する)
ResourcePlanPageCreate:
  kind: create
  from: trans_resource_plan
  columns:
    - trans_order_detail_id
    - trans_unrecognized_detail_id
    - parent_trans_operations_plan_id
    - register_at
    - quantity
    - inventory_resavation
    - deadline
    - item_history_id
    - item_id
    - remarks
    - update_user_id
    - update_user_history_id

# trans_operations_planの登録(停止・打ち切りは既定値。操作の DB 関数で変える)
OperationsPlanPageCreate:
  kind: create
  from: trans_operations_plan
  columns:
    - trans_resource_plan_id
    - quantity
    - deadline
    - remarks
    - update_user_id
    - update_user_history_id
