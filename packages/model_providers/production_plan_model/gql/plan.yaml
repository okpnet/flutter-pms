# yaml-language-server: $schema=../../schema.json

# trans_resource_planの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
ResourcePlanPage: &ResourcePlanPage
  kind: read
  from: trans_resource_plan
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_resource_plan_id
    - trans_order_detail_id
    - trans_unrecognized_detail_id
    - parent_trans_operations_plan_id
    - register_at
    - quantity
    - inventory_resavation
    - deadline
    - item_history_id
    - item_id
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_resource_planの書き込み
ResourcePlanPageEdit:
  kind: edit
  from: trans_resource_plan
  requiredWhere:
    - trans_resource_plan_id
  generateRfe: true
  columns:
    - trans_resource_plan_id
    - trans_order_detail_id
    - trans_unrecognized_detail_id
    - parent_trans_operations_plan_id
    - register_at
    - quantity
    - inventory_resavation
    - deadline
    - item_history_id
    - item_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# trans_operations_planの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
OperationsPlanPage: &OperationsPlanPage
  kind: read
  from: trans_operations_plan
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_operations_plan_id
    - trans_resource_plan_id
    - quantity
    - deadline
    - stop
    - discontinue
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: work_plan_count
      arrayType: toFirstOne
      as: work_plan_count
      using: trans_operations_plan_id
      from: v_operations_plan_work_plan_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_operations_planの書き込み
OperationsPlanPageEdit:
  kind: edit
  from: trans_operations_plan
  requiredWhere:
    - trans_operations_plan_id
  generateRfe: true
  columns:
    - trans_operations_plan_id
    - trans_resource_plan_id
    - quantity
    - deadline
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# trans_work_planの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
WorkPlanPage: &WorkPlanPage
  kind: read
  from: trans_work_plan
  filter: true
  requiredWhere:
    - languageCode
    - trans_operations_plan_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_work_plan_id
    - trans_operations_plan_id
    - mstr_task_id
    - name: task
      as: task
      arrayType: toFirstOne
      using: mstr_task_id
      <<: *TaskReadFields
    - sequence
    - mstr_equipment_available_history_id
    - mstr_equipment_available_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - trans_purchase_detail_id
    - interval_plan
    - start_at
    - completion_at
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 2本)
    - name: work_record_count
      arrayType: toFirstOne
      as: work_record_count
      using: trans_work_plan_id
      from: v_work_plan_work_record_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: product_rez_count
      arrayType: toFirstOne
      as: product_rez_count
      using: trans_work_plan_id
      from: v_work_plan_product_rez_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_work_planの書き込み
WorkPlanPageEdit:
  kind: edit
  from: trans_work_plan
  requiredWhere:
    - trans_work_plan_id
  generateRfe: true
  columns:
    - trans_work_plan_id
    - trans_operations_plan_id
    - mstr_task_id
    - name: task
      as: task
      arrayType: toFirstOne
      using: mstr_task_id
      editable: false
      <<: *TaskReadFields
    - sequence
    - mstr_equipment_available_history_id
    - mstr_equipment_available_id
    - mstr_outsource_available_history_id
    - mstr_outsource_available_id
    - trans_purchase_detail_id
    - interval_plan
    - start_at
    - completion_at
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

