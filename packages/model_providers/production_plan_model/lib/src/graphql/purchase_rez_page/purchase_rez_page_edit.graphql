# purchase_rez_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #PurchaseRezPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PurchaseRezPageEdit(
  $transPurchaseRezId: UUID!
  $transPurchaseDetailId: UUID
  $remarks: String
) {
  updateTransPurchaseRezByTransPurchaseRezId(
    input: {
      transPurchaseRezId: $transPurchaseRezId
      transPurchaseRezPatch: {
        transPurchaseDetailId: $transPurchaseDetailId
        remarks: $remarks
      }
    }
  ) {
    transPurchaseRez {
      transPurchaseRezId
      transPurchaseDetailId
      remarks
    }
  }
}
