# mrp_load_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpLoadPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpLoadPageRead(
  $first: Int!
  $offset: Int
  $filter: TransMrpLoadFilter = {and: []}
  $orderBy: [TransMrpLoadsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransMrpLoads(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transMrpLoadId
      transMrpRunId
      mstrEquipmentId

      equipment: mstrEquipmentByMstrEquipmentId {
        mstrEquipmentId
        code
        controlCode
        symbol
        mstrItemId

        item: mstrItemByMstrItemId {
          mstrItemId
          code
          controlCode
          symbol

          labels: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }
        }
      }

      loadDate
      capacityHours
      committedHours
      plannedHours
      loadRate
      symbol
      remarks
      updateAt
      remove
    }
  }
}
