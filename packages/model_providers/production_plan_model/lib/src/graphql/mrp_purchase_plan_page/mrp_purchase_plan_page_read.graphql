# mrp_purchase_plan_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpPurchasePlanPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpPurchasePlanPageRead(
  $first: Int!
  $offset: Int
  $filter: VMrpPurchasePlanFilter = {and: []}
  $orderBy: [VMrpPurchasePlansOrderBy!]
  $languageCodeId: UUID!
) {
  allVMrpPurchasePlans(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      planKey
      transMrpRunId
      kind
      stakeholderId

      stakeholder: mstrStakeholderByStakeholderId {
        mstrStakeholderId
        code
        controlCode
        symbol

        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }

      releaseDate
      dueDate
      lineCount
      amount
      lateCount
      pendingCount
    }
  }
}
