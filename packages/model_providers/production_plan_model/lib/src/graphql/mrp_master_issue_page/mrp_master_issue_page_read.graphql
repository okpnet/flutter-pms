# mrp_master_issue_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpMasterIssuePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpMasterIssuePageRead(
  $first: Int!
  $offset: Int
  $filter: VMrpMasterIssueFilter = {and: []}
  $orderBy: [VMrpMasterIssuesOrderBy!]
  $languageCodeId: UUID!
) {
  allVMrpMasterIssues(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      issueKey
      itemId

      item: mstrItemByItemId {
        mstrItemId
        code
        controlCode
        symbol

        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }

      itemCode
      issueCode
      severity
      message
      refTable
      refId
    }
  }
}
