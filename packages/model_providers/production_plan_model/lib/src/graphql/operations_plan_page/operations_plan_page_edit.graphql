# operations_plan_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #OperationsPlanPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OperationsPlanPageEdit(
  $transOperationsPlanId: UUID!
  $transResourcePlanId: UUID
  $quantity: BigFloat
  $deadline: Datetime
  $remarks: String
) {
  updateTransOperationsPlanByTransOperationsPlanId(
    input: {
      transOperationsPlanId: $transOperationsPlanId
      transOperationsPlanPatch: {
        transResourcePlanId: $transResourcePlanId
        quantity: $quantity
        deadline: $deadline
        remarks: $remarks
      }
    }
  ) {
    transOperationsPlan {
      transOperationsPlanId
      transResourcePlanId
      quantity
      deadline
      remarks
    }
  }
}
