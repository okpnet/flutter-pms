# mrp_suggestion_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpSuggestionPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpSuggestionPageRead(
  $first: Int!
  $offset: Int
  $filter: TransMrpSuggestionFilter = {and: []}
  $orderBy: [TransMrpSuggestionsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransMrpSuggestions(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transMrpSuggestionId
      transMrpRunId
      parentTransMrpSuggestionId
      seq
      kind
      decision
      needUser
      late
      itemHistoryId
      itemId

      item: historyMstrItemByItemHistoryIdAndItemId {
        historyId
        mstrItemId
        revision

        master: mstrItemByMstrItemId {
          mstrItemId
          code
          controlCode
          symbol

          labels: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }
        }
      }

      bomLevel
      planKind
      quantity
      allocatedQuantity
      oldQuantity
      needAt
      releaseAt
      dueAt
      oldDueAt
      transOrderDetailId

      order_detail: transOrderDetailByTransOrderDetailId {
        transOrderDetailId
        symbol
      }

      transUnrecognizedDetailId

      unrecognized_detail: transUnrecognizedDetailByTransUnrecognizedDetailId {
        transUnrecognizedDetailId
        symbol
      }

      transResourcePlanId

      resource_plan: transResourcePlanByTransResourcePlanId {
        transResourcePlanId
        symbol
      }

      parentTransOperationsPlanId

      parent_operations_plan: transOperationsPlanByParentTransOperationsPlanId {
        transOperationsPlanId
        symbol
      }

      transPurchaseDetailId

      purchase_detail: transPurchaseDetailByTransPurchaseDetailId {
        transPurchaseDetailId
        symbol
      }

      transOperationsPlanId

      operations_plan: transOperationsPlanByTransOperationsPlanId {
        transOperationsPlanId
        symbol
      }

      stakeholderHistoryId
      stakeholderId

      stakeholder: historyMstrStakeholderByStakeholderHistoryIdAndStakeholderId {
        historyId
        mstrStakeholderId
        revision

        master: mstrStakeholderByMstrStakeholderId {
          mstrStakeholderId
          code
          controlCode
          symbol

          labels: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }
        }
      }

      cost
      askingPrice
      transMrpSuggestionTaskId
      mstrOutsourceAvailableHistoryId
      mstrOutsourceAvailableId

      outsource_available: historyMstrOutsourceAvailableByMstrOutsourceAvailableHistoryIdAndMstrOutsourceAvailableId {
        historyId
        mstrOutsourceAvailableId
        revision

        master: mstrOutsourceAvailableByMstrOutsourceAvailableId {
          mstrOutsourceAvailableId
          symbol
        }
      }

      mstrEquipmentId

      equipment: mstrEquipmentByMstrEquipmentId {
        mstrEquipmentId
        code
        controlCode
        symbol
      }

      loadDate
      message
      appliedAt
      symbol
      remarks
      updateAt
      remove
    }
  }
}
