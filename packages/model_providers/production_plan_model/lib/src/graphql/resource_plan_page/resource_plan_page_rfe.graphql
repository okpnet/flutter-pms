# resource_plan_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #ResourcePlanPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ResourcePlanPageRfe(
  $transResourcePlanId: UUID!
) {
  transResourcePlanByTransResourcePlanId(transResourcePlanId: $transResourcePlanId) {
    transResourcePlanId
    transOrderDetailId
    transUnrecognizedDetailId
    parentTransOperationsPlanId
    registerAt
    quantity
    inventoryResavation
    deadline
    itemHistoryId
    itemId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
