# resource_plan_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ResourcePlanPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ResourcePlanPageRemove(
  $transResourcePlanId: UUID!
  $remove: Boolean!
) {
  updateTransResourcePlanByTransResourcePlanId(
    input: {
      transResourcePlanId: $transResourcePlanId
      transResourcePlanPatch: { remove: $remove }
    }
  ) {
    transResourcePlan {
      transResourcePlanId
      remove
    }
  }
}
