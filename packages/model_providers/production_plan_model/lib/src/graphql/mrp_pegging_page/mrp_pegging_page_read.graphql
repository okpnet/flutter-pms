# mrp_pegging_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpPeggingPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpPeggingPageRead(
  $first: Int!
  $offset: Int
  $filter: TransMrpPeggingFilter = {and: []}
  $orderBy: [TransMrpPeggingsOrderBy!]
  $removed: Boolean = false
) {
  allTransMrpPeggings(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transMrpPeggingId
      transMrpRunId
      demandTransMrpSuggestionId
      supplyKind
      supplyTransMrpSuggestionId
      transPurchaseDetailId
      transOperationsPlanId
      quantity
      needAt
      availableAt
      symbol
      remarks
      updateAt
      remove
    }
  }
}
