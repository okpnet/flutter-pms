# product_rez_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ProductRezPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ProductRezPageRemove(
  $transProductRezId: UUID!
  $remove: Boolean!
) {
  updateTransProductRezByTransProductRezId(
    input: {
      transProductRezId: $transProductRezId
      transProductRezPatch: { remove: $remove }
    }
  ) {
    transProductRez {
      transProductRezId
      remove
    }
  }
}
