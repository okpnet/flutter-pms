# product_rez_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #ProductRezPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ProductRezPageEdit(
  $transProductRezId: UUID!
  $transWorkPlanId: UUID
  $remarks: String
) {
  updateTransProductRezByTransProductRezId(
    input: {
      transProductRezId: $transProductRezId
      transProductRezPatch: {
        transWorkPlanId: $transWorkPlanId
        remarks: $remarks
      }
    }
  ) {
    transProductRez {
      transProductRezId
      transWorkPlanId
      remarks
    }
  }
}
