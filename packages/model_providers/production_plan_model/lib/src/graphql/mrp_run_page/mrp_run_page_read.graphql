# mrp_run_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpRunPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpRunPageRead(
  $first: Int!
  $offset: Int
  $filter: TransMrpRunFilter = {and: []}
  $orderBy: [TransMrpRunsOrderBy!]
  $removed: Boolean = false
) {
  allTransMrpRuns(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transMrpRunId
      runMode
      status
      runAt
      committedAt
      staffHistoryId
      staffId
      params
      suggestionCount
      pendingCount
      lateCount
      overloadCount
      symbol
      remarks
      updateAt
      remove
    }
  }
}
