# mrp_run_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpRunPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpRunPageRead(
  $first: Int!
  $offset: Int
  $filter: VMrpRunFilter = {and: []}
  $orderBy: [VMrpRunsOrderBy!]
) {
  allVMrpRuns(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transMrpRunId
      isCalculated
      isCommitted
      isDiscarded
      isExpired
      isOrderRun
      isRerun
      runAt
      committedAt
      staffHistoryId
      staffId
      params
      suggestionCount
      pendingCount
      lateCount
      overloadCount
      symbol
      remarks
      updateAt
    }
  }
}
