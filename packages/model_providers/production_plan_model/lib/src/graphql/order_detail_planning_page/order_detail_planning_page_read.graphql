# order_detail_planning_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #OrderDetailPlanningPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderDetailPlanningPageRead(
  $first: Int!
  $offset: Int
  $filter: VOrderDetailPlanningFilter = {and: []}
  $orderBy: [VOrderDetailPlanningsOrderBy!]
) {
  allVOrderDetailPlannings(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transOrderDetailId
      symbol
      transOrderId
      itemId
      transResourcePlanId
      planned
      hasDemand
      stopped
      toPlan
    }
  }
}
