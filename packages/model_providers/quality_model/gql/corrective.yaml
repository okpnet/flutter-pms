# yaml-language-server: $schema=../../schema.json

# trans_disposalの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
DisposalPage: &DisposalPage
  kind: read
  from: trans_disposal
  filter: true
  requiredWhere:
    - languageCode
    - trans_complaint_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_disposal_id
    - trans_complaint_id
    - disposal_at
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextReadFields
    - name: approvals
      as: approvals
      arrayType: toFirstOne
      using: approvals
      <<: *TransApprovalPatternReadFields
    - approval_at
    - department_history_id
    - department_id
    - operation_staff_history_id
    - operation_staff_id
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: recurrence_prevention_count
      arrayType: toFirstOne
      as: recurrence_prevention_count
      using: trans_disposal_id
      from: v_disposal_recurrence_prevention_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_disposalの書き込み
DisposalPageEdit:
  kind: edit
  from: trans_disposal
  requiredWhere:
    - trans_disposal_id
  generateRfe: true
  columns:
    - trans_disposal_id
    - trans_complaint_id
    - disposal_at
    - name: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelEditFields
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextEditFields
    - name: approvals
      as: approvals
      arrayType: toFirstOne
      using: approvals
      editable: false
      <<: *TransApprovalPatternReadFields
    - approval_at
    - department_history_id
    - department_id
    - operation_staff_history_id
    - operation_staff_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

