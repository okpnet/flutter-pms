# trans_auditの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
AuditPage: &AuditPage
  kind: read
  from: trans_audit
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_audit_id
    - audit_std_history_id
    - audit_std_id
    - staff_history_id
    - staff_id
    - scheduled_start_date
    - expected_end_date
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextReadFields
    - info_department_id
    - name: department
      as: department
      arrayType: toFirstOne
      using: info_department_id
      <<: *DepartmentReadFields
    - mstr_stakeholder_id
    - name: stakeholder
      as: stakeholder
      arrayType: toFirstOne
      using: mstr_stakeholder_id
      <<: *StakeholderReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 2本)
    - name: audit_team_count
      arrayType: toFirstOne
      as: audit_team_count
      using: trans_audit_id
      from: v_audit_audit_team_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: audit_member_count
      arrayType: toFirstOne
      as: audit_member_count
      using: trans_audit_id
      from: v_audit_audit_member_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_auditの書き込み
AuditPageEdit:
  kind: edit
  from: trans_audit
  requiredWhere:
    - trans_audit_id
  generateRfe: true
  columns:
    - trans_audit_id
    - audit_std_history_id
    - audit_std_id
    - staff_history_id
    - staff_id
    - scheduled_start_date
    - expected_end_date
    - name: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelEditFields
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextEditFields
    - info_department_id
    - name: department
      as: department
      arrayType: toFirstOne
      using: info_department_id
      editable: false
      <<: *DepartmentReadFields
    - mstr_stakeholder_id
    - name: stakeholder
      as: stakeholder
      arrayType: toFirstOne
      using: mstr_stakeholder_id
      editable: false
      <<: *StakeholderReadFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

