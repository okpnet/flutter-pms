# yaml-language-server: $schema=../../schema.json

# mstr_audit_stdの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
AuditStdPage: &AuditStdPage
  kind: read
  from: mstr_audit_std
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_audit_std_id
    - code
    - control_code
    - category
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: audit_std_checkitem_count
      arrayType: toFirstOne
      as: audit_std_checkitem_count
      using: mstr_audit_std_id
      from: v_audit_std_audit_std_checkitem_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# mstr_audit_stdの書き込み
AuditStdPageEdit:
  kind: edit
  from: mstr_audit_std
  requiredWhere:
    - mstr_audit_std_id
  generateRfe: true
  columns:
    - mstr_audit_std_id
    - code
    - control_code
    - category
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

