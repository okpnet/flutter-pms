# audit_std_checkitem_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #AuditStdCheckitemPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AuditStdCheckitemPageRfe(
  $mstrAuditStdCheckitemId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  mstrAuditStdCheckitemByMstrAuditStdCheckitemId(mstrAuditStdCheckitemId: $mstrAuditStdCheckitemId) {
    mstrAuditStdCheckitemId
    mstrAuditStdId
    code
    controlCode

    labels: sharedAppellationByNames {
      sharedAppellationsId
      sharedDictionaryBySharedDictionaryNameId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }

      sharedDictionaryBySharedDictionaryPronunciationId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }

      sharedDictionaryBySharedDictionaryNicknameId {
        sharedDictionaryId

        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }

        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }
    }

    detailTexts: sharedTextByDetails {
      sharedTextId

      ja: sharedTextValuesBySharedTextId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          textValue
        }
      }

      en: sharedTextValuesBySharedTextId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          textValue
        }
      }
    }

    typeClass
    formulaClass
    argClass
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
