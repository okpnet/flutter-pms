# audit_std_checkitem_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #AuditStdCheckitemPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AuditStdCheckitemPageRemove(
  $mstrAuditStdCheckitemId: UUID!
  $remove: Boolean!
) {
  updateMstrAuditStdCheckitemByMstrAuditStdCheckitemId(
    input: {
      mstrAuditStdCheckitemId: $mstrAuditStdCheckitemId
      mstrAuditStdCheckitemPatch: { remove: $remove }
    }
  ) {
    mstrAuditStdCheckitem {
      mstrAuditStdCheckitemId
      remove
    }
  }
}
