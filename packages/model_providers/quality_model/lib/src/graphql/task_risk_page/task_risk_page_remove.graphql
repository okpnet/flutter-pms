# task_risk_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #TaskRiskPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation TaskRiskPageRemove(
  $transTaskRiskId: UUID!
  $remove: Boolean!
) {
  updateTransTaskRiskByTransTaskRiskId(
    input: {
      transTaskRiskId: $transTaskRiskId
      transTaskRiskPatch: { remove: $remove }
    }
  ) {
    transTaskRisk {
      transTaskRiskId
      remove
    }
  }
}
