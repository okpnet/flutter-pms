# audit_detail_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #AuditDetailPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AuditDetailPageRemove(
  $transAuditDetailsId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateTransAuditDetailByTransAuditDetailsId(
    input: {
      transAuditDetailsId: $transAuditDetailsId
      transAuditDetailPatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    transAuditDetail {
      transAuditDetailsId
      remove
    }
  }
}
