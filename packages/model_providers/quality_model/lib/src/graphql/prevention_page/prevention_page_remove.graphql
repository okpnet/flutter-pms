# prevention_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #PreventionPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PreventionPageRemove(
  $transPreventionId: UUID!
  $remove: Boolean!
) {
  updateTransPreventionByTransPreventionId(
    input: {
      transPreventionId: $transPreventionId
      transPreventionPatch: { remove: $remove }
    }
  ) {
    transPrevention {
      transPreventionId
      remove
    }
  }
}
