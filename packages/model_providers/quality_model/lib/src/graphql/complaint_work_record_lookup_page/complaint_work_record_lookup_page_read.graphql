# complaint_work_record_lookup_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ComplaintWorkRecordLookupPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ComplaintWorkRecordLookupPageRead(
  $first: Int!
  $offset: Int
  $filter: TransWorkRecordFilter = {and: []}
  $orderBy: [TransWorkRecordsOrderBy!]
) {
  allTransWorkRecords(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transWorkRecordId
      symbol
    }
  }
}
