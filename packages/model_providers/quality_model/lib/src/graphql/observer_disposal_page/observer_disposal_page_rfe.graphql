# observer_disposal_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #ObserverDisposalPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ObserverDisposalPageRfe(
  $transObserverDisposalId: UUID!
) {
  transObserverDisposalByTransObserverDisposalId(transObserverDisposalId: $transObserverDisposalId) {
    transObserverDisposalId
    enable
    observeSchedule
    observeAt
    observerStaffHistoryId
    observerStaffId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
