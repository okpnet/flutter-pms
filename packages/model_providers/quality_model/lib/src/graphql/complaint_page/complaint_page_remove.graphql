# complaint_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ComplaintPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintPageRemove(
  $transComplaintId: UUID!
  $remove: Boolean!
) {
  updateTransComplaintByTransComplaintId(
    input: {
      transComplaintId: $transComplaintId
      transComplaintPatch: { remove: $remove }
    }
  ) {
    transComplaint {
      transComplaintId
      remove
    }
  }
}
