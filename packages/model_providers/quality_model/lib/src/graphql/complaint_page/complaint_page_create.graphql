# complaint_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #ComplaintPageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintPageCreate(
  $occurentAt: Datetime
  $titles: UUID
  $details: UUID
  $reporterStaffHistoryId: UUID
  $reporterStaffId: UUID
  $approvals: UUID
  $remarks: String
) {
  createTransComplaint(
    input: {
      transComplaint: {
        occurentAt: $occurentAt
        titles: $titles
        details: $details
        reporterStaffHistoryId: $reporterStaffHistoryId
        reporterStaffId: $reporterStaffId
        approvals: $approvals
        remarks: $remarks
      }
    }
  ) {
    transComplaint {
      transComplaintId
      occurentAt
      titles
      details
      reporterStaffHistoryId
      reporterStaffId
      approvals
      remarks
    }
  }
}
