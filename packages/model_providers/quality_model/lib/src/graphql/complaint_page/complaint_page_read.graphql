# complaint_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #ComplaintPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ComplaintPageRead(
  $first: Int!
  $offset: Int
  $filter: TransComplaintFilter = {and: []}
  $orderBy: [TransComplaintsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransComplaints(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transComplaintId
      occurentAt

      labels: transLabelByTitles {
        transLabelId

        value: transLabelValuesByTransLabelId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            labelValue
          }
        }
      }

      detailTexts: transTextByDetails {
        transTextId

        value: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            charCount
            leadText
          }
        }
      }

      reporterStaffHistoryId
      reporterStaffId

      approvals: transApprovalPatternByApprovals {
        transApprovalPatternId
        mstrApprovalPatternId

        pattern: mstrApprovalPatternByMstrApprovalPatternId {
          mstrApprovalPatternId

          labels: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }

            sharedDictionaryBySharedDictionaryPronunciationId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }

            sharedDictionaryBySharedDictionaryNicknameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }

          symbol
          remarks
          updateAt
          remove

          update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
            historyId
            infoStaffId
            infoCompanyId
            code

            name: sharedAppellationByNames {
              sharedAppellationsId
              sharedDictionaryBySharedDictionaryNameId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }

              sharedDictionaryBySharedDictionaryPronunciationId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }

              sharedDictionaryBySharedDictionaryNicknameId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }
            }

            sex
            phone
            symbol
            privatePhone
          }
        }

        status
        symbol
        remarks
        updateAt
        remove

        update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
          historyId
          infoStaffId
          infoCompanyId
          code

          name: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }

            sharedDictionaryBySharedDictionaryPronunciationId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }

            sharedDictionaryBySharedDictionaryNicknameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }

          sex
          phone
          symbol
          privatePhone
        }
      }

      symbol
      remarks

      disposal_count: vComplaintDisposalCountByTransComplaintId {
        transComplaintId
      }

      complaint_stakeholder_count: vComplaintComplaintStakeholderCountByTransComplaintId {
        transComplaintId
      }

      complaint_receive_count: vComplaintComplaintReceiveCountByTransComplaintId {
        transComplaintId
      }

      complaint_process_count: vComplaintComplaintProcessCountByTransComplaintId {
        transComplaintId
      }

      complaint_order_count: vComplaintComplaintOrderCountByTransComplaintId {
        transComplaintId
      }

      complaint_file_count: vComplaintComplaintFileCountByTransComplaintId {
        transComplaintId
      }

      complaint_equipment_count: vComplaintComplaintEquipmentCountByTransComplaintId {
        transComplaintId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
