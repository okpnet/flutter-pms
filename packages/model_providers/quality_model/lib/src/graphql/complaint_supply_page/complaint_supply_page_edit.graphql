# complaint_supply_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #ComplaintSupplyPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintSupplyPageEdit(
  $transComplaintSupplyId: UUID!
  $remarks: String
) {
  updateTransComplaintSupplyByTransComplaintSupplyId(
    input: {
      transComplaintSupplyId: $transComplaintSupplyId
      transComplaintSupplyPatch: {
        remarks: $remarks
      }
    }
  ) {
    transComplaintSupply {
      transComplaintSupplyId
      remarks
    }
  }
}
