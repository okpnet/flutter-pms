# complaint_order_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #ComplaintOrderPageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintOrderPageCreate(
  $transComplaintId: UUID
  $transOrderId: UUID
  $remarks: String
) {
  createTransComplaintOrder(
    input: {
      transComplaintOrder: {
        transComplaintId: $transComplaintId
        transOrderId: $transOrderId
        remarks: $remarks
      }
    }
  ) {
    transComplaintOrder {
      transComplaintOrderId
      transComplaintId
      transOrderId
      remarks
    }
  }
}
