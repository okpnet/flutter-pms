# complaint_order_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #ComplaintOrderPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ComplaintOrderPageRfe(
  $transComplaintOrderId: UUID!
) {
  transComplaintOrderByTransComplaintOrderId(transComplaintOrderId: $transComplaintOrderId) {
    transComplaintOrderId
    transComplaintId
    transOrderId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
