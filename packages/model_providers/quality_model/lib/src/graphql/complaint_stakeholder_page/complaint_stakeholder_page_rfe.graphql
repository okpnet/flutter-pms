# complaint_stakeholder_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #ComplaintStakeholderPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ComplaintStakeholderPageRfe(
  $transComplaintStakeholderId: UUID!
) {
  transComplaintStakeholderByTransComplaintStakeholderId(transComplaintStakeholderId: $transComplaintStakeholderId) {
    transComplaintStakeholderId
    transComplaintId
    stakeholderHistoryId
    stakeholderId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
