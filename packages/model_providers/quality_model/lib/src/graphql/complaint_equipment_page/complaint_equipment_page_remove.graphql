# complaint_equipment_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ComplaintEquipmentPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintEquipmentPageRemove(
  $transComplaintEquipmentId: UUID!
  $remove: Boolean!
) {
  updateTransComplaintEquipmentByTransComplaintEquipmentId(
    input: {
      transComplaintEquipmentId: $transComplaintEquipmentId
      transComplaintEquipmentPatch: { remove: $remove }
    }
  ) {
    transComplaintEquipment {
      transComplaintEquipmentId
      remove
    }
  }
}
