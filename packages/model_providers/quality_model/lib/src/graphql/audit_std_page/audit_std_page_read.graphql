# audit_std_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #AuditStdPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AuditStdPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrAuditStdFilter = {and: []}
  $orderBy: [MstrAuditStdsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allMstrAuditStds(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrAuditStdId
      code
      controlCode
      category

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      detailTexts: sharedTextByDetails {
        sharedTextId
        value: sharedTextValuesBySharedTextId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            charCount
            leadText
          }
        }
      }

      symbol
      remarks

      audit_std_checkitem_count: vAuditStdAuditStdCheckitemCountByMstrAuditStdId {
        mstrAuditStdId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
