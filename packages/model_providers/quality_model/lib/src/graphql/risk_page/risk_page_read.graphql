# risk_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #RiskPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query RiskPageRead(
  $first: Int!
  $offset: Int
  $filter: TransRiskFilter = {and: []}
  $orderBy: [TransRisksOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransRisks(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transRiskId

      labels: transLabelByTitles {
        transLabelId

        value: transLabelValuesByTransLabelId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            labelValue
          }
        }
      }

      detailTexts: transTextByDetails {
        transTextId

        value: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            charCount
            leadText
          }
        }
      }

      frequency
      momentous
      action
      residualRiskId
      symbol
      remarks

      task_risk_count: vRiskTaskRiskCountByTransRiskId {
        transRiskId
      }

      prevention_detail_count: vRiskPreventionDetailCountByTransRiskId {
        transRiskId
      }

      order_risk_count: vRiskOrderRiskCountByTransRiskId {
        transRiskId
      }

      order_detail_risk_count: vRiskOrderDetailRiskCountByTransRiskId {
        transRiskId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
