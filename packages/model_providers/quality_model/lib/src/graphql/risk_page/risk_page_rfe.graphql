# risk_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #RiskPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query RiskPageRfe(
  $transRiskId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  transRiskByTransRiskId(transRiskId: $transRiskId) {
    transRiskId

    labels: transLabelByTitles {
      transLabelId

      ja: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          labelValue
        }
      }

      en: transLabelValuesByTransLabelId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          labelValue
        }
      }

      remarks
    }

    detailTexts: transTextByDetails {
      transTextId

      ja: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          textValue
        }
      }

      en: transTextValuesByTransTextId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          textValue
        }
      }

      remarks
    }

    frequency
    momentous
    action
    residualRiskId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
