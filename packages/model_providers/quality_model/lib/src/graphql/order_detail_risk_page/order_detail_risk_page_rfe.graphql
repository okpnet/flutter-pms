# order_detail_risk_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #OrderDetailRiskPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderDetailRiskPageRfe(
  $transOrderDetailRiskId: UUID!
) {
  transOrderDetailRiskByTransOrderDetailRiskId(transOrderDetailRiskId: $transOrderDetailRiskId) {
    transOrderDetailRiskId
    transOrderDetailId
    riskId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
