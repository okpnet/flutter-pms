# audit_complaint_link_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #AuditComplaintLinkPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AuditComplaintLinkPageRfe(
  $transAuditComplaintId: UUID!
) {
  transAuditComplaintByTransAuditComplaintId(transAuditComplaintId: $transAuditComplaintId) {
    transAuditComplaintId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
