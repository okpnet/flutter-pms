# order_risk_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #OrderRiskPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query OrderRiskPageRfe(
  $transOrderRiskId: UUID!
) {
  transOrderRiskByTransOrderRiskId(transOrderRiskId: $transOrderRiskId) {
    transOrderRiskId
    transOrderId
    transRiskId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
