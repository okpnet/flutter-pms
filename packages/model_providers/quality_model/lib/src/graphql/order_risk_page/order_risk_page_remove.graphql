# order_risk_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #OrderRiskPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OrderRiskPageRemove(
  $transOrderRiskId: UUID!
  $remove: Boolean!
) {
  updateTransOrderRiskByTransOrderRiskId(
    input: {
      transOrderRiskId: $transOrderRiskId
      transOrderRiskPatch: { remove: $remove }
    }
  ) {
    transOrderRisk {
      transOrderRiskId
      remove
    }
  }
}
