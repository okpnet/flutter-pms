# order_risk_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #OrderRiskPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OrderRiskPageEdit(
  $transOrderRiskId: UUID!
  $transOrderId: UUID
  $transRiskId: UUID
  $remarks: String
) {
  updateTransOrderRiskByTransOrderRiskId(
    input: {
      transOrderRiskId: $transOrderRiskId
      transOrderRiskPatch: {
        transOrderId: $transOrderId
        transRiskId: $transRiskId
        remarks: $remarks
      }
    }
  ) {
    transOrderRisk {
      transOrderRiskId
      transOrderId
      transRiskId
      remarks
    }
  }
}
