# audit_std_ledger_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #AuditStdLedgerPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AuditStdLedgerPageRfe(
  $mstrAuditStdId: UUID!
) {
  mstrAuditStdByMstrAuditStdId(mstrAuditStdId: $mstrAuditStdId) {
    mstrAuditStdId
    code
    controlCode
    category
    names
    details
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
