# prevention_detail_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #PreventionDetailPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation PreventionDetailPageRemove(
  $transPreventionDetailId: UUID!
  $remove: Boolean!
) {
  updateTransPreventionDetailByTransPreventionDetailId(
    input: {
      transPreventionDetailId: $transPreventionDetailId
      transPreventionDetailPatch: { remove: $remove }
    }
  ) {
    transPreventionDetail {
      transPreventionDetailId
      remove
    }
  }
}
