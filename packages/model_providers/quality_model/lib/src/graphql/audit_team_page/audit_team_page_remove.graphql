# audit_team_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #AuditTeamPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AuditTeamPageRemove(
  $transAuditTeamId: UUID!
  $remove: Boolean!
) {
  updateTransAuditTeamByTransAuditTeamId(
    input: {
      transAuditTeamId: $transAuditTeamId
      transAuditTeamPatch: { remove: $remove }
    }
  ) {
    transAuditTeam {
      transAuditTeamId
      remove
    }
  }
}
