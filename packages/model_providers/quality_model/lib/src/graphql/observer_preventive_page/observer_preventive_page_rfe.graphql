# observer_preventive_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #ObserverPreventivePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ObserverPreventivePageRfe(
  $transObserverPreventiveId: UUID!
) {
  transObserverPreventiveByTransObserverPreventiveId(transObserverPreventiveId: $transObserverPreventiveId) {
    transObserverPreventiveId
    transObserverDisposalId
    transRecurrencePreventionId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
