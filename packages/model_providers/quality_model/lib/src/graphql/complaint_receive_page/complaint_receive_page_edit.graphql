# complaint_receive_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #ComplaintReceivePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ComplaintReceivePageEdit(
  $transComplaintReceiveId: UUID!
  $transComplaintId: UUID
  $receiveAt: Datetime
  $receiveStaffHistoryId: UUID
  $receiveStaffId: UUID
  $detailTextsTransTextId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
  $detailTextsJa: String!
  $detailTextsEn: String!
  $detailTextsRemarks: String
  $remarks: String
) {
  updateTransComplaintReceiveByTransComplaintReceiveId(
    input: {
      transComplaintReceiveId: $transComplaintReceiveId
      transComplaintReceivePatch: {
        transComplaintId: $transComplaintId
        receiveAt: $receiveAt
        receiveStaffHistoryId: $receiveStaffHistoryId
        receiveStaffId: $receiveStaffId

        transTextToDetails: {
          updateByTransTextId: {
            transTextId: $detailTextsTransTextId
            transTextPatch: {
              transTextValuesUsingTransTextId: {
                deleteOthers: true
                create: [
                  { sharedLanguageCodeId: $jaLanguageCodeId, textValue: $detailTextsJa }
                  { sharedLanguageCodeId: $enLanguageCodeId, textValue: $detailTextsEn }
                ]
              }

              remarks: $detailTextsRemarks
            }
          }
        }

        remarks: $remarks
      }
    }
  ) {
    transComplaintReceive {
      transComplaintReceiveId
      transComplaintId
      receiveAt
      receiveStaffHistoryId
      receiveStaffId

      detailTexts: transTextByDetails {
        transTextId

        ja: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        en: transTextValuesByTransTextId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            textValue
          }
        }

        remarks
      }

      remarks
    }
  }
}
