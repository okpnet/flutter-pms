# audit_checkitem_ledger_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #AuditCheckitemLedgerPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AuditCheckitemLedgerPageRemove(
  $mstrAuditStdCheckitemId: UUID!
  $remove: Boolean!
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateMstrAuditStdCheckitemByMstrAuditStdCheckitemId(
    input: {
      mstrAuditStdCheckitemId: $mstrAuditStdCheckitemId
      mstrAuditStdCheckitemPatch: { remove: $remove, updateUserId: $updateUserId, updateUserHistoryId: $updateUserHistoryId }
    }
  ) {
    mstrAuditStdCheckitem {
      mstrAuditStdCheckitemId
      remove
    }
  }
}
