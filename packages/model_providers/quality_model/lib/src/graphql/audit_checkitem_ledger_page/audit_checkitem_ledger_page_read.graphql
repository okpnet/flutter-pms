# audit_checkitem_ledger_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #AuditCheckitemLedgerPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query AuditCheckitemLedgerPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrAuditStdCheckitemFilter = {and: []}
  $orderBy: [MstrAuditStdCheckitemsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allMstrAuditStdCheckitems(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrAuditStdCheckitemId
      mstrAuditStdId
      code
      controlCode

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      detailTexts: sharedTextByDetails {
        sharedTextId
        value: sharedTextValuesBySharedTextId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            charCount
            leadText
          }
        }
      }

      typeClass
      formulaClass
      argClass
      symbol
      remarks
      updateAt
      remove
    }
  }
}
