) {
  mstrAuditStdCheckitemByMstrAuditStdCheckitemId(mstrAuditStdCheckitemId: $mstrAuditStdCheckitemId) {
    mstrAuditStdCheckitemId
    mstrAuditStdId
    code
    controlCode
    names
    details
    typeClass
    formulaClass
    argClass
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
