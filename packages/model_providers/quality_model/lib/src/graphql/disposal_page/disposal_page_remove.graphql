# disposal_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #DisposalPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation DisposalPageRemove(
  $transDisposalId: UUID!
  $remove: Boolean!
) {
  updateTransDisposalByTransDisposalId(
    input: {
      transDisposalId: $transDisposalId
      transDisposalPatch: { remove: $remove }
    }
  ) {
    transDisposal {
      transDisposalId
      remove
    }
  }
}
