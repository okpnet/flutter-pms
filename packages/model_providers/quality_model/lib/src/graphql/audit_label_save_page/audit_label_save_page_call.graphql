# audit_label_save_page画面 - Call(DBの関数の呼び出し)
#
# 画面仕様: gql/*.yaml #AuditLabelSavePageCall
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation AuditLabelSavePageCall(
  $pLabelId: UUID
  $pValues: JSON
  $pStaffId: UUID
  $pStaffHistoryId: UUID
) {
  transLabelSave(
    input: {
      pLabelId: $pLabelId
      pValues: $pValues
      pStaffId: $pStaffId
      pStaffHistoryId: $pStaffHistoryId
    }
  ) {
    transLabel {
      transLabelId
    }
  }
}
