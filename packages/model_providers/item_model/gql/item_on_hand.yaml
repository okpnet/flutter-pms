# yaml-language-server: $schema=../../schema.json

# 品目別の現在庫(v_item_on_hand。1行は品目)
ItemOnHandPage:
  kind: read
  from: v_item_on_hand
  filter: true
  columns:
    - item_id
    - on_hand_quantity
    - held_quantity
    - available_quantity
    - visiter_count
    - held_visiter_count
    # 社外の所有物(顧客・発注先)。available_quantity には含まれない
    - external_quantity
    - external_visiter_count
