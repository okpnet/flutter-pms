# item_kind_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #ItemKindPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ItemKindPageEdit(
  $mstrItemKindId: UUID!
  $code: String
  $names: UUID
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  updateMstrItemKindByMstrItemKindId(
    input: {
      mstrItemKindId: $mstrItemKindId
      mstrItemKindPatch: {
        code: $code
        names: $names
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    mstrItemKind {
      mstrItemKindId
      code
      names
      remarks
    }
  }
}
