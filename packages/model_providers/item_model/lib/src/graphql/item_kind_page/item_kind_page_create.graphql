# item_kind_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #ItemKindPageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ItemKindPageCreate(
  $code: String
  $names: UUID
  $remarks: String
  $updateUserId: UUID
  $updateUserHistoryId: UUID
) {
  createMstrItemKind(
    input: {
      mstrItemKind: {
        code: $code
        names: $names
        remarks: $remarks
        updateUserId: $updateUserId
        updateUserHistoryId: $updateUserHistoryId
      }
    }
  ) {
    mstrItemKind {
      mstrItemKindId
      code
      names
      remarks
      updateUserId
      updateUserHistoryId
    }
  }
}
