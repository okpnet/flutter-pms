# item_kind_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #ItemKindPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ItemKindPageRfe(
  $mstrItemKindId: UUID!
) {
  mstrItemKindByMstrItemKindId(mstrItemKindId: $mstrItemKindId) {
    mstrItemKindId
    code
    names
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
