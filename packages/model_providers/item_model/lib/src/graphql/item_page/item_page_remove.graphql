# item_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ItemPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ItemPageRemove(
  $mstrItemId: UUID!
  $remove: Boolean!
) {
  updateMstrItemByMstrItemId(
    input: {
      mstrItemId: $mstrItemId
      mstrItemPatch: { remove: $remove }
    }
  ) {
    mstrItem {
      mstrItemId
      remove
    }
  }
}
