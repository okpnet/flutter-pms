# task_outsource_available_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #TaskOutsourceAvailablePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query TaskOutsourceAvailablePageRead(
  $first: Int!
  $offset: Int
  $filter: MstrOutsourceAvailableFilter = {and: []}
  $orderBy: [MstrOutsourceAvailablesOrderBy!]
  $mstrTaskLocationId: UUID!
  $removed: Boolean = false
) {
  allMstrOutsourceAvailables(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { mstrTaskLocationId: { equalTo: $mstrTaskLocationId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrOutsourceAvailableId
      mstrTaskLocationId
      mstrStakeholderId
      deliveryInterval {
        seconds
        minutes
        hours
        days
        months
        years
      }
      materialSupply
      paidSupply
      revision
      symbol
      remarks
      updateAt
      remove
    }
  }
}
