# task_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #TaskPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation TaskPageRemove(
  $mstrTaskId: UUID!
  $remove: Boolean!
) {
  updateMstrTaskByMstrTaskId(
    input: {
      mstrTaskId: $mstrTaskId
      mstrTaskPatch: { remove: $remove }
    }
  ) {
    mstrTask {
      mstrTaskId
      remove
    }
  }
}
