# operation_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #OperationPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation OperationPageRemove(
  $mstrOperationId: UUID!
  $remove: Boolean!
) {
  updateMstrOperationByMstrOperationId(
    input: {
      mstrOperationId: $mstrOperationId
      mstrOperationPatch: { remove: $remove }
    }
  ) {
    mstrOperation {
      mstrOperationId
      remove
    }
  }
}
