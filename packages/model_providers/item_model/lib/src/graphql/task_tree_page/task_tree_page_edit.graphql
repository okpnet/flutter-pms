# task_tree_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #TaskTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation TaskTreePageEdit(
  $mstrTaskTreeId: UUID!
  $parentMstrTaskId: UUID
  $remarks: String
) {
  updateMstrTaskTreeByMstrTaskTreeId(
    input: {
      mstrTaskTreeId: $mstrTaskTreeId
      mstrTaskTreePatch: {
        parentMstrTaskId: $parentMstrTaskId
        remarks: $remarks
      }
    }
  ) {
    mstrTaskTree {
      mstrTaskTreeId
      parentMstrTaskId
      remarks
    }
  }
}
