# task_tree_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #TaskTreePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query TaskTreePageRfe(
  $mstrTaskTreeId: UUID!
) {
  mstrTaskTreeByMstrTaskTreeId(mstrTaskTreeId: $mstrTaskTreeId) {
    mstrTaskTreeId
    parentMstrTaskId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
