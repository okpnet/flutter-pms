# item_tree_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ItemTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ItemTreePageRemove(
  $mstrItemTreeId: UUID!
  $remove: Boolean!
) {
  updateMstrItemTreeByMstrItemTreeId(
    input: {
      mstrItemTreeId: $mstrItemTreeId
      mstrItemTreePatch: { remove: $remove }
    }
  ) {
    mstrItemTree {
      mstrItemTreeId
      remove
    }
  }
}
