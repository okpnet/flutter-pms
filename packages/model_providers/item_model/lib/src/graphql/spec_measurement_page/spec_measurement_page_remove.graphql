# spec_measurement_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #SpecMeasurementPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation SpecMeasurementPageRemove(
  $mstrSpecMeasurementId: UUID!
  $remove: Boolean!
) {
  updateMstrSpecMeasurementByMstrSpecMeasurementId(
    input: {
      mstrSpecMeasurementId: $mstrSpecMeasurementId
      mstrSpecMeasurementPatch: { remove: $remove }
    }
  ) {
    mstrSpecMeasurement {
      mstrSpecMeasurementId
      remove
    }
  }
}
