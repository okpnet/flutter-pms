# inventory_request_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #InventoryRequestPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation InventoryRequestPageEdit(
  $transInventoryRequestId: UUID!
  $registerAt: Datetime
  $registerPlanAt: Datetime
  $transPurchaseRezId: UUID
  $transProductRezId: UUID
  $quantity: BigFloat
  $staffHistoryId: UUID
  $staffId: UUID
  $remarks: String
) {
  updateTransInventoryRequestByTransInventoryRequestId(
    input: {
      transInventoryRequestId: $transInventoryRequestId
      transInventoryRequestPatch: {
        registerAt: $registerAt
        registerPlanAt: $registerPlanAt
        transPurchaseRezId: $transPurchaseRezId
        transProductRezId: $transProductRezId
        quantity: $quantity
        staffHistoryId: $staffHistoryId
        staffId: $staffId
        remarks: $remarks
      }
    }
  ) {
    transInventoryRequest {
      transInventoryRequestId
      registerAt
      registerPlanAt
      transPurchaseRezId
      transProductRezId
      quantity
      staffHistoryId
      staffId
      remarks
    }
  }
}
