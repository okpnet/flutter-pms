# inventory_request_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #InventoryRequestPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query InventoryRequestPageRead(
  $first: Int!
  $offset: Int
  $filter: TransInventoryRequestFilter = {and: []}
  $orderBy: [TransInventoryRequestsOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransInventoryRequests(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transInventoryRequestId
      registerAt
      registerPlanAt
      transPurchaseRezId
      transProductRezId
      transResourcePlanId
      quantity
      staffHistoryId
      staffId
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
