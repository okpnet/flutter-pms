# work_record_certificate_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #WorkRecordCertificatePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query WorkRecordCertificatePageRfe(
  $transWorkRecordCertificateId: UUID!
) {
  transWorkRecordCertificateByTransWorkRecordCertificateId(transWorkRecordCertificateId: $transWorkRecordCertificateId) {
    transWorkRecordCertificateId
    transCertificateId
    transWorkRecordId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
