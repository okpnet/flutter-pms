# container_tree_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #ContainerTreePageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query ContainerTreePageRfe(
  $transContainerTreeId: UUID!
) {
  transContainerTreeByTransContainerTreeId(transContainerTreeId: $transContainerTreeId) {
    transContainerTreeId
    parentTransContainerId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
