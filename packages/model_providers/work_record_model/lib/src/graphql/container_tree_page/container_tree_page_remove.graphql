# container_tree_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ContainerTreePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ContainerTreePageRemove(
  $transContainerTreeId: UUID!
  $remove: Boolean!
) {
  updateTransContainerTreeByTransContainerTreeId(
    input: {
      transContainerTreeId: $transContainerTreeId
      transContainerTreePatch: { remove: $remove }
    }
  ) {
    transContainerTree {
      transContainerTreeId
      remove
    }
  }
}
