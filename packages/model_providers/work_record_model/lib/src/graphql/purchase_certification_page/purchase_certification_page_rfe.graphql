# purchase_certification_page画面 - RFE(編集フォームへのプリロード用の読み込み専用クエリ)
#
# 画面仕様: gql/*.yaml #PurchaseCertificationPageEdit(generateRfe: true)
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchaseCertificationPageRfe(
  $transPurchaseCertificationId: UUID!
) {
  transPurchaseCertificationByTransPurchaseCertificationId(transPurchaseCertificationId: $transPurchaseCertificationId) {
    transPurchaseCertificationId
    transPurchaseRecId
    transCertificateId
    remarks
    updateUserId
    updateUserHistoryId
    remove
    updateAt
  }
}
