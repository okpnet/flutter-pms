# purchase_certification_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #PurchaseCertificationPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query PurchaseCertificationPageRead(
  $first: Int!
  $offset: Int
  $filter: TransPurchaseCertificationFilter = {and: []}
  $orderBy: [TransPurchaseCertificationsOrderBy!]
  $languageCodeId: UUID!
  $transPurchaseRecId: UUID!
  $removed: Boolean = false
) {
  allTransPurchaseCertifications(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transPurchaseRecId: { equalTo: $transPurchaseRecId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPurchaseCertificationId
      transPurchaseRecId
      transCertificateId
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
