# register_work_plan_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #RegisterWorkPlanPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query RegisterWorkPlanPageRead(
  $first: Int!
  $offset: Int
  $filter: TransWorkPlanFilter = {and: []}
  $orderBy: [TransWorkPlansOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransWorkPlans(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transWorkPlanId
      transOperationsPlanId
      symbol
      sequence
      startAt
      completionAt

      task: mstrTaskByMstrTaskId {
        mstrTaskId

        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }

      register: vRegisterTargetsByTransWorkPlanId(first: 1) {
        nodes {
          targetId
          quantity
          doneQuantity
          remainingQuantity
          inProgress
          registrable
          stopped
          closed
        }
      }
    }
  }
}
