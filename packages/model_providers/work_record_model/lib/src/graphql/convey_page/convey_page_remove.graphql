# convey_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #ConveyPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ConveyPageRemove(
  $transConveyId: UUID!
  $remove: Boolean!
) {
  updateTransConveyByTransConveyId(
    input: {
      transConveyId: $transConveyId
      transConveyPatch: { remove: $remove }
    }
  ) {
    transConvey {
      transConveyId
      remove
    }
  }
}
