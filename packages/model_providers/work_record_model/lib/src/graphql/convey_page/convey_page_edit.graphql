# convey_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #ConveyPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation ConveyPageEdit(
  $transConveyId: UUID!
  $transVisiterId: UUID
  $receive: Boolean
  $conveyAt: Datetime
  $quantity: BigFloat
  $locationHistoryId: UUID
  $locationId: UUID
  $staffHistoryId: UUID
  $staffId: UUID
  $remarks: String
) {
  updateTransConveyByTransConveyId(
    input: {
      transConveyId: $transConveyId
      transConveyPatch: {
        transVisiterId: $transVisiterId
        receive: $receive
        conveyAt: $conveyAt
        quantity: $quantity
        locationHistoryId: $locationHistoryId
        locationId: $locationId
        staffHistoryId: $staffHistoryId
        staffId: $staffId
        remarks: $remarks
      }
    }
  ) {
    transConvey {
      transConveyId
      transVisiterId
      receive
      conveyAt
      quantity
      locationHistoryId
      locationId
      staffHistoryId
      staffId
      remarks
    }
  }
}
