# visiter_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #VisiterPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation VisiterPageRemove(
  $transVisiterId: UUID!
  $remove: Boolean!
) {
  updateTransVisiterByTransVisiterId(
    input: {
      transVisiterId: $transVisiterId
      transVisiterPatch: { remove: $remove }
    }
  ) {
    transVisiter {
      transVisiterId
      remove
    }
  }
}
