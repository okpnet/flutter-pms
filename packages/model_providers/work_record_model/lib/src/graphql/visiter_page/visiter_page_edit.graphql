# visiter_page画面 - Edit(ミューテーション)
#
# 画面仕様: gql/*.yaml #VisiterPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation VisiterPageEdit(
  $transVisiterId: UUID!
  $transContainerId: UUID
  $release: Boolean
  $quantity: BigFloat
  $remarks: String
) {
  updateTransVisiterByTransVisiterId(
    input: {
      transVisiterId: $transVisiterId
      transVisiterPatch: {
        transContainerId: $transContainerId
        release: $release
        quantity: $quantity
        remarks: $remarks
      }
    }
  ) {
    transVisiter {
      transVisiterId
      transContainerId
      release
      quantity
      remarks
    }
  }
}
