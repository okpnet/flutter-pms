# register_container_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #RegisterContainerPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query RegisterContainerPageRead(
  $first: Int!
  $offset: Int
  $filter: TransContainerFilter = {and: []}
  $orderBy: [TransContainersOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allTransContainers(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transContainerId
      code
      symbol

      labels: transLabelByNames {
        transLabelId

        value: transLabelValuesByTransLabelId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            labelValue
          }
        }
      }
    }
  }
}
