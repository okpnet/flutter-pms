# visiter_origin_check_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #VisiterOriginCheckPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query VisiterOriginCheckPageRead(
  $first: Int!
  $offset: Int
  $filter: VVisiterOriginCheckFilter = {and: []}
  $orderBy: [VVisiterOriginChecksOrderBy!]
) {
  allVVisiterOriginChecks(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      originKind
      originId
      transPurchaseRecId
      transWorkRecordId
      recordQuantity
      visiterQuantity
      difference
      visiterCount
    }
  }
}
