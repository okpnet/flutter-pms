# work_record_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #WorkRecordPageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation WorkRecordPageRemove(
  $transWorkRecordId: UUID!
  $remove: Boolean!
) {
  updateTransWorkRecordByTransWorkRecordId(
    input: {
      transWorkRecordId: $transWorkRecordId
      transWorkRecordPatch: { remove: $remove }
    }
  ) {
    transWorkRecord {
      transWorkRecordId
      remove
    }
  }
}
