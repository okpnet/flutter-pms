# work_record_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #WorkRecordPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query WorkRecordPageRead(
  $first: Int!
  $offset: Int
  $filter: TransWorkRecordFilter = {and: []}
  $orderBy: [TransWorkRecordsOrderBy!]
  $languageCodeId: UUID!
  $transWorkPlanId: UUID!
  $removed: Boolean = false
) {
  allTransWorkRecords(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, { transWorkPlanId: { equalTo: $transWorkPlanId } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transWorkRecordId
      transWorkPlanId
      nthTime
      startAt
      stopAt
      qty
      staffHistoryId
      staffId
      equipmentHistoryId
      equipmentId
      symbol
      remarks

      work_record_visiter_count: vWorkRecordWorkRecordVisiterCountByTransWorkRecordId {
        transWorkRecordId
      }

      work_record_certificate_count: vWorkRecordWorkRecordCertificateCountByTransWorkRecordId {
        transWorkRecordId
      }

      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        sex
        phone
        symbol
        privatePhone
      }
    }
  }
}
