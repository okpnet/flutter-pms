# register_record_visiter_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #RegisterRecordVisiterPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query RegisterRecordVisiterPageRead(
  $first: Int!
  $offset: Int
  $filter: TransWorkRecordVisiterFilter = {and: []}
  $orderBy: [TransWorkRecordVisitersOrderBy!]
  $removed: Boolean = false
) {
  allTransWorkRecordVisiters(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transWorkRecordVisiterId
      transWorkRecordId
      transVisiterId

      visiter: transVisiterByTransVisiterId {
        transVisiterId
        parentTransVisiterId
        transContainerId
        quantity
      }
    }
  }
}
