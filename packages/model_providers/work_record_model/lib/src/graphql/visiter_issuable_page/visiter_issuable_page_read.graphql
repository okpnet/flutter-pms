# visiter_issuable_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #VisiterIssuablePage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query VisiterIssuablePageRead(
  $first: Int!
  $offset: Int
  $filter: VVisiterIssuableFilter = {and: []}
  $orderBy: [VVisiterIssuablesOrderBy!]
) {
  allVVisiterIssuables(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transVisiterId
      transContainerId
      quantity
      release
      openComplaintCount
      issuable
      blockReason
    }
  }
}
