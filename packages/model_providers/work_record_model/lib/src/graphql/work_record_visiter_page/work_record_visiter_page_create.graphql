# work_record_visiter_page画面 - Create(登録のミューテーション)
#
# 画面仕様: gql/*.yaml #WorkRecordVisiterPageCreate
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation WorkRecordVisiterPageCreate(
  $transVisiterId: UUID
  $transWorkRecordId: UUID
  $quantity: BigFloat
  $remarks: String
) {
  createTransWorkRecordVisiter(
    input: {
      transWorkRecordVisiter: {
        transVisiterId: $transVisiterId
        transWorkRecordId: $transWorkRecordId
        quantity: $quantity
        remarks: $remarks
      }
    }
  ) {
    transWorkRecordVisiter {
      transWorkRecordVisiterId
      transVisiterId
      transWorkRecordId
      quantity
      remarks
    }
  }
}
