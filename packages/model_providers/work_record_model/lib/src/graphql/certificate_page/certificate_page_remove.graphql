# certificate_page画面 - Remove(論理削除のミューテーション)
#
# 画面仕様: gql/*.yaml #CertificatePageEdit
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

mutation CertificatePageRemove(
  $transCertificateId: UUID!
  $remove: Boolean!
) {
  updateTransCertificateByTransCertificateId(
    input: {
      transCertificateId: $transCertificateId
      transCertificatePatch: { remove: $remove }
    }
  ) {
    transCertificate {
      transCertificateId
      remove
    }
  }
}
