# mrp_visiter_item_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: gql/*.yaml #MrpVisiterItemPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query MrpVisiterItemPageRead(
  $first: Int!
  $offset: Int
  $filter: VMrpVisiterItemFilter = {and: []}
  $orderBy: [VMrpVisiterItemsOrderBy!]
) {
  allVMrpVisiterItems(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [$filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transVisiterId
      itemId
      itemCount
      finished
      quantity
    }
  }
}
