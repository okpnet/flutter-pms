# yaml-language-server: $schema=../../schema.json

# 有効な所有者(trans_visiter_owner。ロット1件につき1行。行なし/所有者 NULL = 自社)。
# 読み取り専用。DB のトリガー(13)だけが書く。create / update / delete の mutation は使わない(YAML に書かない)。
VisiterOwnerPage:
  kind: read
  from: trans_visiter_owner
  filter: true
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - trans_visiter_owner_id
    - trans_visiter_id
    - owner_stakeholder_id
    - trans_supply_detail_id
    - trans_order_detail_id
    - effective_at
    - symbol
    - remarks
    - update_at

# 社外の所有物の一覧(v_external_property。顧客・発注先。ISO 9001 8.5.3)
ExternalPropertyPage:
  kind: read
  from: v_external_property
  filter: true
  columns:
    - trans_visiter_id
    - symbol
    - owner_stakeholder_id
    - item_id
    - trans_container_id
    - mstr_location_id
    - quantity
    - release
    - open_complaint_count
    - trans_supply_detail_id
    - trans_order_detail_id
    - effective_at


# ---- 管理者の操作: ロットの所有者を決め直す(visiter_owner_rebuild)----
# 受注明細の顧客所有(customer_property)・受注の顧客を後から変えたあとに、全ロットの有効な所有者(trans_visiter_owner)を決め直す。
# 管理者だけが実行できる(一般ユーザーは権限エラー)。引数は無く、戻り値は決め直したロットの件数(Int)。
# 画面は未作成。単一の画面・サブ画面・子の台帳のどれにするかは、issue/202611.md#20261118_0001 の「所有者の決め直しの画面の検討」。
VisiterOwnerRebuildPageCall:
  kind: function
  mutation: visiterOwnerRebuild
  returns: integer
