# yaml-language-server: $schema=../../schema.json

# 棚ビジター(ロット)の台帳ビュー。数量は棚ビジターだけが持つ(+が入庫、-が出庫)。
# 結合を持たない列だけを読む。

# 払出候補(v_visiter_issuable。1行はロット)。issuable: true で絞る
VisiterIssuablePage:
  kind: read
  from: v_visiter_issuable
  filter: true
  columns:
    - trans_visiter_id
    - symbol
    - trans_container_id
    - quantity
    - release
    - open_complaint_count
    - issuable
    - block_reason

# 仮止めなのに異常が無いロット(v_visiter_hold_without_complaint)。異常の登録を促す
VisiterHoldWithoutComplaintPage:
  kind: read
  from: v_visiter_hold_without_complaint
  filter: true
  columns:
    - trans_visiter_id
    - trans_container_id
    - mstr_location_id
    - quantity
    - hold_at
    - update_user_id

# 帳簿の不備(v_visiter_ledger_issue。1行は行の不備)
VisiterLedgerIssuePage:
  kind: read
  from: v_visiter_ledger_issue
  filter: true
  columns:
    - trans_visiter_id
    - issue_kind
    - row_quantity
    - balance
    - parent_trans_visiter_id
    - trans_container_id

# 伝票数量と入庫の行の合計の不一致(v_visiter_origin_check。1行は受入実績・作業実績)
VisiterOriginCheckPage:
  kind: read
  from: v_visiter_origin_check
  filter: true
  columns:
    - origin_kind
    - origin_id
    - trans_purchase_rec_id
    - trans_work_record_id
    - record_quantity
    - visiter_quantity
    - difference
    - visiter_count

# ---- DBの関数(kind: function)。1回の呼び出し = 1トランザクションで、行と受払実績をまとめて作る ----
# 担当者は p_staff_id、省略時は JWT の staff_id。場所は棚の場所、無ければ p_location_id。
# エラーは errcode で判定する(VIS00 担当者 / VIS01 在庫 / VIS02 数量 / VIS03 不足 / VIS04 取り出せない / VIS05 場所 / VIS06 棚 / VIS07 作業実績)。

# 払出・出荷・製造への材料投入(visiter_issue)。戻り値は作った-の行
VisiterIssuePageCall:
  kind: function
  mutation: visiterIssue
  returns: transVisiter
  columns:
    - trans_visiter_id
    - parent_trans_visiter_id
    - trans_container_id
    - quantity

# 移動・分割・隔離(visiter_move)。p_hold で移動先を仮止め。戻り値は移動先の在庫
VisiterMovePageCall:
  kind: function
  mutation: visiterMove
  returns: transVisiter
  columns:
    - trans_visiter_id
    - parent_trans_visiter_id
    - trans_container_id
    - quantity
    - release

# 棚卸し(visiter_adjust)。数えた数に合わせる調整行を作る。差が無ければ戻り値は null
VisiterAdjustPageCall:
  kind: function
  mutation: visiterAdjust
  returns: transVisiter
  columns:
    - trans_visiter_id
    - parent_trans_visiter_id
    - trans_container_id
    - quantity
    - adjustment
