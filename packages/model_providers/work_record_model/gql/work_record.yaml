# yaml-language-server: $schema=../../schema.json

# trans_containerの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
ContainerPage: &ContainerPage
  kind: read
  from: trans_container
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_container_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      <<: *FlexibleLabelReadFields
    - mstr_location_id
    - name: location
      as: location
      arrayType: toFirstOne
      using: mstr_location_id
      <<: *LocationReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: visiter_count
      arrayType: toFirstOne
      as: visiter_count
      using: trans_container_id
      from: v_container_visiter_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_containerの書き込み
ContainerPageEdit:
  kind: edit
  from: trans_container
  requiredWhere:
    - trans_container_id
  generateRfe: true
  columns:
    - trans_container_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *FlexibleLabelEditFields
    - mstr_location_id
    - name: location
      as: location
      arrayType: toFirstOne
      using: mstr_location_id
      editable: false
      <<: *LocationReadFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# trans_certificateの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
CertificatePage: &CertificatePage
  kind: read
  from: trans_certificate
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_certificate_id
    - serial
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelReadFields
    - class
    - trans_file_id
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 2本)
    - name: work_record_certificate_count
      arrayType: toFirstOne
      as: work_record_certificate_count
      using: trans_certificate_id
      from: v_certificate_work_record_certificate_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: purchase_certification_count
      arrayType: toFirstOne
      as: purchase_certification_count
      using: trans_certificate_id
      from: v_certificate_purchase_certification_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_certificateの書き込み
CertificatePageEdit:
  kind: edit
  from: trans_certificate
  requiredWhere:
    - trans_certificate_id
