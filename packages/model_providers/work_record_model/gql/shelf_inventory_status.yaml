# yaml-language-server: $schema=../../schema.json

# 棚在庫状況(棚ビジター)(ダッシュボード用。要件20261027_0001。1行はロット。quantity は今の数量)
ShelfInventoryStatusPage:
  kind: read
  from: v_shelf_inventory_status
  filter: true
  columns:
    - trans_visiter_id
    - parent_trans_visiter_id
    - root_visiter_id
    - trans_container_id
    - mstr_location_id
    - release
    - quantity
    - receipt_quantity
    - issue_quantity
    - adjustment_quantity
    - line_count
    - split_count
    - open_complaint_count
    - trans_purchase_rec_ids
    - purchase_rec_count
    - trans_work_record_ids
    - work_record_count
    - consumed_work_record_ids
    - consumed_work_record_count
    - trans_convey_ids
    - convey_count
    - last_convey_at
