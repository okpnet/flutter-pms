name: page_mediator_extension
description: "ページ用の拡張(Mediator)。データ取得(data_strategist)・設定の保存(settings_keeper)・セッション確認を、インターフェイス経由でページへ提供する。"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml
  data_strategist:
    path: ../../foundation/data_strategist
  settings_keeper:
    path: ../settings_keeper
  logger_provider:
    path: ../../infra/logger_provider

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # Managed by Melos, change it in the bootstrap config of the root pubspec.yaml

flutter:
