# shipping_kind画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #shipping_kind / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/shipping_kind/shipping_kind_read.graphql
#
# ⚠ docs/0025_view_graphql_evaluation_log.md: 画面仕様の見出しに対応する実スキーマの型名は
#   "MstrShippingKind"(配送区分マスタ)。org_res_equipment_kind等と同じ、id + 呼称セット +
#   remarks/update_at/removeのみの単純な構成。
#
# ⚠ 要件0026(2026/09/20実施分、docs/0026_schema_fetch_log.md追記9・
#   docs/0033_shared_dictionary_language_redesign_log.md参照): "SharedDictionary.ja/en"
#   スカラー列が廃止され、"SharedLanguageCode"(言語コードマスタ)経由の子テーブル
#   "SharedDictionaryValue"(1言語1行、shared_language_code_id+shared_dictionary_idで
#   一意)に置き換わったことを受けて、"ja"/"en"はエイリアス付きのConnectionフィールドとして
#   取得する(collapseSingleRecordPathsで先頭1件展開が前提。一意制約により常に0〜1件)。
#   $jaLanguageCodeId・$enLanguageCodeIdは、アプリケーションが別途
#   "SharedLanguageCode"を"code"(例:'ja'/'en')で解決して渡す想定(要件0026追記9)。

query ShippingKindRead(
  $first: Int!
  $offset: Int
  $condition: MstrShippingKindCondition
  $orderBy: [MstrShippingKindsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $jaLanguageCodeId: UUID
  $enLanguageCodeId: UUID
  $removed: Boolean = false
) {
  allMstrShippingKinds(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrShippingKindId
      code

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 配送区分名 / 読み / 略称(共通名前仕様) ---------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) @include(if: $ja) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) @include(if: $en) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) @include(if: $ja) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) @include(if: $en) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) @include(if: $ja) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) @include(if: $en) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「ShippingKindReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query ShippingKindReadUpdaterAppellation(
  $sharedAppellationsId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja: sharedDictionaryValuesBySharedDictionaryId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          dictionaryValue
        }
      }
      en: sharedDictionaryValuesBySharedDictionaryId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          dictionaryValue
        }
      }
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja: sharedDictionaryValuesBySharedDictionaryId(
        condition: { sharedLanguageCodeId: $jaLanguageCodeId }
      ) {
        nodes {
          dictionaryValue
        }
      }
      en: sharedDictionaryValuesBySharedDictionaryId(
        condition: { sharedLanguageCodeId: $enLanguageCodeId }
      ) {
        nodes {
          dictionaryValue
        }
      }
    }
  }
}
