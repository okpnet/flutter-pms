# order_detail画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #order_detail / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/order_detail/order_detail_edit.graphql
#
# ⚠ 実スキーマの型名は"TransOrderDetail"。
# ⚠ 「品目履歴」はスカラーID(historyMstrItemId・mstrItemId)のみ設定(既存の品目履歴スナップショットへの
#   付け替え。新規スナップショット行の作成は対象外、org_res_equipment等の「場所名」と同じ方針)。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation OrderDetailEdit(
  $transOrderDetailId: UUID!
  $transOrderId: UUID
  $historyMstrItemId: UUID
  $mstrItemId: UUID
  $quantity: BigFloat
  $cost: BigFloat
  $deliveryDate: Datetime
  $deadline: Datetime
  $remarks: String
  $symbol: String
) {
  updateTransOrderDetailByTransOrderDetailId(
    input: {
      transOrderDetailId: $transOrderDetailId
      transOrderDetailPatch: {
        transOrderId: $transOrderId
        historyMstrItemId: $historyMstrItemId
        mstrItemId: $mstrItemId
        quantity: $quantity
        cost: $cost
        deliveryDate: $deliveryDate
        deadline: $deadline
        remarks: $remarks
        symbol: $symbol
      }
    }
  ) {
    transOrderDetail {
      transOrderDetailId
      transOrderId
      historyMstrItemId
      mstrItemId
      quantity
      cost
      deliveryDate
      deadline
      remarks
      symbol
    }
  }
}
