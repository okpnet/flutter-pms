# order_detail画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #order_detail / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/order_detail/order_detail_read.graphql
#
# ⚠ 実スキーマの型名は"TransOrderDetail"(受注明細)。
# ⚠ 「品目履歴id」「品目id」は"HistoryMstrItem"(品目履歴マスタ)への複合キー参照
#   (historyMstrItemByHistoryMstrItemIdAndMstrItemId)。品目コード/識別コード/表示コードは
#   このHistoryMstrItemから取得する(発注時点のスナップショット)。
# ⚠ HistoryMstrItemには製造元(MstrManufacturer)への直接参照フィールドが無く、
#   スカラー列mstrManufacturerIdのみ保持するため、「OrderDetailReadManufacturer」を
#   別クエリで呼び出して解決する(要件0018の既定方針である「更新者名」解決と同じ手法)。

query OrderDetailRead(
  $first: Int!
  $offset: Int
  $condition: TransOrderDetailCondition
  $orderBy: [TransOrderDetailsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allTransOrderDetails(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transOrderDetailId
      transOrderId
      historyMstrItemId
      mstrItemId
      quantity
      cost
      deliveryDate
      deadline

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 品目コード / 識別コード / 表示コード / 製造元ID(品目履歴マスタ、⚠参照) -------
      historyMstrItemByHistoryMstrItemIdAndMstrItemId {
        historyId
        code
        identification
        labelCode
        mstrManufacturerId
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「OrderDetailReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query OrderDetailReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}

# --- 製造元(呼称セット経由)の名前解決 --------------------------------------------
# historyMstrItemByHistoryMstrItemIdAndMstrItemId.mstrManufacturerId を渡す。
query OrderDetailReadManufacturer($mstrManufacturerId: UUID!, $ja: Boolean!, $en: Boolean!) {
  mstrManufacturerByMstrManufacturerId(mstrManufacturerId: $mstrManufacturerId) {
    mstrManufacturerId
    sharedAppellationBySharedAppellationsId {
      sharedDictionaryBySharedDictionaryNameId {
        ja @include(if: $ja)
        en @include(if: $en)
      }
      sharedDictionaryBySharedDictionaryPronunciationId {
        ja @include(if: $ja)
        en @include(if: $en)
      }
      sharedDictionaryBySharedDictionaryNicknameId {
        ja @include(if: $ja)
        en @include(if: $en)
      }
    }
  }
}
