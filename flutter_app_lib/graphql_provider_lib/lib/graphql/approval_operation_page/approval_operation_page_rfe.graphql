# approval_operation_page画面 - RFE(read for editing、要件0037:
#   ApprovalOperationPageEditのgenerateRfe: trueから導出)
#
# 要件0045で確立した最新方式(department_page_rfe.graphql参照)にあわせ、
# $jaLanguageCodeId/$enLanguageCodeIdをUUID!(必須)として両言語を常時取得する。

query ApprovalOperationPageRfe(
  $mstrApprovalPatternId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
) {
  mstrApprovalPatternByMstrApprovalPatternId(
    mstrApprovalPatternId: $mstrApprovalPatternId
  ) {
    mstrApprovalPatternId
    symbol
    remarks
    updateAt
    updateUserId
    updateUserHistoryId
    remove

    labels: sharedAppellationByNames {
      sharedAppellationsId
      sharedDictionaryBySharedDictionaryNameId {
        sharedDictionaryId
        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }
      sharedDictionaryBySharedDictionaryPronunciationId {
        sharedDictionaryId
        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }
      sharedDictionaryBySharedDictionaryNicknameId {
        sharedDictionaryId
        ja: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $jaLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
        en: sharedDictionaryValuesBySharedDictionaryId(
          condition: { sharedLanguageCodeId: $enLanguageCodeId }
        ) {
          nodes {
            dictionaryValue
          }
        }
      }
    }

    pattern_detail: mstrApprovalPatternDetailsByMstrApprovalPatternId {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        mstrApprovalPatternDetailId
        mstrApprovalId
        mstrApprovalPatternId
        symbol
        remarks
        updateAt
        remove

        approval: mstrApprovalByMstrApprovalId {
          mstrApprovalId
          infoDepartmentId
          infoPositionId
          priority
          symbol
          remarks
          updateAt
          remove

          labels: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              ja: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $jaLanguageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
              en: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $enLanguageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
            sharedDictionaryBySharedDictionaryPronunciationId {
              sharedDictionaryId
              ja: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $jaLanguageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
              en: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $enLanguageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
            sharedDictionaryBySharedDictionaryNicknameId {
              sharedDictionaryId
              ja: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $jaLanguageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
              en: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $enLanguageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }
        }
      }
    }
  }
}
