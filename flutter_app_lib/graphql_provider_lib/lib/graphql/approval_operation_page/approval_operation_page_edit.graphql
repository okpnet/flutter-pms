# approval_operation_page画面 - Edit(ミューテーション)
#
# 画面仕様: source/view.yaml #ApprovalOperationPageEdit(承認オペレーション、
# mstr_approval_pattern)。
#
# `pattern_detail`(mstr_approval_pattern_detail、1対多)はcompany_page_edit.graphqlの
# `provisions`と同じ方針で、PostGraphileの入れ子書き込み型をそのままリスト変数として
# 公開する($patternDetailUpdate/$patternDetailCreate/$patternDetailDelete)。各要素は
# `lib/graphql/schema.graphql`の対応する入力型に従う。内側の`approval`
# (mstr_approval、要件0044参照)への編集(名称・部署ID・役割ID)は、要素のPatch内で
# `mstrApprovalToMstrApprovalId.updateByMstrApprovalId`としてさらに入れ子で表現できるが、
# 本ファイルでは結果選択(output)側のみを完全にネストし、書き込み側は呼び出し側が
# 各要素のPatchオブジェクトを直接組み立てる想定とする(department/positionは
# view.yamlコメントのとおりIDを取得するだけで、編集はしない)。
#
# 監査列(update_user_id/update_user_history_id/remove)は要件0045の方針により
# 変数・Patch・出力から除外する。

# 要件0047(view.yaml修正に伴う再生成): ApprovalEdit.department/position(editable: false、ID割り当てのみ)を、
# 表示用としてDepartmentPage/PositionPageと同型の全列で追加した(staff_capability_page_edit.graphqlと同じ方針)。
# RFE側はview.yamlに無いsymbol(ルート・pattern_detail・approval)を削除した。

