# oepration_editer画面 - Read(専用編集画面の初期表示用クエリ)
#
# 画面仕様: source/views.md #oepration_editer / read(見出し名はviews.md原文どおり。
#   "operation_editor"の誤記と見られるが、要件0025評価ログでは既存の"info_postion"等と同様、
#   見出し文字列自体は書き換えずディレクトリ/ファイル名に使用している)
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/oepration_editer/oepration_editer_read.graphql
#
# ⚠ 実スキーマの型名は"MstrOperation"(operationと同一物理テーブル)。
# ⚠ 「工程運用課題」は1対多のため、要件0027(readで配列を読み込まない)・0028(列(先頭)は
#   更新日時が最新の先頭1レコード)に基づき、更新日時降順の先頭1件のidのみ取得し、件数は
#   totalCountで取得する(views.md #oepration_editer 「工程運用課題id(先頭)」「工程運用課題数」)。
#   詳細な配列(品目工程運用課題マスタまで)はeditのみで取得する。

query OeprationEditerRead(
  $first: Int!
  $offset: Int
  $condition: MstrOperationCondition
  $orderBy: [MstrOperationsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allMstrOperations(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrOperationId
      controlCode
      detail

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 呼称セット(共通名前仕様) ------------------------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # --- 工程運用課題id(先頭) / 工程運用課題数 -----------------------------------
      mstrOperationTasksByMstrOperationId(
        first: 1
        orderBy: [UPDATE_AT_DESC]
      ) {
        nodes {
          mstrOperationTaskId
        }
        totalCount
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「OeprationEditerReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query OeprationEditerReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
