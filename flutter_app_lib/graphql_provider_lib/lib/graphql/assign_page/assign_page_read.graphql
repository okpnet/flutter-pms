# assign_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/view.yaml #AssignPage(担当者の組織割り当て、info_assign)
# 命名規則: CLAUDE.md 画面仕様命名規則(要件0033)により`assign_page`をファイル名にする。
#
# staff(担当者、StaffPage共有アーム)はstaff_page_read.graphqlと同型(labelsのみ、住所無し)。
# position/office/departmentはIDのみ(view.yamlに埋め込み指定が無いため)。

query AssignPageRead(
  $first: Int!
  $offset: Int
  $condition: InfoAssignCondition
  $orderBy: [InfoAssignsOrderBy!] = [PRIMARY_KEY_ASC]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allInfoAssigns(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoAssignId
      infoPositionId
      infoOfficeId
      infoDepartmentId
      enable
      priority
      symbol
      remarks
      updateAt
      remove

      staff: infoStaffByInfoStaffId {
        infoStaffId
        infoCompanyId
        code
        sex
        phone
        privatePhone
        symbol
        remarks
        updateAt
        remove

        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
          historyId
          infoStaffId
          infoCompanyId
          code
          sex
          phone
          symbol
          privatePhone
          name: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
            sharedDictionaryBySharedDictionaryPronunciationId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
            sharedDictionaryBySharedDictionaryNicknameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }
        }
      }

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code
        sex
        phone
        symbol
        privatePhone
        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }
    }
  }
}
