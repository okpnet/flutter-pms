# capable_staff_page - Edit(ミューテーション)
#
# 画面仕様: source/view.yaml #CapableStaffPageEdit(StaffCapabilityEditFieldsを取り込む)
# 要件0050: 共有する本体をStaffCapabilityEditFieldsとし、CapableStaffPageEdit・StaffCapabilityPageEditを
# 各ページの編集画面として新設した。内容は2つのページで同一(生成物はそれぞれのフォルダに置く)。
#
# mstr_staff_capabilityはinfo_staff_idでパーティショニングされており、Postgraphileが
# 生成する一意キー更新ミューテーションは単独PK(mstrStaffCapabilityId)ではなく
# updateMstrStaffCapabilityByMstrStaffCapabilityIdAndInfoStaffId(複合)のみのため、
# requiredWhereも複合(mstr_staff_capability_id, info_staff_id)である(要件0028)。
#
# staff/capabilityは「IDを割り当てるだけ」(editable: false、要件0047)のため、$infoStaffId/
# $mstrCapabilityIdはスカラーのID再割り当てとしてPatchに含め、出力側ではStaffPage/CapabilityPageと
# 同型の全列を返す。名称解決は$jaLanguageCodeId/$enLanguageCodeId(必須)方式(要件0036)。
#
# 監査列(update_user_id/update_user_history_id/remove)は変数・Patch・出力に含めない(要件0048)。
# generateRfe: trueにより、読み込み専用クエリをcapable_staff_page_rfe.graphqlへ導出する(要件0037)。

mutation CapableStaffPageEdit(
  $mstrStaffCapabilityId: UUID!
