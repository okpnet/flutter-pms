# staff_capability_page - RFE(read for editing、要件0037: StaffCapabilityPageEditのgenerateRfe: trueから導出)
#
# 要件0050: StaffCapabilityEditFieldsを取り込むStaffCapabilityPageEditの新設に伴い、このフォルダへ生成する。
# mstr_staff_capabilityの一意キー更新はByMstrStaffCapabilityIdAndInfoStaffId(複合)のため、
# RFEの単一レコード取得も同じ複合引数を取る(staff_capability_page_edit.graphql参照)。
# 要件0036の方式: $jaLanguageCodeId/$enLanguageCodeId(UUID!、必須)で両言語を常時取得する。

