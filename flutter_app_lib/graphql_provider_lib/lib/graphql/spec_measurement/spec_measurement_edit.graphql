# spec_measurement画面 - Edit(ミューテーション)
#
# 画面仕様: source/view.yaml #SpecMeasurementEdit(梱包サイズ、mstr_spec_measurement)
#
# `shared_unit_id`(生のFK列、既存のshared_unit行への直接の付け替え)をPatch対象とし、
# `unit`(Unit共有アーム経由の呼称セット)はコメント「IDの取得のみ」のとおり結果選択でのみ
# 使う(書き込みはしない)。監査列(update_user_id/update_user_history_id/remove)は
# 要件0045の方針により変数・Patch・出力から除外する。

mutation SpecMeasurementEdit(
  $mstrSpecMeasurementId: UUID!
  $measurementValue: BigFloat
  $sharedUnitId: UUID
  $remarks: String
  $languageCodeId: UUID!
) {
  updateMstrSpecMeasurementByMstrSpecMeasurementId(
    input: {
      mstrSpecMeasurementId: $mstrSpecMeasurementId
      mstrSpecMeasurementPatch: {
        measurementValue: $measurementValue
        sharedUnitId: $sharedUnitId
        remarks: $remarks
      }
    }
  ) {
    mstrSpecMeasurement {
      mstrSpecMeasurementId
      measurementValue
      sharedUnitId
      remarks

      unit: sharedUnitBySharedUnitId {
        sharedUnitId
        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }
    }
  }
}
