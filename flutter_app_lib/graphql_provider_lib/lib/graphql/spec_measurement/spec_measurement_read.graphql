# spec_measurement画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/view.yaml #SpecMeasurement(梱包サイズ、mstr_spec_measurement)
# 命名規則: CLAUDE.md 画面仕様命名規則(要件0033)により`spec_measurement`をファイル名にする。
#
# 要件0044レビュー: view.yamlのcolumnsには remarks/update_at/update_user が明示されて
# いないが、CLAUDE.md「このライブラリの仕様」の共通項(remarks/update_at/remove/
# update_user)に従い、他画面と同様に常時取得する(symbolは未宣言のため含めない)。
#
# 要件0044フィードバック: view.yamlは当初`shared_unit_id`(生のFK列)と`unit`
# (Unit共有アーム経由の呼称セット。内部で`sharedUnitId`を出力する)の両方を宣言して
# いたが、同じ値を二重に持つ冗長な出力だったため、列数が少なくデータが小さくなる
# `unit`側に統一し、生の`shared_unit_id`は削除した(edit側はPatch対象として必要な
# ため引き続き保持する、spec_measurement_edit.graphql参照)。

query SpecMeasurementRead(
  $first: Int!
  $offset: Int
  $condition: MstrSpecMeasurementCondition
  $orderBy: [MstrSpecMeasurementsOrderBy!] = [PRIMARY_KEY_ASC]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allMstrSpecMeasurements(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrSpecMeasurementId
      measurementValue
      remarks
      updateAt
      remove

      unit: sharedUnitBySharedUnitId {
        sharedUnitId
        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code
        sex
        phone
        symbol
        privatePhone
        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }
    }
  }
}
