# org_res_location画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #org_res_location / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/org_res_location/org_res_location_edit.graphql
#
# ⚠ #7: 実スキーマの型名は"MstrLocation"。
# ⚠ #8: 「組織id」は既存のinfo_departmentへの付け替え(スカラー)として扱う
#   (画面仕様が「組織id」であり「組織名」ではないため、組織自体の内容編集ではないと判断)。
# ⚠ #3: 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation OrgResLocationEdit(
  $mstrLocationId: UUID!
  $code: String
  $controlCode: String
  $infoDepartmentId: UUID
  $remarks: String
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String
  $nicknameEn: String
  $infoAddressId: UUID!
  $zipCode: String
  $address1: String
  $address2: String
  $bill: String
  $phone: String
  $faxNumber: String
) {
  updateMstrLocationByMstrLocationId(
    input: {
      mstrLocationId: $mstrLocationId
      mstrLocationPatch: {
        code: $code
        controlCode: $controlCode
        infoDepartmentId: $infoDepartmentId
        remarks: $remarks

        # --- 場所名 / 読み / 略称(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: { ja: $pronunciationJa, en: $pronunciationEn }
                }
              }
              sharedDictionaryToSharedDictionaryNicknameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nicknameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nicknameJa, en: $nicknameEn }
                }
              }
            }
          }
        }

        # --- 郵便番号 / 住所1~2 / 建物 / 電話番号 / FAX番号(info_address経由の入れ子更新) ---
        infoAddressToInfoAddressId: {
          updateByInfoAddressId: {
            infoAddressId: $infoAddressId
            infoAddressPatch: {
              zipCode: $zipCode
              address1: $address1
              address2: $address2
              bill: $bill
              phone: $phone
              faxNumber: $faxNumber
            }
          }
        }
      }
    }
  ) {
    mstrLocation {
      mstrLocationId
      code
      controlCode
      infoDepartmentId
      remarks
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja
          en
        }
      }
      infoAddressByInfoAddressId {
        infoAddressId
        zipCode
        address1
        address2
        bill
        phone
        faxNumber
      }
    }
  }
}
