# org_res_location画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #org_res_location / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/org_res_location/org_res_location_read.graphql
#
# ⚠ docs/0021_view_graphql_log.md #7: 実スキーマの型名は"MstrLocation"(場所マスタ)。
# ⚠ #8: 「組織名」はinfoDepartmentByInfoDepartmentId経由のsharedAppellationsで取得する
#   (組織自体の内容編集ではなく参照のみ。editでは組織idのスカラー付け替えとする)。

query OrgResLocationRead(
  $first: Int!
  $offset: Int
  $condition: MstrLocationCondition
  $orderBy: [MstrLocationsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
) {
  allMstrLocations(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrLocationId
      code
      controlCode

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 組織名(参照のみ) -------------------------------------------------------
      infoDepartmentByInfoDepartmentId {
        infoDepartmentId
        sharedAppellationBySharedAppellationsId {
          sharedDictionaryBySharedDictionaryNameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
        }
      }

      # --- 場所名 / 読み / 略称(共通名前仕様) -------------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # --- 郵便番号 / 住所1~2 / 建物 / 電話番号 / FAX番号 --------------------------
      # ⚠ docs/0021_view_graphql_log.md #1: address3相当の列は存在しないため取得不可。
      infoAddressByInfoAddressId {
        infoAddressId
        zipCode
        address1
        address2
        bill
        phone
        faxNumber
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ #2: 既知の制約により「OrgResLocationReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query OrgResLocationReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
