# equipment_inspection_peration_task画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #equipment_inspection_peration_task / read(見出し名はviews.md
#   原文どおり。"operation_task"の誤記と見られるが、既存の"info_postion"等と同様、見出し文字列
#   自体は書き換えずディレクトリ/ファイル名に使用している)
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/equipment_inspection_peration_task/equipment_inspection_peration_task_read.graphql
#
# ⚠ docs/0025_task_operation_inspection_evaluation_log.md 4-2節: 必須列"mstrInspectionId"
#   (点検整備id)がviews.mdに無かったため変換不可能なエラーとして記録した。views.md修正後は
#   read・editの両方に追加され、エラーは解消している。
# ⚠ 実スキーマの型名は"MstrInspectionOperationTask"(点検整備運用課題マスタ)。本テーブル自身は
#   shared_appellationsを持たない(自身の名前は無い)。「外部点検整備」「点検整備サービス品目」は
#   本テーブルの列ではなく、mstrInspectionId経由で親の"MstrInspection"が持つ列
#   (externalInspection / mstrItemId)を2階層先まで参照して表示する(views.md editでは
#   「(表示のための参照)」と明記され、本テーブルの編集対象ではない)。

query EquipmentInspectionPerationTaskRead(
  $first: Int!
  $offset: Int
  $condition: MstrInspectionOperationTaskCondition
  $orderBy: [MstrInspectionOperationTasksOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allMstrInspectionOperationTasks(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrInspectionOperationTaskId
      mstrInspectionOperationId
      sequence
      mstrInspectionId
      commencementDate
      timeInterval {
        seconds
        minutes
        hours
        days
        months
        years
      }

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 点検整備運用コード / 名 / 読み / 略称(点検整備運用マスタ参照) -----------
      mstrInspectionOperationByMstrInspectionOperationId {
        mstrInspectionOperationId
        code
        sharedAppellationBySharedAppellationsId {
          sharedDictionaryBySharedDictionaryNameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
        }
      }

      # --- 点検整備コード / 名 / 読み / 略称(点検整備マスタ自身、および⚠2階層先の参照) ---
      mstrInspectionByMstrInspectionId {
        mstrInspectionId
        code
        sharedAppellationBySharedAppellationsId {
          sharedDictionaryBySharedDictionaryNameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
        }

        # --- 外部点検整備id / 委託先コード / 名 / 読み / 略称(⚠2階層先、参照のみ) ---
        externalInspection
        mstrStakeholderByExternalInspection {
          mstrStakeholderId
          code
          sharedAppellationBySharedAppellationsId {
            sharedDictionaryBySharedDictionaryNameId {
              ja @include(if: $ja)
              en @include(if: $en)
            }
            sharedDictionaryBySharedDictionaryPronunciationId {
              ja @include(if: $ja)
              en @include(if: $en)
            }
            sharedDictionaryBySharedDictionaryNicknameId {
              ja @include(if: $ja)
              en @include(if: $en)
            }
          }
        }

        # --- 点検整備サービス品目id / サービスコード / 名 / 読み / 略称(⚠2階層先、参照のみ) ---
        mstrItemId
        mstrItemByMstrItemId {
          mstrItemId
          code
          sharedAppellationBySharedAppellationsId {
            sharedDictionaryBySharedDictionaryNameId {
              ja @include(if: $ja)
              en @include(if: $en)
            }
            sharedDictionaryBySharedDictionaryPronunciationId {
              ja @include(if: $ja)
              en @include(if: $en)
            }
            sharedDictionaryBySharedDictionaryNicknameId {
              ja @include(if: $ja)
              en @include(if: $en)
            }
          }
        }
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「EquipmentInspectionPerationTaskReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query EquipmentInspectionPerationTaskReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
