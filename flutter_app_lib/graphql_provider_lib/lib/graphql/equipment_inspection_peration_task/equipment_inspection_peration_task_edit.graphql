# equipment_inspection_peration_task画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #equipment_inspection_peration_task / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/equipment_inspection_peration_task/equipment_inspection_peration_task_edit.graphql
#
# ⚠ 実スキーマの型名は"MstrInspectionOperationTask"。
# ⚠ 「点検整備運用」「点検整備」はorg_res_equipmentの「場所名」等と同様、既存マスタへの付け替え
#   (スカラーIDのみ設定)として扱う。
# ⚠ 「外部点検整備(表示のための参照)」「点検整備サービス品目id(表示のための参照)」はviews.mdの
#   明記どおり、本テーブルの列ではなく親"MstrInspection"の列(2階層先)のため編集対象に含めず、
#   出力(表示専用)にのみ含める。
# ⚠ 「間隔」はミューテーション変数を`IntervalInput`とする(taskの標準時間と同じ注意点)。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation EquipmentInspectionPerationTaskEdit(
  $mstrInspectionOperationTaskId: UUID!
  $mstrInspectionOperationId: UUID
  $mstrInspectionId: UUID
  $sequence: Int
  $commencementDate: Datetime
  $timeInterval: IntervalInput
  $remarks: String
  $symbol: String
) {
  updateMstrInspectionOperationTaskByMstrInspectionOperationTaskId(
    input: {
      mstrInspectionOperationTaskId: $mstrInspectionOperationTaskId
      mstrInspectionOperationTaskPatch: {
        mstrInspectionOperationId: $mstrInspectionOperationId
        mstrInspectionId: $mstrInspectionId
        sequence: $sequence
        commencementDate: $commencementDate
        timeInterval: $timeInterval
        remarks: $remarks
        symbol: $symbol
      }
    }
  ) {
    mstrInspectionOperationTask {
      mstrInspectionOperationTaskId
      mstrInspectionOperationId
      mstrInspectionId
      sequence
      commencementDate
      timeInterval {
        seconds
        minutes
        hours
        days
        months
        years
      }
      remarks
      symbol

      # --- 外部点検整備 / 点検整備サービス品目(⚠表示のための参照。編集対象外) -----
      mstrInspectionByMstrInspectionId {
        mstrInspectionId
        externalInspection
        mstrItemId
      }
    }
  }
}
