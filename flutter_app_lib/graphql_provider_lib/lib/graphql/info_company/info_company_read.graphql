# info_company画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/view.yaml #CompanyPage(要件0033、schema.json準拠のYAML定義)
# 作成ルール: CLAUDE.md 要件0033(既存GraphQL・生成物を一度削除しての再生成テスト。
#   テストのため画面全体のうちinfo_companyのみ実装)
# 配置場所: lib/graphql/info_company/info_company_read.graphql
#
# ⚠ 要件0033で発見した問題(docs/0033_view_yaml_regeneration_test_log.md参照。
#   view.yamlの記述をそのまま反映せず、以下のとおり実スキーマに合わせて補正した):
#   1. view.yamlのCompanyPageは`ceo`を`using: ceo`でshared_appellations経由(呼称セット)として
#      定義しているが、実スキーマ(lib/graphql/schema.graphql)の`InfoCompany.ceo`は
#      単純な`String`スカラーであり、shared_appellationsへのFKではない。そのためプレーンな
#      文字列列としてそのまま取得する。
#   2. view.yamlのaddressFields(address1/address2/bill)も同様にshared_appellations経由
#      として定義しているが、実スキーマの`InfoAddress.address1`/`address2`/`bill`は
#      いずれも`String`スカラーであり、FKではない。プレーンな文字列列として取得する。
#   3. view.yamlの`requiredWhere: [code]`(shared_language_code.codeを直接GraphQL引数化する設計)
#      は、実スキーマの`SharedDictionaryValueCondition`/`Filter`が`sharedLanguageCodeId`(UUID)
#      でのフィルタのみ対応し、結合先テーブルの列(`shared_language_code.code`)への
#      フィルタを提供しないため、標準のPostGraphile条件/フィルタ引数としては実現できない。
#      既存のshipping_kind試作(要件0026追記9・docs/0033_shared_dictionary_language_redesign_log.md)
#      で採用した方式を踏襲し、`$jaLanguageCodeId`/`$enLanguageCodeId`(UUID、アプリケーション側で
#      事前に"code"から解決して渡す)を`condition: { sharedLanguageCodeId: ... }`に使う。

query InfoCompanyRead(
  $first: Int!
  $offset: Int
  $condition: InfoCompanyCondition
  $orderBy: [InfoCompaniesOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $jaLanguageCodeId: UUID
  $enLanguageCodeId: UUID
  $officesFirst: Int = 50
  $officesOffset: Int = 0
  $removed: Boolean = false
) {
  allInfoCompanies(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoCompanyId
      webPage

      # --- 代表(ceo): 実スキーマでは呼称セットではなく単純な文字列列 ---------------
      ceo

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 会社名(共通名前仕様: shared_appellations経由) ------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) @include(if: $ja) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) @include(if: $en) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) @include(if: $ja) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) @include(if: $en) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) @include(if: $ja) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) @include(if: $en) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      # --- 住所(実スキーマではプレーンな列。呼称セットではない) -------------------
      infoAddressByInfoAddressId {
        infoAddressId
        iso31663
        zipCode
        address1
        address2
        bill
        phone
        faxNumber
        remarks
        updateAt
        remove
      }

      # --- 事業所一覧(1対多、ページネーション対応) -------------------------------
      infoOfficesByInfoCompanyId(
        first: $officesFirst
        offset: $officesOffset
        filter: { remove: { equalTo: $removed } }
      ) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          infoOfficeId
          infoCompanyId
          code
          symbol
          remarks
          updateAt
          remove
          infoAddressId

          # --- 事業所名(view.yamlのpick: [name]に合わせ、名前のみ取得) -------------
          sharedAppellationBySharedAppellationsId {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              ja: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $jaLanguageCodeId }
              ) @include(if: $ja) {
                nodes {
                  dictionaryValue
                }
              }
              en: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $enLanguageCodeId }
              ) @include(if: $en) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }
        }
      }

      # --- 共通項: 更新者(共通名前仕様の呼称セットID解決に必要なidのみ) -------------
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}
