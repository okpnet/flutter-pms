# info_company画面 - Edit(ミューテーション)
#
# 画面仕様: source/view.yaml #CompanyPageEdit(要件0033、schema.json準拠のYAML定義)
# 作成ルール: CLAUDE.md 要件0033(既存GraphQL・生成物を一度削除しての再生成テスト。
#   テストのため画面全体のうちinfo_companyのみ実装)
#
# ⚠ 要件0033で発見した問題(docs/0033_view_yaml_regeneration_test_log.md参照。
#   info_company_read.graphqlの先頭コメントと同じ3点の補正を適用している):
#   1. `ceo`は実スキーマでは単純な`String`。shared_appellations経由の入れ子更新は行わない。
#   2. `infoAddressPatch`配下の`address1`/`address2`/`bill`は実スキーマでは単純な`String`。
#      shared_appellations経由の入れ子更新は行わない。
#   3. `$jaLanguageCodeId`/`$enLanguageCodeId`はアプリケーション側が別途
#      `SharedLanguageCode`を`code`で解決して渡す(shipping_kind試作と同じ方式)。
#      `dictionaryValue`は`String!`のため、翻訳が無い言語は呼び出し側で空文字列('')に
#      変換してから渡す想定(要件0026追記9・27_yaml_to_graphql_conversion_rules.md参照)。

mutation InfoCompanyEdit(
  $infoCompanyId: UUID!
  $webPage: String
  $ceo: String
  $symbol: String
  $remarks: String
  $sharedAppellationsId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String!
  $nameEn: String!
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String!
  $pronunciationEn: String!
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String!
  $nicknameEn: String!
  $infoAddressId: UUID!
  $iso31663: String
  $zipCode: String
  $address1: String
  $address2: String
  $bill: String
  $phone: String
  $faxNumber: String
) {
  updateInfoCompanyByInfoCompanyId(
    input: {
      infoCompanyId: $infoCompanyId
      infoCompanyPatch: {
        webPage: $webPage
        ceo: $ceo
        symbol: $symbol
        remarks: $remarks

        # --- 会社名(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $nameJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $nameEn }
                      ]
                    }
                  }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $pronunciationJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $pronunciationEn }
                      ]
                    }
                  }
                }
              }
              sharedDictionaryToSharedDictionaryNicknameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nicknameSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $nicknameJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $nicknameEn }
                      ]
                    }
                  }
                }
              }
            }
          }
        }

        # --- 住所(実スキーマではプレーンな列。shared_appellations経由の入れ子更新は無し) ---
        infoAddressToInfoAddressId: {
          updateByInfoAddressId: {
            infoAddressId: $infoAddressId
            infoAddressPatch: {
              iso31663: $iso31663
              zipCode: $zipCode
              address1: $address1
              address2: $address2
              bill: $bill
              phone: $phone
              faxNumber: $faxNumber
            }
          }
        }
      }
    }
  ) {
    infoCompany {
      infoCompanyId
      webPage
      ceo
      symbol
      remarks
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $jaLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
          en: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $enLanguageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }
      infoAddressByInfoAddressId {
        infoAddressId
        iso31663
        zipCode
        address1
        address2
        bill
        phone
        faxNumber
      }
    }
  }
}
