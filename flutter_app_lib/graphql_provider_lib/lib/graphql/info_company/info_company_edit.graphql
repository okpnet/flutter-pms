# info_company画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #info_company / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0019
# ファイル名: 要件0011・0017により「見出し2_見出し3」のスネークケース(info_company_edit)
# 配置場所: 要件0014の構成にあわせ lib/graphql/info_company/info_company_edit.graphql
# 作成前に確認した内容・問題点: docs/0019_view_graphql_log.md を参照(⚠コメントは同ログの番号に対応)
#
# 対象レコードのPK(infoCompanyId / sharedAppellationsId / sharedDictionaryId(名前・読み) /
# infoAddressId)は info_company_read.graphql の結果から得る(要件0018 edit「原則としてreadから
# 生成されたモデルのMapから変換できる」)。
#
# "Company"(要件0007・0010)のUpdateCompanyミューテーションと同じ入れ子更新パターン
# (postgraphile-plugin-nested-mutations)を使用するが、画面仕様の違いにより以下2点が異なる。
#   - 備考(remarks)をinfo_company本体のパッチに含める(Company画面のEditには無かった項目)。
#   - 住所の入れ子更新に建物(bill)・電話番号(phone)・FAX番号(faxNumber)を含める
#     (Company画面のEditはzipCode/address1/address2のみだった)。
#   - ⚠ docs/0019_view_graphql_log.md #1: info_addressにaddress3相当の列が無いため、
#     住所3行目は今回も更新できない(既知の制約、継続)。

mutation InfoCompanyEdit(
  $infoCompanyId: UUID!
  $webPage: String
  $ceo: String
  $remarks: String
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $infoAddressId: UUID!
  $zipCode: String
  $address1: String
  $address2: String
  $bill: String
  $phone: String
  $faxNumber: String
) {
  updateInfoCompanyByInfoCompanyId(
    input: {
      infoCompanyId: $infoCompanyId
      infoCompanyPatch: {
        webPage: $webPage
        ceo: $ceo

        # --- 備考(info_company) ---------------------------------------------------
        remarks: $remarks

        # --- 会社名 / 読み(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: { ja: $pronunciationJa, en: $pronunciationEn }
                }
              }
            }
          }
        }

        # --- 郵便番号 / 住所1~2 / 建物 / 電話番号 / FAX番号(info_address経由の入れ子更新) ---
        infoAddressToInfoAddressId: {
          updateByInfoAddressId: {
            infoAddressId: $infoAddressId
            infoAddressPatch: {
              zipCode: $zipCode
              address1: $address1
              address2: $address2
              bill: $bill
              phone: $phone
              faxNumber: $faxNumber
            }
          }
        }
      }
    }
  ) {
    infoCompany {
      infoCompanyId
      webPage
      ceo
      remarks
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja
          en
        }
      }
      infoAddressByInfoAddressId {
        infoAddressId
        zipCode
        address1
        address2
        bill
        phone
        faxNumber
      }
    }
  }
}
