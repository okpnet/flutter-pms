# Company画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #Company / Edit
# 作成ルール: CLAUDE.md 要件0006・0007・0008・0009・0010・0011・0014
# ファイル名: 要件0011により「見出し2_見出し3」のスネークケース(company_edit)に変更。
#   (旧: graphql/Company/Edit.graphql -> 新: graphql/Company/company_edit.graphql)
# 配置場所: 要件0014(0012Log案A採用)により、graphql_codegenの既定構成に合わせて
#   graphql/Company/company_edit.graphql -> lib/graphql/Company/company_edit.graphql へ移動。
# 作成前に見つかった問題点: docs/0007_view_graphql_log.md を参照(⚠コメントは同ログの番号に対応)
#
# 要件0009の調査(docs/0009_nested_mutation_investigation.md)時点では、会社名/読み
# (shared_dictionary)・住所(info_address)への外部キーが存在せず、
# postgraphile-plugin-nested-mutationsを導入していても1ミューテーションにまとめられなかった。
# 要件0010でschema.graphql(現: lib/graphql/schema.graphql)が更新され、該当する外部キーが追加されたことを確認したため、
# 本ファイルは以下1つのミューテーションに統合して作成し直した(旧: 4つのミューテーションに分割)。
#
# 対象レコードのPK(sharedAppellationsId / sharedDictionaryId(名前・読み) / infoAddressId)は
# company_read.graphqlの結果から得る。

mutation UpdateCompany(
  $infoCompanyId: UUID!
  $webPage: String
  $ceo: String
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $infoAddressId: UUID!
  $zipCode: String
  $address1: String
  $address2: String
) {
  updateInfoCompanyByInfoCompanyId(
    input: {
      infoCompanyId: $infoCompanyId
      infoCompanyPatch: {
        webPage: $webPage
        ceo: $ceo

        # --- 会社名 / 読み(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: { ja: $pronunciationJa, en: $pronunciationEn }
                }
              }
            }
          }
        }

        # --- 郵便番号 / 住所1~2(info_address経由の入れ子更新) -----------------------------
        # ⚠ ログ#5: info_addressにaddress3に相当する列が存在しないため、住所3行目は更新できない(継続)。
        infoAddressToInfoAddressId: {
          updateByInfoAddressId: {
            infoAddressId: $infoAddressId
            infoAddressPatch: {
              zipCode: $zipCode
              address1: $address1
              address2: $address2
            }
          }
        }
      }
    }
  ) {
    infoCompany {
      infoCompanyId
      webPage
      ceo
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja
          en
        }
      }
      infoAddressByInfoAddressId {
        infoAddressId
        zipCode
        address1
        address2
      }
    }
  }
}
