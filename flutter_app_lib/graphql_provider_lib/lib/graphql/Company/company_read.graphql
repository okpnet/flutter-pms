# Company画面 - Read(読み込み用クエリ)
#
# 画面仕様: source/views.md #Company / Read
# 作成ルール: CLAUDE.md 要件0006・0007・0008・0009・0010・0011・0014
# ファイル名: 要件0011により「見出し2_見出し3」のスネークケース(company_read)に変更。
#   (旧: graphql/Company/Read.graphql -> 新: graphql/Company/company_read.graphql)
# 配置場所: 要件0014(0012Log案A採用)により、graphql_codegenの既定構成に合わせて
#   graphql/Company/company_read.graphql -> lib/graphql/Company/company_read.graphql へ移動。
# 作成前に見つかった問題点: docs/0007_view_graphql_log.md を参照(⚠コメントは同ログの番号に対応)
#
# 要件0010によりschema.graphql(現: lib/graphql/schema.graphql)が更新され、旧版(要件0008再検証時点)で分割していた
# 外部キー未定義の箇所のうち、以下が解消されたことを確認した(詳細はdocs/0007_view_graphql_log.md
# の追記を参照)。
#   - ログ#1/#6: shared_appellations.shared_dictionary_name_id/pronunciation_id -> shared_dictionary
#   - ログ#3: info_company.info_address_id -> info_address
#   - ログ#4: info_office/info_staff.info_company_id -> info_company (逆参照)
# そのため、これらは1つのクエリにネストして取得できるようになった。
#
# 一方、ログ#2(history_info_staff.shared_appellations_id -> shared_appellationsの外部キー)は
# 要件0010時点でも未解消のため、共通項「更新者名」の呼称セット以降は引き続き別クエリで解決する。

# --- 1. 会社本体(名称・読み・プロフィール・住所・共通項) -----------------------------
query CompanyRead($infoCompanyId: UUID!) {
  infoCompanyByInfoCompanyId(infoCompanyId: $infoCompanyId) {
    infoCompanyId

    # --- ホームページ / 代表 -------------------------------------------------
    webPage
    ceo

    # --- 共通項: remarks / update_at / remove ---------------------------------
    remarks
    updateAt
    remove

    # --- 会社名 / 読み(共通名前仕様) ------------------------------------------
    sharedAppellationBySharedAppellationsId {
      sharedAppellationsId
      sharedDictionaryBySharedDictionaryNameId {
        sharedDictionaryId
        ja
        en
      }
      sharedDictionaryBySharedDictionaryPronunciationId {
        sharedDictionaryId
        ja
        en
      }
    }

    # --- 郵便番号 / 住所1~3 ---------------------------------------------------
    # ⚠ ログ#5: info_addressにaddress3に相当する列が存在しないため、住所3行目は取得不可(継続)。
    infoAddressByInfoAddressId {
      infoAddressId
      zipCode
      address1
      address2
    }

    # --- 所属するスタッフ数 ---------------------------------------------------
    infoStaffsByInfoCompanyId {
      totalCount
    }

    # --- 事業所のリスト -------------------------------------------------------
    infoOfficesByInfoCompanyId {
      nodes {
        infoOfficeId
        sharedAppellationBySharedAppellationsId {
          sharedDictionaryBySharedDictionaryNameId {
            ja
            en
          }
        }
      }
    }

    # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
    # ⚠ ログ#2: history_info_staff.shared_appellations_id -> shared_appellations の
    #    外部キーが要件0010時点でも未定義のため、続きは「2. 更新者の呼称」を別クエリで呼び出す。
    historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
      historyId
      infoStaffId
      sharedAppellationsId
    }
  }
}

# --- 2. 更新者の呼称(shared_appellations)・名前解決 ------------------------------
# 「1. 会社本体」の historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId.sharedAppellationsId を渡す。
query CompanyReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
