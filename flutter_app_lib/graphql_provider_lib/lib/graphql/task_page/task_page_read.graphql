# task_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/views/ #TaskPage
# このファイルはtool/view_graphql(build_runner)が生成した。直接編集しない。

query TaskPageRead(
  $first: Int!
  $offset: Int
  $filter: MstrTaskFilter = {}
  $orderBy: [MstrTasksOrderBy!]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allMstrTasks(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrTaskId

      parent: mstrTaskTreesByMstrTaskId(first: 1) {
        nodes {
          mstrTaskTreeId
          parentMstrTaskId
        }
      }

      descendants: vTaskDescendantByAncestorMstrTaskId {
        ancestorMstrTaskId
      }

      groups: mstrTaskGroupByMstrTaskGroupId {
        mstrTaskGroupId
        code

        labels: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }

          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }

        details
        symbol
        remarks
        updateAt
        remove

        update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
          historyId
          infoStaffId
          infoCompanyId
          code

          name: sharedAppellationByNames {
            sharedAppellationsId
            sharedDictionaryBySharedDictionaryNameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }

            sharedDictionaryBySharedDictionaryPronunciationId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }

            sharedDictionaryBySharedDictionaryNicknameId {
              sharedDictionaryId
              value: sharedDictionaryValuesBySharedDictionaryId(
                condition: { sharedLanguageCodeId: $languageCodeId }
              ) {
                nodes {
                  dictionaryValue
                }
              }
            }
          }

          sex
          phone
          symbol
          privatePhone
        }
      }

      code

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }

        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      detailTexts: sharedTextByDetails {
        sharedTextId
        value: sharedTextValuesBySharedTextId(
          condition: { sharedLanguageCodeId: $languageCodeId }
        ) {
          nodes {
            charCount
            leadText
          }
        }
      }

      class
      defaultTime {
        seconds
        minutes
        hours
        days
        months
        years
      }
      symbol
      remarks
      updateAt
      remove

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code

        name: sharedAppellationByNames {
          sharedAppellationsId
