# staff_to_capability_page画面 - Read(一覧取得クエリ、担当者→力量)
#
# 画面仕様: source/view.yaml #StaffToCapabilityPage(info_staff起点、mstr_staff_capability
# 経由でmstr_capabilityへ)。読み込み専用画面(kind: read)のみで、Edit/RFEは無い。
#
# staff自身の列はstaff_page_read.graphqlと同型(住所無し)。capabilitys配下の
# capability(mstr_capability)はcapability_page_read.graphqlのnodesと同型。

query StaffToCapabilityPageRead(
  $first: Int!
  $offset: Int
  $condition: InfoStaffCondition
  $orderBy: [InfoStaffsOrderBy!] = [PRIMARY_KEY_ASC]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allInfoStaffs(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoStaffId
      infoCompanyId
      code
      sex
      phone
      privatePhone
      symbol
      remarks
      updateAt
      remove

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      capabilitys: mstrStaffCapabilitiesByInfoStaffId {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          mstrStaffCapabilityId
          infoStaffId
          value
          stop

          capability: mstrCapabilityByMstrCapabilityId {
            mstrCapabilityId
            code
            detail
            referenceValue
            max
            min
            step
            symbol
            remarks
            updateAt
            remove

            labels: sharedAppellationByNames {
              sharedAppellationsId
              sharedDictionaryBySharedDictionaryNameId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }
              sharedDictionaryBySharedDictionaryPronunciationId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }
              sharedDictionaryBySharedDictionaryNicknameId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }
            }

            update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
              historyId
              infoStaffId
              infoCompanyId
              code
              sex
              phone
              symbol
              privatePhone
              name: sharedAppellationByNames {
                sharedAppellationsId
                sharedDictionaryBySharedDictionaryNameId {
                  sharedDictionaryId
                  value: sharedDictionaryValuesBySharedDictionaryId(
                    condition: { sharedLanguageCodeId: $languageCodeId }
                  ) {
                    nodes {
                      dictionaryValue
                    }
                  }
                }
                sharedDictionaryBySharedDictionaryPronunciationId {
                  sharedDictionaryId
                  value: sharedDictionaryValuesBySharedDictionaryId(
                    condition: { sharedLanguageCodeId: $languageCodeId }
                  ) {
                    nodes {
                      dictionaryValue
                    }
                  }
                }
                sharedDictionaryBySharedDictionaryNicknameId {
                  sharedDictionaryId
                  value: sharedDictionaryValuesBySharedDictionaryId(
                    condition: { sharedLanguageCodeId: $languageCodeId }
                  ) {
                    nodes {
                      dictionaryValue
                    }
                  }
                }
              }
            }
          }
        }
      }

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code
        sex
        phone
        symbol
        privatePhone
        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }
    }
  }
}
