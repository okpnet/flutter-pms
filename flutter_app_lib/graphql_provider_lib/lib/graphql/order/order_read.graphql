# order画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #order / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/order/order_read.graphql
#
# ⚠ 実スキーマの型名は"TransOrder"(受注)。
# ⚠ 要件0030評価: 「顧客」「顧客窓口」はライブの`mstr_stakeholder`/`mstr_stakeholder_contact`への
#   直接参照が無く、履歴テーブル(historyMstrStakeholderByCustomerHistoryIdAndMstrStakholderId /
#   historyMstrStakeholderContactByContactHistoryIdAndMstrStakeholderConcatId)経由の複合キー
#   (履歴id + 本体id)でのみ解決できる。views.mdに合わせ両方のidを出力する。
# ⚠ HistoryMstrStakeholder / HistoryMstrStakeholderContactには呼称セット(SharedAppellation)への
#   直接参照フィールドが無く、sharedAppellationsId等のスカラー列のみ保持するため、
#   「OrderReadAppellation」を別クエリで呼び出して解決する(更新者名解決と同じ手法)。

query OrderRead(
  $first: Int!
  $offset: Int
  $condition: TransOrderCondition
  $orderBy: [TransOrdersOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allTransOrders(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transOrderId
      orderNumber
      customerOrderNumber
      controlCode1
      controlCode2
      controlCode3
      orderProcessingDate
      deliveryDate
      deadline

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 顧客履歴id / 顧客id / 顧客コード(利害関係者履歴マスタ、⚠参照) ----------------
      # 顧客名/読み/略称は sharedAppellationsId を「OrderReadAppellation」で解決する。
      customerHistoryId
      mstrStakholderId
      historyMstrStakeholderByCustomerHistoryIdAndMstrStakholderId {
        historyId
        code
        sharedAppellationsId
      }

      # --- 顧客窓口履歴id / 顧客窓口id / 顧客担当者コード(利害関係者窓口履歴マスタ、⚠参照) ---
      # 事業所名/部署名/担当者名はそれぞれのAppellationsIdを「OrderReadAppellation」で解決する。
      contactHistoryId
      mstrStakeholderConcatId
      historyMstrStakeholderContactByContactHistoryIdAndMstrStakeholderConcatId {
        historyId
        code
        officeAppellationsId
        departmentAppellationsId
        contactPersonAppellationsId
      }

      # --- 受注品目数 -------------------------------------------------------------
      transOrderDetailsByTransOrderId {
        totalCount
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「OrderReadAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 呼称(shared_appellations)の名前解決 -----------------------------------------
# 更新者名 / 顧客名 / 事業所名 / 部署名 / 担当者名のいずれも、対応する sharedAppellationsId を
# 渡してこのクエリを呼び出す(HistoryMstrStakeholder / HistoryMstrStakeholderContactには
# 呼称セットへの直接参照フィールドが無いため)。
query OrderReadAppellation($sharedAppellationsId: UUID!, $ja: Boolean!, $en: Boolean!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
    sharedDictionaryBySharedDictionaryNicknameId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
  }
}
