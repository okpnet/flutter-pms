# order画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #order / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/order/order_edit.graphql
#
# ⚠ 実スキーマの型名は"TransOrder"。
# ⚠ 「顧客」「顧客窓口」はスカラーID(履歴id・本体idの組)のみ設定(既存の履歴スナップショット行への
#   付け替え)。要件0030「提案への指示」のとおり、新規受注登録時に履歴スナップショット行を
#   都度新規作成するかどうかは未採択のため、本ミューテーションでは既存スナップショットの選択のみに
#   対応する(将来、履歴行の新規作成が必要になった場合は別途ネスト入力を追加する)。
# ⚠ 「受注明細」は1対多のため、追加/削除を含む配列の入れ子ミューテーションは本バージョンでは
#   未対応(oepration_editerと同じ方針)。読み取り専用として出力にのみ件数を含め、明細自体の
#   編集はorder_detail画面の専用ミューテーションで行う。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation OrderEdit(
  $transOrderId: UUID!
  $orderNumber: String
  $customerOrderNumber: String
  $customerHistoryId: UUID
  $mstrStakholderId: UUID
  $contactHistoryId: UUID
  $mstrStakeholderConcatId: UUID
  $controlCode1: String
  $controlCode2: String
  $controlCode3: String
  $orderProcessingDate: Datetime
  $deliveryDate: Datetime
  $deadline: Datetime
  $remarks: String
  $symbol: String
) {
  updateTransOrderByTransOrderId(
    input: {
      transOrderId: $transOrderId
      transOrderPatch: {
        orderNumber: $orderNumber
        customerOrderNumber: $customerOrderNumber
        customerHistoryId: $customerHistoryId
        mstrStakholderId: $mstrStakholderId
        contactHistoryId: $contactHistoryId
        mstrStakeholderConcatId: $mstrStakeholderConcatId
        controlCode1: $controlCode1
        controlCode2: $controlCode2
        controlCode3: $controlCode3
        orderProcessingDate: $orderProcessingDate
        deliveryDate: $deliveryDate
        deadline: $deadline
        remarks: $remarks
        symbol: $symbol
      }
    }
  ) {
    transOrder {
      transOrderId
      orderNumber
      customerOrderNumber
      customerHistoryId
      mstrStakholderId
      contactHistoryId
      mstrStakeholderConcatId
      controlCode1
      controlCode2
      controlCode3
      orderProcessingDate
      deliveryDate
      deadline
      remarks
      symbol

      # --- 受注明細(読み取り専用。編集はorder_detail画面で対応) ---------------------
      transOrderDetailsByTransOrderId {
        nodes {
          transOrderDetailId
          historyMstrItemId
          mstrItemId
          quantity
          cost
        }
      }
    }
  }
}
