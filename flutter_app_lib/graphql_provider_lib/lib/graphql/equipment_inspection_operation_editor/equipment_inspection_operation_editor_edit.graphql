# equipment_inspection_operation_editor画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #equipment_inspection_operation_editor / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/equipment_inspection_operation_editor/equipment_inspection_operation_editor_edit.graphql
#
# ⚠ 実スキーマの型名は"MstrInspectionOperation"。
# ⚠ 「設備」はorg_res_equipmentの「場所名」等と同様、既存マスタへの付け替え(スカラーIDのみ
#   設定)として扱う(要件0025評価: モレ修正で追加)。
# ⚠ 「点検項目」は1対多のため、追加/削除を含む配列の入れ子ミューテーションは本バージョンでは
#   未対応。読み取り専用として出力にのみ含める。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。
# ⚠ 要件0027・0028により、本画面の"### read"はviews.mdから削除された(編集専用画面のため、
#   編集前の1件読み込みはRFE(read for editing)のデフォルト規則(editと同じ内容をidキーで
#   1件取得、配列列を除く)に委ねる。専用の"_rfe.graphql"は本セッションでは未作成)。

mutation EquipmentInspectionOperationEditorEdit(
  $mstrInspectionOperationId: UUID!
  $code: String
  $mstrEquipmentId: UUID
  $remarks: String
  $symbol: String
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String
  $nicknameEn: String
) {
  updateMstrInspectionOperationByMstrInspectionOperationId(
    input: {
      mstrInspectionOperationId: $mstrInspectionOperationId
      mstrInspectionOperationPatch: {
        code: $code
        mstrEquipmentId: $mstrEquipmentId
        remarks: $remarks
        symbol: $symbol

        # --- 点検運用名 / 読み / 略称(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: { ja: $pronunciationJa, en: $pronunciationEn }
                }
              }
              sharedDictionaryToSharedDictionaryNicknameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nicknameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nicknameJa, en: $nicknameEn }
                }
              }
            }
          }
        }
      }
    }
  ) {
    mstrInspectionOperation {
      mstrInspectionOperationId
      code
      mstrEquipmentId
      remarks
      symbol

      # --- 点検項目(読み取り専用。編集は別ミューテーションで対応、⚠参照) -------------
      mstrInspectionOperationTasksByMstrInspectionOperationId {
        nodes {
          mstrInspectionOperationTaskId
          mstrInspectionId
          sequence
        }
      }

      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja
          en
        }
      }
    }
  }
}
