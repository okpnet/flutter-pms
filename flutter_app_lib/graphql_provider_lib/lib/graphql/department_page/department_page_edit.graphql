# department_page画面 - Edit(ミューテーション)
#
# 画面仕様: source/view.yaml #DepartmentPageEdit。要件0045で追加。
#
# 要件0045レビュー:
# 1. view.yamlのDepartmentPageEditは`from`が未指定だったため`info_department`を追記した
#    (他のEditノードとの一貫性、requiredWhereのinfo_department_idから判断)。
# 2. `kinds`(info_department_kind)はinfo_department_idに一意制約(Ix1)を持つ1対1で
#    あり(schema.graphql確認)、旧arrayType: toManyは誤り。toFirstOneに修正した。
#    (このため`kinds`自体はupdateByInfoDepartmentId(単数)で更新でき、ネストした
#    `value`(info_department_kind_value、真のtoMany)だけがリスト変数になる。)
# 3. `parent`(info_department_tree、using: info_department_id)は実スキーマ上は
#    真のtoMany(一意制約なし、要件0027コメント「自組織の1行のみ」はREAD側で
#    first:1により実現)。Edit側は「親を付け替える」操作として
#    deleteOthers:true + create:[{parentInfoDepartmentId: ...}]で表現する
#    (NULLは組織テーブルのトップノードを表す、view.yamlコメントどおり)。
# 4. `office`はkind:editでOffice自身のフィールドを直接編集する(id割り当てのみの
#    StaffCapabilityEditパターンとは異なる)。office_page_edit.graphqlと同型の
#    ネスト(infoOfficeToInfoOfficeId.updateByInfoOfficeId)。
# 5. `kinds.value`(info_department_kind_value、真のtoMany)はcompany_page_edit.graphqlの
#    provisionsと同じ方針で、Postgraphileの入れ子書き込み型をそのままリスト変数として
#    公開する($kindsValueUpdate/$kindsValueCreate/$kindsValueDelete)。
# 6. 既存のDepartmentCategoryEdit/CompanyPageEdit等の生成物にあわせ、view.yamlの
#    columnsに含まれるupdate_user_id/update_user_history_id/removeは監査列のため
#    このミューテーションの変数・Patch・出力には含めない(office自身のものも含む)。

