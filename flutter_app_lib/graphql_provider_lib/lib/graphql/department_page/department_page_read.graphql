#
# `kinds`(info_department_kind)の`value`は要件0035再評価時点の実スキーマでは
# info_department_kind_value_idの単一FKだったためtoFirstOneに修正したが、要件0026
# (2026/09/27、追記13)でFKが逆転し、info_department_kind_value側がinfo_department_kind_id
# を持つ設計(1つのinfo_department_kindに複数のinfo_department_kind_value)に変わった
# ため、再度toMany(infoDepartmentKindValuesByInfoDepartmentKindId)へ修正した
# (docs/0026_schema_fetch_log.md追記13参照)。
#
# 要件0045レビュー: `kinds`自体(info_department_kind、using: info_department_id)は
# info_department_idに一意制約(Ix1)を持つ1対1であり、旧`arrayType: toMany`は誤りと
# 判明した。生成されるGraphQLフィールドも旧`infoDepartmentKindsByInfoDepartmentId`は
# `@deprecated(reason: "Please use infoDepartmentKindByInfoDepartmentId instead")`
# だったため、単数の`infoDepartmentKindByInfoDepartmentId`に修正した
# (view.yamlの`kinds.arrayType`もtoFirstOneへ修正済み)。

query DepartmentPageRead(
  $first: Int!
  $offset: Int
  $filter: InfoDepartmentFilter = {}
  $orderBy: [InfoDepartmentsOrderBy!] = [PRIMARY_KEY_ASC]
  $languageCodeId: UUID!
  $removed: Boolean = false
