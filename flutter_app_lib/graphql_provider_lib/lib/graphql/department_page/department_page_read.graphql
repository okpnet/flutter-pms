  allInfoDepartments(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoDepartmentId
      infoCompanyId
      infoOfficeId
      code
      symbol
      remarks
      updateAt
      remove

      # --- 親組織(info_department_tree経由、自組織の1行のみ) ---------------------
      parent: infoDepartmentTreesByInfoDepartmentId(first: 1) {
        nodes {
          infoDepartmentTreeId
          parentInfoDepartmentId
        }
      }

      # --- 組織名(共通名前仕様: shared_appellations経由) --------------------------
      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
