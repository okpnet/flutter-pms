# 命名規則: CLAUDE.md 画面仕様命名規則(要件0033)により`department_page`をファイル名にする。
#
# `office`はOfficePage共有アームをそのまま入れ子で取得する(office_page_read.graphqlと同型)。
#
# `kinds`(toMany、info_department_kind)の`value`は要件0035再評価時点の実スキーマでは
# info_department_kind_value_idの単一FKだったためtoFirstOneに修正したが、要件0026
# (2026/09/27、追記13)でFKが逆転し、info_department_kind_value側がinfo_department_kind_id
# を持つ設計(1つのinfo_department_kindに複数のinfo_department_kind_value)に変わった
# ため、再度toMany(infoDepartmentKindValuesByInfoDepartmentKindId)へ修正した
# (docs/0026_schema_fetch_log.md追記13参照)。

query DepartmentPageRead(
  $first: Int!
  $offset: Int
  $condition: InfoDepartmentCondition
  $orderBy: [InfoDepartmentsOrderBy!] = [PRIMARY_KEY_ASC]
  $languageCodeId: UUID!
  $removed: Boolean = false
