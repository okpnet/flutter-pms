  allInfoDepartments(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoDepartmentId
      infoCompanyId
      infoOfficeId
      code
      symbol
      remarks
      updateAt
      remove

