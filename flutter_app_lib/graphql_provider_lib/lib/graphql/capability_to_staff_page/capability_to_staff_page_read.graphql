# capability_to_staff_page画面 - Read(一覧取得クエリ、力量→担当者)
#
# 画面仕様: source/view.yaml #CapabilityToStaffPage(mstr_capability起点、
# mstr_staff_capability経由でinfo_staffへ)。読み込み専用画面(kind: read)のみで、
# Edit/RFEは無い。
#
# staff_capability.staffはinfo_staff_id(mstr_staff_capability自身が持つFK、外向きの
# 関係)であるため、要件0027変換ルール6-1節により実際のGraphQLは単数フィールド
# (infoStaffByInfoStaffId)になる(view.yamlの`arrayType: toMany`は誤りと判断し
# `toFirstOne`に修正済み。詳細はdocs/0044ログ参照)。

query CapabilityToStaffPageRead(
  $first: Int!
  $offset: Int
  $condition: MstrCapabilityCondition
  $orderBy: [MstrCapabilitiesOrderBy!] = [PRIMARY_KEY_ASC]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allMstrCapabilities(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrCapabilityId
      code
      detail
      referenceValue
      max
      min
      step
      symbol
      remarks
      updateAt
      remove

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      staff_capability: mstrStaffCapabilitiesByMstrCapabilityId {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          mstrStaffCapabilityId
          infoStaffId
          mstrCapabilityId
          value
          stop

          staff: infoStaffByInfoStaffId {
            infoStaffId
            infoCompanyId
            code
            sex
            phone
            privatePhone
            symbol
            remarks
            updateAt
            remove

            labels: sharedAppellationByNames {
              sharedAppellationsId
              sharedDictionaryBySharedDictionaryNameId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }
              sharedDictionaryBySharedDictionaryPronunciationId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }
              sharedDictionaryBySharedDictionaryNicknameId {
                sharedDictionaryId
                value: sharedDictionaryValuesBySharedDictionaryId(
                  condition: { sharedLanguageCodeId: $languageCodeId }
                ) {
                  nodes {
                    dictionaryValue
                  }
                }
              }
            }

            update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
              historyId
              infoStaffId
              infoCompanyId
              code
              sex
              phone
              symbol
              privatePhone
              name: sharedAppellationByNames {
                sharedAppellationsId
                sharedDictionaryBySharedDictionaryNameId {
                  sharedDictionaryId
                  value: sharedDictionaryValuesBySharedDictionaryId(
                    condition: { sharedLanguageCodeId: $languageCodeId }
                  ) {
                    nodes {
                      dictionaryValue
                    }
                  }
                }
                sharedDictionaryBySharedDictionaryPronunciationId {
                  sharedDictionaryId
                  value: sharedDictionaryValuesBySharedDictionaryId(
                    condition: { sharedLanguageCodeId: $languageCodeId }
                  ) {
                    nodes {
                      dictionaryValue
                    }
                  }
                }
                sharedDictionaryBySharedDictionaryNicknameId {
                  sharedDictionaryId
                  value: sharedDictionaryValuesBySharedDictionaryId(
                    condition: { sharedLanguageCodeId: $languageCodeId }
                  ) {
                    nodes {
                      dictionaryValue
                    }
                  }
                }
              }
            }
          }
        }
      }

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code
        sex
        phone
        symbol
        privatePhone
        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }
    }
  }
}
