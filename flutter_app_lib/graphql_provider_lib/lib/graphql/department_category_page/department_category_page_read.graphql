# department_category_page画面 - Read(一覧取得クエリ)
#
# 画面仕様: source/view.yaml #DepartmentCategoryPage(組織区分、info_department_kind_value)
# 命名規則: 要件0050により、ディレクトリ・ファイル名は`snake(DepartmentCategoryPage)`=`department_category_page`。
#
# 言語解決はcompany_page_read.graphqlと同じ方式(要件0036、$languageCodeId: UUID!)。

query DepartmentCategoryPageRead(
  $first: Int!
  $offset: Int
  $filter: InfoDepartmentKindValueFilter = {}
  $orderBy: [InfoDepartmentKindValuesOrderBy!] = [PRIMARY_KEY_ASC]
  $languageCodeId: UUID!
  $removed: Boolean = false
) {
  allInfoDepartmentKindValues(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: { and: [{ remove: { equalTo: $removed } }, $filter] }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoDepartmentKindValueId
      symbol
      remarks
      updateAt
      remove

      labels: sharedAppellationByNames {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          value: sharedDictionaryValuesBySharedDictionaryId(
            condition: { sharedLanguageCodeId: $languageCodeId }
          ) {
            nodes {
              dictionaryValue
            }
          }
        }
      }

      update_user: historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        infoCompanyId
        code
        sex
        phone
        symbol
        privatePhone
        name: sharedAppellationByNames {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            value: sharedDictionaryValuesBySharedDictionaryId(
              condition: { sharedLanguageCodeId: $languageCodeId }
            ) {
              nodes {
                dictionaryValue
              }
            }
          }
        }
      }
    }
  }
}
