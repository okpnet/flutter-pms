# purchase画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #purchase / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/purchase/purchase_read.graphql
#
# ⚠ 実スキーマの型名は"TransPurchase"(発注)。
# ⚠ 「発注先」「発注先窓口」は履歴テーブル(historyMstrStakeholderBySupplierHistoryIdAndMstrStakeholderId /
#   historyMstrStakeholderContactByContactHistoryIdAndMstrStakeholderContactId)経由の複合キー。
# ⚠ 実スキーマには"purchaseCtrl1/2/3"(管理コード1〜3)列も存在するが、views.mdのpurchase読み込み
#   項目には含まれていないため取得していない(purchase_detailと異なりpurchase自体には管理コードの
#   記述が無い)。

query PurchaseRead(
  $first: Int!
  $offset: Int
  $condition: TransPurchaseCondition
  $orderBy: [TransPurchasesOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allTransPurchases(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPurchaseId
      supplierHistoryId
      mstrStakeholderId
      registerAt
      purchaseOrderDate
      deadline

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 発注先名(利害関係者履歴マスタ、⚠参照) --------------------------------------
      # 発注先名/読み/略称は sharedAppellationsId を「PurchaseReadAppellation」で解決する。
      historyMstrStakeholderBySupplierHistoryIdAndMstrStakeholderId {
        historyId
        sharedAppellationsId
      }

      # --- 発注先窓口履歴id / 発注先窓口id(⚠参照) ------------------------------------
      # 発注先担当者名/読み/略称は contactPersonAppellationsId を「PurchaseReadAppellation」で解決する。
      contactHistoryId
      mstrStakeholderContactId
      historyMstrStakeholderContactByContactHistoryIdAndMstrStakeholderContactId {
        historyId
        contactPersonAppellationsId
      }

      # --- 発注アイテム数 -----------------------------------------------------------
      transPurchaseDetailsByTransPurchaseId {
        totalCount
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「PurchaseReadAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 呼称(shared_appellations)の名前解決 -----------------------------------------
# 更新者名 / 発注先名 / 発注先担当者名のいずれも、対応する sharedAppellationsId を渡して
# このクエリを呼び出す。
query PurchaseReadAppellation($sharedAppellationsId: UUID!, $ja: Boolean!, $en: Boolean!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
    sharedDictionaryBySharedDictionaryNicknameId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
  }
}
