# purchase画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #purchase / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/purchase/purchase_edit.graphql
#
# ⚠ 実スキーマの型名は"TransPurchase"。
# ⚠ 「発注先」「発注先担当者」はスカラーID(履歴id・本体idの組)のみ設定(orderと同じ方針)。
# ⚠ 「発注明細」は1対多のため、配列の入れ子ミューテーションは本バージョンでは未対応。
#   読み取り専用として出力にのみ含める(明細自体はpurchase_detail画面で編集する)。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation PurchaseEdit(
  $transPurchaseId: UUID!
  $supplierHistoryId: UUID
  $mstrStakeholderId: UUID
  $contactHistoryId: UUID
  $mstrStakeholderContactId: UUID
  $registerAt: Datetime
  $purchaseOrderDate: Datetime
  $deadline: Datetime
  $remarks: String
  $symbol: String
) {
  updateTransPurchaseByTransPurchaseId(
    input: {
      transPurchaseId: $transPurchaseId
      transPurchasePatch: {
        supplierHistoryId: $supplierHistoryId
        mstrStakeholderId: $mstrStakeholderId
        contactHistoryId: $contactHistoryId
        mstrStakeholderContactId: $mstrStakeholderContactId
        registerAt: $registerAt
        purchaseOrderDate: $purchaseOrderDate
        deadline: $deadline
        remarks: $remarks
        symbol: $symbol
      }
    }
  ) {
    transPurchase {
      transPurchaseId
      supplierHistoryId
      mstrStakeholderId
      contactHistoryId
      mstrStakeholderContactId
      registerAt
      purchaseOrderDate
      deadline
      remarks
      symbol

      # --- 発注明細(読み取り専用。編集はpurchase_detail画面で対応) -------------------
      transPurchaseDetailsByTransPurchaseId {
        nodes {
          transPurchaseDetailId
          historyId
          mstrItemId
          quantity
        }
      }
    }
  }
}
