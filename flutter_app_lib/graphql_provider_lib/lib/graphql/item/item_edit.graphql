# item画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #item / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/item/item_edit.graphql
#
# ⚠ 実スキーマの型名は"MstrItem"。
# ⚠ 「製造元」「単位」はorg_res_equipmentの「場所名」「設備分類名」と同様、既存マスタへの付け替え
#   (スカラーIDのみ設定、名称自体は編集しない)として扱う。「品目種類id」も同様にスカラーID。
# ⚠ 「品目提供」は1対多(postgraphile-plugin-nested-mutationsの
#   mstrItemProvisionsUsingMstrItemId: MstrItemProvisionFk2InverseInput)だが、追加/削除を含む
#   配列の入れ子ミューテーションは本バージョンでは未対応。読み取り専用として出力にのみ含め、
#   編集(追加・更新・削除)は別ミューテーションで対応する方針とする(docs/0025評価ログ8-3節参照)。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation ItemEdit(
  $mstrItemId: UUID!
  $mstrItemKindId: UUID
  $code: String
  $identification: String
  $controlCode: String
  $mstrManufacturerId: UUID
  $labelCode: String
  $description: String
  $lot: Boolean
  $stockQuantity: BigFloat
  $sharedUnitId: UUID
  $remarks: String
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String
  $nicknameEn: String
) {
  updateMstrItemByMstrItemId(
    input: {
      mstrItemId: $mstrItemId
      mstrItemPatch: {
        mstrItemKindId: $mstrItemKindId
        code: $code
        identification: $identification
        controlCode: $controlCode
        mstrManufacturerId: $mstrManufacturerId
        labelCode: $labelCode
        description: $description
        lot: $lot
        stockQuantity: $stockQuantity
        sharedUnitId: $sharedUnitId
        remarks: $remarks

        # --- 品目名 / 読み / 略称(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: { ja: $pronunciationJa, en: $pronunciationEn }
                }
              }
              sharedDictionaryToSharedDictionaryNicknameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nicknameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nicknameJa, en: $nicknameEn }
                }
              }
            }
          }
        }
      }
    }
  ) {
    mstrItem {
      mstrItemId
      mstrItemKindId
      code
      identification
      controlCode
      mstrManufacturerId
      labelCode
      description
      lot
      stockQuantity
      sharedUnitId
      remarks

      # --- 品目提供(読み取り専用。編集は別ミューテーションで対応、⚠参照) -------------
      mstrItemProvisionsByMstrItemId {
        nodes {
          mstrItemProvisionId
          infoProvisionId
        }
      }

      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja
          en
        }
      }
    }
  }
}
