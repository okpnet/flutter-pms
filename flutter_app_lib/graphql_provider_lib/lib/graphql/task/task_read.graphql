# task画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #task / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/task/task_read.graphql
#
# ⚠ 実スキーマの型名は"MstrTask"(工程マスタ)。
# ⚠ 「親id」「子の数」は"MstrTaskTree"(工程体系マスタ)経由。1タスクにつき「自分が対象」の
#   ツリー行は1件のみ存在する前提とし(org_res_location等と同じ、場所/組織体系マスタと同様の設計)、
#   `mstrTaskTreesByMstrTaskId(first: 1)`の先頭ノードから親IDを取得する。子の数は
#   `mstrTaskTreesByParentMstrTaskId`のtotalCountで取得する(要件0025評価: 先行実装の
#   org_res_location/info_departmentではこの「子の数」相当が未実装のままだったため、今回は
#   totalCountで正しく実装した)。
# ⚠ 「工程場所」(場所/使用設備/供給者)は"MstrTaskLocation"経由で1対多。要件0027(readで配列を
#   読み込まない)・0028(列(先頭)は更新日時が最新の先頭1レコード)への対応として、views.mdの
#   「工程場所id(先頭)」「工程場所数」のとおり、更新日時降順の先頭1件のみ取得し、件数は
#   totalCountで取得する(2026/09/16改訂、以前は配列のまま取得していた)。
# ⚠ 「工程グループ」は"mstrTaskGroupId"の直接列参照(1対1)であり1対多ではない。views.mdの
#   「工程グループid(先頭)」「工程グループ数」という表記は「工程場所」と同様の(先頭)/数の
#   パターンが誤って適用されたものと考えられる(要件0028再評価時に指摘)。実スキーマ上
#   多重度が存在しないため、本クエリでは従来どおり単一オブジェクト参照のまま実装し、
#   「工程グループ数」に対応するフィールドは追加していない。views.md側の記述訂正を推奨する。

query TaskRead(
  $first: Int!
  $offset: Int
  $condition: MstrTaskCondition
  $orderBy: [MstrTasksOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allMstrTasks(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrTaskId
      code
      mstrTaskGroupId

      # --- 詳細 / クラス / 標準時間 ------------------------------------------------
      detail
      class
      defaultTime {
        seconds
        minutes
        hours
        days
        months
        years
      }

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 親id / 子の数(工程体系マスタ、⚠参照) -----------------------------------
      mstrTaskTreesByMstrTaskId(first: 1) {
        nodes {
          mstrTaskTreeId
          parentMstrTaskId
        }
      }
      mstrTaskTreesByParentMstrTaskId {
        totalCount
      }

      # --- 工程名 / 読み / 略称(共通名前仕様) -------------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # --- 工程グループコード / 名 / 読み / 略称(参照のみ) --------------------------
      mstrTaskGroupByMstrTaskGroupId {
        mstrTaskGroupId
        code
        sharedAppellationBySharedAppellationsId {
          sharedDictionaryBySharedDictionaryNameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
        }
      }

      # --- 工程場所id(先頭) / 工程場所数 -------------------------------------------
      mstrTaskLocationsByMstrTaskId(
        first: 1
        orderBy: [UPDATE_AT_DESC]
      ) {
        nodes {
          mstrTaskLocationId
          mstrLocationByMstrLocationId {
            mstrLocationId
            code
            sharedAppellationBySharedAppellationsId {
              sharedDictionaryBySharedDictionaryNameId {
                ja @include(if: $ja)
                en @include(if: $en)
              }
              sharedDictionaryBySharedDictionaryPronunciationId {
                ja @include(if: $ja)
                en @include(if: $en)
              }
              sharedDictionaryBySharedDictionaryNicknameId {
                ja @include(if: $ja)
                en @include(if: $en)
              }
            }
          }
          mstrEquipmentByMstrEquipmentId {
            mstrEquipmentId
            code
            mstrItemByMstrItemId {
              sharedAppellationBySharedAppellationsId {
                sharedDictionaryBySharedDictionaryNameId {
                  ja @include(if: $ja)
                  en @include(if: $en)
                }
                sharedDictionaryBySharedDictionaryPronunciationId {
                  ja @include(if: $ja)
                  en @include(if: $en)
                }
                sharedDictionaryBySharedDictionaryNicknameId {
                  ja @include(if: $ja)
                  en @include(if: $en)
                }
              }
            }
          }
          mstrStakeholderByMstrStakeholderId {
            mstrStakeholderId
            code
            sharedAppellationBySharedAppellationsId {
              sharedDictionaryBySharedDictionaryNameId {
                ja @include(if: $ja)
                en @include(if: $en)
              }
              sharedDictionaryBySharedDictionaryPronunciationId {
                ja @include(if: $ja)
                en @include(if: $en)
              }
              sharedDictionaryBySharedDictionaryNicknameId {
                ja @include(if: $ja)
                en @include(if: $en)
              }
            }
          }
        }
        totalCount
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「TaskReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query TaskReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
