# task画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #task / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/task/task_edit.graphql
#
# ⚠ 実スキーマの型名は"MstrTask"。
# ⚠ 要件0025評価(5-2節)を受けてviews.mdが「親id(idのみセットする)」に更新されたため、
#   親idの編集に対応した。"MstrTask"自体には親を表す列が無く、"MstrTaskTree"(工程体系マスタ)の
#   うちこのタスク自身を表す1行(mstrTaskId = このタスクのid、taskの読み取りで
#   `mstrTaskTreesByMstrTaskId(first: 1)`から取得済みの`mstrTaskTreeId`)を、
#   `mstrTaskTreesToMstrTaskIdUsingMstrTaskId.updateByMstrTaskTreeId`で入れ子更新し、
#   `parentMstrTaskId`のみをパッチする(要求どおり「idのみセットする」、名称等tree行の他の
#   列は編集しない)。対象のtree行が存在しない(新規タスク等)場合は本ミューテーションでは
#   対応できない(update専用。create/upsertは対象外、org_res_location等と同じ既知の制約)。
# ⚠ 「工程グループ」はorg_res_equipmentの「場所名」等と同様、既存マスタへの付け替え(スカラーIDの
#   み設定)として扱う。
# ⚠ 「工程場所」は1対多のため、追加/削除を含む配列の入れ子ミューテーションは本バージョンでは
#   未対応。読み取り専用として出力にのみ含める。
# ⚠ 「標準時間」はPostgres interval型。`Interval`はスカラーではなく本物のGraphQLオブジェクト型
#   (seconds/minutes/hours/days/months/years)のため、出力側では必ずサブセレクションが必要
#   (省略すると値を取得できず、graphql_codegenも警告無しで空のクラスを生成してしまう)。
#   入力(ミューテーション変数)側は別の`IntervalInput`型を使用する
#   (`Interval`を入力に使うとgraphql_codegenがコード生成に失敗することを確認済み)。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation TaskEdit(
  $mstrTaskId: UUID!
  $code: String
  $mstrTaskGroupId: UUID
  $detail: String
  $class: Int
  $defaultTime: IntervalInput
  $remarks: String
  $symbol: String
  $mstrTaskTreeId: UUID
  $parentMstrTaskId: UUID
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String
  $nicknameEn: String
) {
  updateMstrTaskByMstrTaskId(
    input: {
      mstrTaskId: $mstrTaskId
      mstrTaskPatch: {
        code: $code
        mstrTaskGroupId: $mstrTaskGroupId
        detail: $detail
        class: $class
        defaultTime: $defaultTime
        remarks: $remarks
        symbol: $symbol

        # --- 親id(工程体系マスタのうち自分自身を表す行のparentMstrTaskIdのみを入れ子更新) ---
        # ⚠ $mstrTaskTreeIdはread(TaskRead)の`mstrTaskTreesByMstrTaskId`の先頭ノードから
        #   得られるこのタスク自身のtree行ID。$parentMstrTaskIdと必ずセットで渡すこと
        #   (親idを変更しない場合も、現在値のまま両方渡す。tree行が存在しない場合はこの
        #   ネストを省略できないため、その場合は本ミューテーションを使用しないこと)。
        mstrTaskTreesToMstrTaskIdUsingMstrTaskId: {
          updateByMstrTaskTreeId: [
            {
              mstrTaskTreeId: $mstrTaskTreeId
              mstrTaskTreePatch: { parentMstrTaskId: $parentMstrTaskId }
            }
          ]
        }

        # --- 工程名 / 読み / 略称(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: { ja: $pronunciationJa, en: $pronunciationEn }
                }
              }
              sharedDictionaryToSharedDictionaryNicknameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nicknameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nicknameJa, en: $nicknameEn }
                }
              }
            }
          }
        }
      }
    }
  ) {
    mstrTask {
      mstrTaskId
      code
      mstrTaskGroupId
      detail
      class
      defaultTime {
        seconds
        minutes
        hours
        days
        months
        years
      }
      remarks
      symbol

      # --- 親id(更新後の値を確認するため再取得) -----------------------------------
      mstrTaskTreesByMstrTaskId(first: 1) {
        nodes {
          mstrTaskTreeId
          parentMstrTaskId
        }
      }

      # --- 工程場所(読み取り専用。編集は別ミューテーションで対応、⚠参照) -------------
      mstrTaskLocationsByMstrTaskId {
        nodes {
          mstrTaskLocationId
          mstrLocationId
          mstrEquipmentId
          mstrStakeholderId
        }
      }

      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja
          en
        }
      }
    }
  }
}
