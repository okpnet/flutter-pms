# operation画面 - Read(一覧・TrinaGrid用ページネーションクエリ、読み取り専用)
#
# 画面仕様: source/views.md #operation / read(この見出しに"### edit"は無い。一覧表示専用で、
#   編集は専用画面"oepration_editer"(要件0006「レコードの編集や、登録画面は専用画面を使用」)を使う)
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/operation/operation_read.graphql
#
# ⚠ 実スキーマの型名は"MstrOperation"(工程運用マスタ)。
# ⚠ 「工程数」は`mstrOperationTasksByMstrOperationId`のtotalCountで取得する。
# ⚠ 「工数」(参照している工程運用課題が参照している工程の標準時間の合計)はGraphQL側に
#   SUM集計の仕組みが無いため(postgraphile-plugin-connection-filterに集計拡張は含まれない)、
#   各工程運用課題が参照する工程の標準時間(defaultTime)を配列のまま取得する。要件0025評価
#   5-3節を受けてviews.mdに「getプロパティで実装」の指示が追加されたため、GraphQL自体は
#   変更せず、合計値はドメインモデル側(lib/converters、未着手)のgetterプロパティとして
#   実装する設計を確定した。

query OperationRead(
  $first: Int!
  $offset: Int
  $condition: MstrOperationCondition
  $orderBy: [MstrOperationsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allMstrOperations(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrOperationId
      controlCode
      detail

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 運用名 / 略称 / 読み(共通名前仕様) -------------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # --- 工程数(totalCount) / 工数(工程の標準時間、アプリ側で合計) ----------------
      mstrOperationTasksByMstrOperationId {
        totalCount
        nodes {
          mstrOperationTaskId
          mstrTaskByMstrTaskId {
            mstrTaskId
            defaultTime {
              seconds
              minutes
              hours
              days
              months
              years
            }
          }
        }
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「OperationReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query OperationReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
