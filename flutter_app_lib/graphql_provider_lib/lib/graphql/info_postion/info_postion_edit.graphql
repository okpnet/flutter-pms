# info_postion画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #info_postion / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/info_postion/info_postion_edit.graphql
#
# ⚠ #6: フォルダ・ファイル名は画面仕様の見出し"info_postion"をそのまま使用(実テーブルはInfoPosition)。
# ⚠ #3: 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation InfoPostionEdit(
  $infoPositionId: UUID!
  $priority: Int
  $remarks: String
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String
  $nicknameEn: String
) {
  updateInfoPositionByInfoPositionId(
    input: {
      infoPositionId: $infoPositionId
      infoPositionPatch: {
        priority: $priority
        remarks: $remarks

        # --- ポジション名 / 読み / 略称(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToSharedAppellationsId: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: { ja: $pronunciationJa, en: $pronunciationEn }
                }
              }
              sharedDictionaryToSharedDictionaryNicknameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nicknameSharedDictionaryId
                  sharedDictionaryPatch: { ja: $nicknameJa, en: $nicknameEn }
                }
              }
            }
          }
        }
      }
    }
  ) {
    infoPosition {
      infoPositionId
      priority
      remarks
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja
          en
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja
          en
        }
      }
    }
  }
}
