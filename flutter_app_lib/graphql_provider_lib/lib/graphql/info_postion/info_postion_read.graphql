# info_postion画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #info_postion / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/info_postion/info_postion_read.graphql
#
# ⚠ docs/0021_view_graphql_log.md #6: 画面仕様の見出しは"info_postion"(「i」が抜けたスペル)
#   だが、実スキーマの型名は"InfoPosition"。要件0011・0017「見出し2をディレクトリ名/ファイル名
#   にする」に従い、フォルダ・ファイル名は画面仕様の見出しをそのまま使用している
#   (実テーブル名との対応はこのコメントで明示する)。

query InfoPostionRead(
  $first: Int!
  $offset: Int
  $condition: InfoPositionCondition
  $orderBy: [InfoPositionsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
) {
  allInfoPositions(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoPositionId

      # --- 順 ---------------------------------------------------------------
      priority

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- ポジション名 / 読み / 略称(共通名前仕様) -------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ docs/0021_view_graphql_log.md #2: 既知の制約により「InfoPostionReadUpdaterAppellation」
      #   を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query InfoPostionReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
