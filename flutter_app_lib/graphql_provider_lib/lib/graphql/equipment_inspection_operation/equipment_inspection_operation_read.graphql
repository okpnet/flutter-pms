# equipment_inspection_operation画面 - Read(一覧・TrinaGrid用ページネーションクエリ、読み取り専用)
#
# 画面仕様: source/views.md #equipment_inspection_operation / read(この見出しに"### edit"は無い。
#   一覧表示専用で、編集は専用画面"equipment_inspection_operation_editor"を使う)
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025
# 配置場所: lib/graphql/equipment_inspection_operation/equipment_inspection_operation_read.graphql
#
# ⚠ 実スキーマの型名は"MstrInspectionOperation"(点検整備運用マスタ)。
# ⚠ 要件0025評価: 「設備id」「設備名」はviews.md原文に記載が無かったが、mstrEquipmentIdが
#   必須列(NOT NULL)のため、モレとしてviews.mdへ追加したうえで対応した。
# ⚠ 「点検項目数」は`mstrInspectionOperationTasksByMstrInspectionOperationId`のtotalCountで取得する。

query EquipmentInspectionOperationRead(
  $first: Int!
  $offset: Int
  $condition: MstrInspectionOperationCondition
  $orderBy: [MstrInspectionOperationsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allMstrInspectionOperations(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrInspectionOperationId
      code
      mstrEquipmentId

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 点検運用名 / 読み / 略称(共通名前仕様) ---------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # --- 設備名(参照のみ、mstr_item経由、org_res_equipmentと同じ設計) -------------
      mstrEquipmentByMstrEquipmentId {
        mstrEquipmentId
        mstrItemByMstrItemId {
          sharedAppellationBySharedAppellationsId {
            sharedDictionaryBySharedDictionaryNameId {
              ja @include(if: $ja)
              en @include(if: $en)
            }
          }
        }
      }

      # --- 点検項目数(totalCount) -------------------------------------------------
      mstrInspectionOperationTasksByMstrInspectionOperationId {
        totalCount
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「EquipmentInspectionOperationReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query EquipmentInspectionOperationReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
