# purchase_detail画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #purchase_detail / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/purchase_detail/purchase_detail_edit.graphql
#
# ⚠ 実スキーマの型名は"TransPurchaseDetail"。
# ⚠ 「品目履歴」はスカラーID(historyId・mstrItemId)のみ設定(order_detailと同じ方針)。
# ⚠ 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation PurchaseDetailEdit(
  $transPurchaseDetailId: UUID!
  $transPurchaseId: UUID
  $restockingPurchase: Boolean
  $quantity: BigFloat
  $period: Datetime
  $historyId: UUID
  $mstrItemId: UUID
  $remarks: String
  $symbol: String
) {
  updateTransPurchaseDetailByTransPurchaseDetailId(
    input: {
      transPurchaseDetailId: $transPurchaseDetailId
      transPurchaseDetailPatch: {
        transPurchaseId: $transPurchaseId
        restockingPurchase: $restockingPurchase
        quantity: $quantity
        period: $period
        historyId: $historyId
        mstrItemId: $mstrItemId
        remarks: $remarks
        symbol: $symbol
      }
    }
  ) {
    transPurchaseDetail {
      transPurchaseDetailId
      transPurchaseId
      restockingPurchase
      quantity
      period
      historyId
      mstrItemId
      remarks
      symbol
    }
  }
}
