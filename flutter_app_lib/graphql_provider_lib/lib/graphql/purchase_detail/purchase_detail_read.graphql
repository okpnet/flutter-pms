# purchase_detail画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #purchase_detail / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/purchase_detail/purchase_detail_read.graphql
#
# ⚠ 実スキーマの型名は"TransPurchaseDetail"(発注明細)。
# ⚠ 「品目履歴id」「品目id」は"HistoryMstrItem"(品目履歴マスタ)への複合キー参照
#   (historyMstrItemByHistoryIdAndMstrItemId、列名はorder_detailと異なり"historyId"単体)。
# ⚠ HistoryMstrItemには製造元への直接参照フィールドが無いため、order_detailと同様
#   「PurchaseDetailReadManufacturer」を別クエリで呼び出して解決する。
# ⚠ views.md #purchase_detail の要件0030「提案への指示」(資材計画IDの扱い)は未採択のため、
#   `transResorcePlanId`は対象に含めていない。

query PurchaseDetailRead(
  $first: Int!
  $offset: Int
  $condition: TransPurchaseDetailCondition
  $orderBy: [TransPurchaseDetailsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allTransPurchaseDetails(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transPurchaseDetailId
      transPurchaseId
      restockingPurchase
      quantity
      period

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 品目履歴id / 品目id / 品目コード / 識別コード / 表示コード / 製造元ID(⚠参照) --
      historyId
      mstrItemId
      historyMstrItemByHistoryIdAndMstrItemId {
        historyId
        code
        identification
        labelCode
        mstrManufacturerId
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「PurchaseDetailReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query PurchaseDetailReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}

# --- 製造元(呼称セット経由)の名前解決 --------------------------------------------
query PurchaseDetailReadManufacturer($mstrManufacturerId: UUID!, $ja: Boolean!, $en: Boolean!) {
  mstrManufacturerByMstrManufacturerId(mstrManufacturerId: $mstrManufacturerId) {
    mstrManufacturerId
    sharedAppellationBySharedAppellationsId {
      sharedDictionaryBySharedDictionaryNameId {
        ja @include(if: $ja)
        en @include(if: $en)
      }
      sharedDictionaryBySharedDictionaryPronunciationId {
        ja @include(if: $ja)
        en @include(if: $en)
      }
      sharedDictionaryBySharedDictionaryNicknameId {
        ja @include(if: $ja)
        en @include(if: $en)
      }
    }
  }
}
