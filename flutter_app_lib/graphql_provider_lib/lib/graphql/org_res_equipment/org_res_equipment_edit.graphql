# org_res_equipment画面 - Edit(ミューテーション)
#
# 画面仕様: source/views.md #org_res_equipment / edit
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/org_res_equipment/org_res_equipment_edit.graphql
#
# ⚠ #7: 実スキーマの型名は"MstrEquipment"。
# ⚠ #10: 画面仕様では「設備区分(mstr-equipment_kind.shared_appellations_id)」「場所
#   (mstr_location)」に「名」が付いていない一方、「設備名/読み/略称(mstr_item.shared_
#   appellations_id)」には「名」が付いている。設備区分・場所はequipmentから見て共有される
#   マスタ(複数のequipmentから参照されうる)であるのに対し、mstr_itemはこの設備専用の
#   品目マスタ行(1設備につき1品目)とみなせるため、以下のとおり使い分けている。
#     - 設備区分・場所: 既存マスタへの付け替え(スカラーIDのみ設定、名称自体は編集しない)
#     - 設備名/読み/略称: mstr_item経由でshared_appellationsを入れ子更新(この設備専用の
#       品目名を直接編集)
#   この判断はdocs/0021_view_graphql_log.mdに設計判断として記録している。
# ⚠ #9: サイズ幅/奥行き/高さはmstr_item_sizeがEAV構造のため、このミューテーションでは
#   対応していない(read側と同じ制約。詳細はdocs/0021_view_graphql_log.md参照)。
# ⚠ #3: 更新者id/更新者履歴id/削除は0019の既定方針により変数から除外している。

mutation OrgResEquipmentEdit(
  $mstrEquipmentId: UUID!
  $mstrEquipmentCategoryId: UUID
  $code: String
  $controlCode: String
  $labelCode: String
  $mstrLocationId: UUID
  $remarks: String
  $mstrItemId: UUID!
  $sharedAppellationsId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String
  $nameEn: String
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String
  $pronunciationEn: String
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String
  $nicknameEn: String
) {
  updateMstrEquipmentByMstrEquipmentId(
    input: {
      mstrEquipmentId: $mstrEquipmentId
      mstrEquipmentPatch: {
        mstrEquipmentCategoryId: $mstrEquipmentCategoryId
        code: $code
        controlCode: $controlCode
        labelCode: $labelCode
        mstrLocationId: $mstrLocationId
        remarks: $remarks

        # --- 設備名 / 読み / 略称(共通名前仕様、mstr_item経由でshared_appellationsへ入れ子更新) ---
        mstrItemToMstrItemId: {
          updateByMstrItemId: {
            mstrItemId: $mstrItemId
            mstrItemPatch: {
              sharedAppellationToSharedAppellationsId: {
                updateBySharedAppellationsId: {
                  sharedAppellationsId: $sharedAppellationsId
                  sharedAppellationPatch: {
                    sharedDictionaryToSharedDictionaryNameId: {
                      updateBySharedDictionaryId: {
                        sharedDictionaryId: $nameSharedDictionaryId
                        sharedDictionaryPatch: { ja: $nameJa, en: $nameEn }
                      }
                    }
                    sharedDictionaryToSharedDictionaryPronunciationId: {
                      updateBySharedDictionaryId: {
                        sharedDictionaryId: $pronunciationSharedDictionaryId
                        sharedDictionaryPatch: {
                          ja: $pronunciationJa
                          en: $pronunciationEn
                        }
                      }
                    }
                    sharedDictionaryToSharedDictionaryNicknameId: {
                      updateBySharedDictionaryId: {
                        sharedDictionaryId: $nicknameSharedDictionaryId
                        sharedDictionaryPatch: { ja: $nicknameJa, en: $nicknameEn }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  ) {
    mstrEquipment {
      mstrEquipmentId
      mstrEquipmentCategoryId
      code
      controlCode
      labelCode
      mstrLocationId
      remarks
      mstrItemByMstrItemId {
        mstrItemId
        sharedAppellationBySharedAppellationsId {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            ja
            en
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            ja
            en
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            ja
            en
          }
        }
      }
    }
  }
}
