# org_res_equipment画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #org_res_equipment / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/org_res_equipment/org_res_equipment_read.graphql
#
# ⚠ docs/0021_view_graphql_log.md #7: 実スキーマの型名は"MstrEquipment"(設備)。
#   設備名/読み/略称は"mstr_item.shared_appellations_id"(MstrItemByMstrItemId経由)、
#   設備区分名は"mstr_equipment_kind.shared_appellations_id"
#   (MstrEquipmentKindByMstrEquipmentCategoryId経由)、場所名は"mstr_location"
#   (MstrLocationByMstrLocationId経由)から取得する。
# ⚠ #9: 「サイズ幅/サイズ奥行き/サイズ高さ」はmstr_item_sizeテーブルに対応するが、実スキーマは
#   幅・奥行き・高さを個別の列として持たず、mstrItemSizeKindId(区分マスタ)+sizeValue(値)の
#   EAV(1品目に対し区分ごとに複数行)構造になっている。どのmstrItemSizeKindIdが「幅」
#   「奥行き」「高さ」に対応するかはマスタデータ(DBの値)次第で、GraphQL定義時点では
#   静的に判別できないため、このクエリでは3項目個別のフィールドとしては取得せず、
#   `mstrItemSizesByMstrItemId`のnodes(区分名+値のリスト)をそのまま取得するに留める
#   (要件0021「エラーが発生したものは無視し、ログに残す」に基づき、この3項目は
#   個別の平坦化キーとしては未対応とし、詳細をLogに記録する)。

query OrgResEquipmentRead(
  $first: Int!
  $offset: Int
  $condition: MstrEquipmentCondition
  $orderBy: [MstrEquipmentsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
) {
  allMstrEquipments(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      mstrEquipmentId
      code
      controlCode
      labelCode

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 設備区分名(参照のみ) ---------------------------------------------------
      mstrEquipmentKindByMstrEquipmentCategoryId {
        mstrEquipmentKindId
        sharedAppellationBySharedAppellationsId {
          sharedDictionaryBySharedDictionaryNameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
        }
      }

      # --- 設備名 / 読み / 略称(共通名前仕様、mstr_item経由) -----------------------
      mstrItemByMstrItemId {
        mstrItemId
        sharedAppellationBySharedAppellationsId {
          sharedAppellationsId
          sharedDictionaryBySharedDictionaryNameId {
            sharedDictionaryId
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryPronunciationId {
            sharedDictionaryId
            ja @include(if: $ja)
            en @include(if: $en)
          }
          sharedDictionaryBySharedDictionaryNicknameId {
            sharedDictionaryId
            ja @include(if: $ja)
            en @include(if: $en)
          }
        }

        # --- サイズ幅 / サイズ奥行き / サイズ高さ(⚠#9、個別列に分解できないため一覧のまま) ---
        mstrItemSizesByMstrItemId {
          nodes {
            mstrItemSizeId
            sizeValue
            mstrItemSizeKindByMstrItemSizeKindId {
              mstrItemSizeKindId
              sharedAppellationBySharedAppellationsId {
                sharedDictionaryBySharedDictionaryNameId {
                  ja @include(if: $ja)
                  en @include(if: $en)
                }
              }
            }
          }
        }
      }

      # --- 場所名(参照のみ) -------------------------------------------------------
      mstrLocationByMstrLocationId {
        mstrLocationId
        sharedAppellationBySharedAppellationsId {
          sharedDictionaryBySharedDictionaryNameId {
            ja @include(if: $ja)
            en @include(if: $en)
          }
        }
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ #2: 既知の制約により「OrgResEquipmentReadUpdaterAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query OrgResEquipmentReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
