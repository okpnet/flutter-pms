# company_page画面 - read for editing(旧RFE、編集画面遷移用の読み込みクエリ)
#
# 画面仕様: source/view.yaml #CompanyPageEdit(generateRfe: trueにより自動導出)
# 命名規則: CLAUDE.md 画面仕様命名規則により、view.yamlのトップノード名
#   `CompanyPageEdit`のスネークケース(`company_page`)+"_rfe"をファイル名にする。
#
# 要件0037: 独立した`kind: RFE`は廃止した(0034ログで発覚した「RFEノードが対応する
# edit定義と無関係な定義を誤参照する」事故を構造的に防ぐため)。本ファイルは
# `view.yaml`の`CompanyPageEdit`(`generateRfe: true`)と全く同じ`columns`ツリーを
# SELECT用に解釈して自動導出したものであり、`CompanyPageEdit`とは別のYAMLノードを
# 手書きしていない(27_yaml_to_graphql_conversion_rules.md 8章参照)。
#
# `company_page_edit.graphql`のミューテーションを組み立てるために必要な
# id一式(会社自身・ceo・address1/address2/billそれぞれのshared_appellations_id、
# および各name/pronunciation/nicknameのshared_dictionary_id)を、先頭列(要件0027)の
# `info_company_id`を必須引数として1件取得する。
#
# 要件0036(2026-09-26): company_page_read.graphqlと異なり、RFEは編集フォームへ
# ja/en両方の値を同時にプリセットする必要があるため(編集ミューテーションは
# deleteOthers+createで毎回ja/en2件を丸ごと置き換える方式のため、常に両方の値が
# 必要)、「1回の呼び出しで言語1つのみ」という読み込み側の設計は適用しない。
# ただし旧`$ja: Boolean!`/`$en: Boolean!`によるトグルは、RFEでは常にtrueで
# 呼び出されるだけの無意味な変数だったため撤廃し、`$jaLanguageCodeId`/
# `$enLanguageCodeId`を`UUID!`(必須)にしたうえで両方のフィールドを
# 常時(`@include`無しで)取得するよう単純化した。値は呼び出し側が`SharedLanguageCode`を
# `code`で解決して渡す(company_page_read.graphql / edit.graphqlと同じ方式)。

