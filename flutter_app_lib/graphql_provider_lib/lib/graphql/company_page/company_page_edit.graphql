# company_page画面 - Edit(ミューテーション)
#
# 画面仕様: source/view.yaml #CompanyPageEdit
# 命名規則: CLAUDE.md 画面仕様命名規則(要件0033)により、view.yamlのトップノード名
#   `CompanyPageEdit`のスネークケース(`company_page`)をディレクトリ名・ファイル名にする
#   (要件0033時点は暫定的にテーブル名`info_company`を使っていたが、要件0035で
#   `company_page`へ統一・リネームした。旧`lib/graphql/info_company/`は廃止)。
#
# 要件0026(2026-09-25、schema.graphql再取得)により、`InfoCompany.ceo`・
# `InfoAddress.address1`/`address2`/`bill`が単純な`String`から`shared_appellations`への
# 直接FK(UUID)へ変更された。会社名(`sharedAppellationToNames`)と同じ
# 入れ子ミューテーション構造(`sharedAppellationToCeoNames`/`sharedAppellationToAddress1`/
# `sharedAppellationToAddress2`/`sharedAppellationToBill`)で、name/pronunciation/nickname
# それぞれのshared_dictionary(と配下のshared_dictionary_value)を更新する
# (docs/0034_view_yaml_graphql_evaluation_log.md参照)。
#
# `$jaLanguageCodeId`/`$enLanguageCodeId`はアプリケーション側が別途`SharedLanguageCode`を
# `code`で解決して渡す(要件0033・shipping_kind試作と同じ方式)。`dictionaryValue`は
# `String!`のため、翻訳が無い言語は呼び出し側で空文字列('')に変換してから渡す想定
# (要件0026追記9・27_yaml_to_graphql_conversion_rules.md参照)。
#
# 要件0037: `view.yaml`の`CompanyPageEdit`は`generateRfe: true`を持つ。編集フォームへの
# プリロード用クエリ(旧RFE)は、独立したYAMLノードとしてではなく、本ノードと全く同じ
# `columns`ツリーから自動導出される(company_page_rfe.graphql参照)。
#
# 要件0044追記: `provisions`(1対多、ProvisionPageEditと同じ列構成)の入れ子編集を追加した。
# これまでの入れ子編集(会社名・代表・住所)はすべて`arrayType: toFirstOne`(1対1相当)で
# あり、各フィールドを個別のスカラー変数に分解できたが、`provisions`は`arrayType: toMany`
# (件数が可変)のため同じ分解方式が使えない。このため、PostGraphile
# (postgraphile-plugin-nested-mutations)が`InfoProvisionFk2InverseInput`として提供する
# 標準の入れ子書き込み型(`updateByInfoProvisionId`/`create`/`deleteByInfoProvisionId`)を
# そのまま可変長リストの変数として公開する方式を採用した
# (`$provisionsUpdate`/`$provisionsCreate`/`$provisionsDelete`)。各要素は
# `lib/graphql/schema.graphql`の対応する入力型(`InfoProvisionOnInfoProvisionForInfoProvisionFk2UsingInfoProvisionPkcUpdate`
# 等)にそのまま従う(`infoProvisionPatch`には`sharedAppellationToNames`による名称の
# 入れ子更新も含められる。呼び出し側がMap/JSONとして直接組み立てる想定で、
# provision_page_edit.graphqlのような個別スカラー変数への分解は行っていない)。

mutation CompanyPageEdit(
  $infoCompanyId: UUID!
  $webPage: String
  $symbol: String
  $remarks: String
  $sharedAppellationsId: UUID!
  $jaLanguageCodeId: UUID!
  $enLanguageCodeId: UUID!
  $nameSharedDictionaryId: UUID!
  $nameJa: String!
  $nameEn: String!
  $pronunciationSharedDictionaryId: UUID!
  $pronunciationJa: String!
  $pronunciationEn: String!
  $nicknameSharedDictionaryId: UUID!
  $nicknameJa: String!
  $nicknameEn: String!
  $ceoSharedAppellationsId: UUID!
  $ceoNameSharedDictionaryId: UUID!
  $ceoNameJa: String!
  $ceoNameEn: String!
  $ceoPronunciationSharedDictionaryId: UUID!
  $ceoPronunciationJa: String!
  $ceoPronunciationEn: String!
  $ceoNicknameSharedDictionaryId: UUID!
  $ceoNicknameJa: String!
  $ceoNicknameEn: String!
  $infoAddressId: UUID!
  $iso31663: String
  $zipCode: String
  $phone: String
  $faxNumber: String
  $address1SharedAppellationsId: UUID!
  $address1NameSharedDictionaryId: UUID!
  $address1NameJa: String!
  $address1NameEn: String!
  $address1PronunciationSharedDictionaryId: UUID!
  $address1PronunciationJa: String!
  $address1PronunciationEn: String!
  $address1NicknameSharedDictionaryId: UUID!
  $address1NicknameJa: String!
  $address1NicknameEn: String!
  $address2SharedAppellationsId: UUID!
  $address2NameSharedDictionaryId: UUID!
  $address2NameJa: String!
  $address2NameEn: String!
  $address2PronunciationSharedDictionaryId: UUID!
  $address2PronunciationJa: String!
  $address2PronunciationEn: String!
  $address2NicknameSharedDictionaryId: UUID!
  $address2NicknameJa: String!
  $address2NicknameEn: String!
  $billSharedAppellationsId: UUID!
  $billNameSharedDictionaryId: UUID!
  $billNameJa: String!
  $billNameEn: String!
  $billPronunciationSharedDictionaryId: UUID!
  $billPronunciationJa: String!
  $billPronunciationEn: String!
  $billNicknameSharedDictionaryId: UUID!
  $billNicknameJa: String!
  $billNicknameEn: String!
  $provisionsUpdate: [InfoProvisionOnInfoProvisionForInfoProvisionFk2UsingInfoProvisionPkcUpdate!]
  $provisionsCreate: [InfoProvisionFk2InfoProvisionCreateInput!]
  $provisionsDelete: [InfoProvisionInfoProvisionPkcDelete!]
) {
  updateInfoCompanyByInfoCompanyId(
    input: {
      infoCompanyId: $infoCompanyId
      infoCompanyPatch: {
        webPage: $webPage
        symbol: $symbol
        remarks: $remarks

        # --- 会社名(共通名前仕様、shared_appellations経由でshared_dictionaryへ入れ子更新) ---
        sharedAppellationToNames: {
          updateBySharedAppellationsId: {
            sharedAppellationsId: $sharedAppellationsId
            sharedAppellationPatch: {
              sharedDictionaryToSharedDictionaryNameId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $nameSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $nameJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $nameEn }
                      ]
                    }
                  }
                }
              }
              sharedDictionaryToSharedDictionaryPronunciationId: {
                updateBySharedDictionaryId: {
                  sharedDictionaryId: $pronunciationSharedDictionaryId
                  sharedDictionaryPatch: {
                    sharedDictionaryValuesUsingSharedDictionaryId: {
                      deleteOthers: true
                      create: [
                        { sharedLanguageCodeId: $jaLanguageCodeId, dictionaryValue: $pronunciationJa }
                        { sharedLanguageCodeId: $enLanguageCodeId, dictionaryValue: $pronunciationEn }
