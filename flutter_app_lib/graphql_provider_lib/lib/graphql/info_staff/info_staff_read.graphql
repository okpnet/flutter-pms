# info_staff画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #info_staff / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/info_staff/info_staff_read.graphql
# 作成前に確認した内容・問題点: docs/0021_view_graphql_log.md を参照
#
# ⚠ 2026/09/11のschema.graphql更新により、InfoStaff.info_office_id列自体が実スキーマから
#   削除されたことを確認した(0021作成時点では列は存在しFK未定義のみが問題だったが、今回の
#   更新でinfo_staffテーブルからinfo_office_id列そのものが無くなった)。要件0022「テーブルや
#   列の特定ができない場合はログに残したうえで、テーブルそのものの処理をスキップする」に従い、
#   「事業所名」フィールド(および解決用の別クエリInfoStaffReadOffice)をこのクエリから削除した
#   (docs/0021_view_graphql_log.mdの追記を参照)。views.md側の項目定義との整合は別途要確認。

query InfoStaffRead(
  $first: Int!
  $offset: Int
  $condition: InfoStaffCondition
  $orderBy: [InfoStaffsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
) {
  allInfoStaffs(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoStaffId
      code

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 名前 / 読み / 略称(共通名前仕様) ---------------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # ⚠ info_office_id列が実スキーマから削除されたため、「事業所名」は取得不可(上記コメント参照)。

      # --- 緊急連絡先 -------------------------------------------------------------
      privatePhone

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ docs/0021_view_graphql_log.md #2: 既知の制約により「InfoStaffReadUpdaterAppellation」
      #   を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query InfoStaffReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
