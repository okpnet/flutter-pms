# info_staff画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #info_staff / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021
# 配置場所: lib/graphql/info_staff/info_staff_read.graphql
# 作成前に確認した内容・問題点: docs/0021_view_graphql_log.md を参照
#
# ⚠ docs/0021_view_graphql_log.md #5: InfoStaff.info_office_idには外部キー制約が
#   実スキーマに定義されておらず(InfoStaff型にinfoOfficeByInfoOfficeIdが存在しない)、
#   「事業所名」をネストして取得できない。infoOfficeId(スカラー)を取得しておき、
#   別クエリ「InfoStaffReadOffice」(ルートの単票取得 infoOfficeByInfoOfficeId を使用)で
#   事業所名を解決する(0007/0019の「更新者名」解決と同じ回避パターン)。

query InfoStaffRead(
  $first: Int!
  $offset: Int
  $condition: InfoStaffCondition
  $orderBy: [InfoStaffsOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
) {
  allInfoStaffs(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      infoStaffId
      code

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 名前 / 読み / 略称(共通名前仕様) ---------------------------------------
      sharedAppellationBySharedAppellationsId {
        sharedAppellationsId
        sharedDictionaryBySharedDictionaryNameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryPronunciationId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
        sharedDictionaryBySharedDictionaryNicknameId {
          sharedDictionaryId
          ja @include(if: $ja)
          en @include(if: $en)
        }
      }

      # --- 事業所名(⚠#5、下のInfoStaffReadOfficeで解決するためのID) ----------------
      infoOfficeId

      # --- 緊急連絡先 -------------------------------------------------------------
      privatePhone

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ docs/0021_view_graphql_log.md #2: 既知の制約により「InfoStaffReadUpdaterAppellation」
      #   を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 事業所名の解決(⚠#5) --------------------------------------------------------
query InfoStaffReadOffice($infoOfficeId: UUID!) {
  infoOfficeByInfoOfficeId(infoOfficeId: $infoOfficeId) {
    infoOfficeId
    sharedAppellationBySharedAppellationsId {
      sharedDictionaryBySharedDictionaryNameId {
        ja
        en
      }
    }
  }
}

# --- 更新者の呼称(shared_appellations)・名前解決 --------------------------------
query InfoStaffReadUpdaterAppellation($sharedAppellationsId: UUID!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja
      en
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja
      en
    }
  }
}
