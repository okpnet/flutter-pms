# ship_order画面 - Read(一覧・TrinaGrid用ページネーションクエリ)
#
# 画面仕様: source/views.md #ship_order / read
# 作成ルール: CLAUDE.md 要件0006・0011・0017・0018・0021・0025・0027・0028・0030
# 配置場所: lib/graphql/ship_order/ship_order_read.graphql
#
# ⚠ 実スキーマの型名は"TransShipOrder"(出荷、PKは"transShippingId")。
# ⚠ 「注文番号」〜「受注品目数」は"transOrderByTransOrderId"経由で受注(TransOrder)自身の列を
#   再度参照する(views.mdの「受注の〜」という記述に対応)。顧客関連は受注側が履歴テーブル参照の
#   ため、order_read.graphqlと同じ構造で取得する。
# ⚠ 「出荷先顧客」は"historyMstrStakeholderByHistoryMstrStakeholderIdAndMstrStakeholderId"経由
#   (履歴id・利害関係者idの複合キー、要件0030評価でモレとして追加)。

query ShipOrderRead(
  $first: Int!
  $offset: Int
  $condition: TransShipOrderCondition
  $orderBy: [TransShipOrdersOrderBy!] = [PRIMARY_KEY_ASC]
  $ja: Boolean!
  $en: Boolean!
  $removed: Boolean = false
) {
  allTransShipOrders(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
    filter: { remove: { equalTo: $removed } }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transShippingId
      transOrderId
      edtimatedShippingDate
      code
      estimatedArrivalDate

      symbol

      # --- 共通項: remarks / update_at / remove ---------------------------------
      remarks
      updateAt
      remove

      # --- 受注の注文番号〜受注品目数(⚠受注(TransOrder)経由の再参照) -----------------
      # 顧客名/事業所名/部署名/担当者名は各AppellationsIdを「ShipOrderReadAppellation」で解決する。
      transOrderByTransOrderId {
        orderNumber
        customerOrderNumber
        customerHistoryId
        mstrStakholderId
        historyMstrStakeholderByCustomerHistoryIdAndMstrStakholderId {
          code
          sharedAppellationsId
        }
        contactHistoryId
        mstrStakeholderConcatId
        historyMstrStakeholderContactByContactHistoryIdAndMstrStakeholderConcatId {
          code
          officeAppellationsId
          departmentAppellationsId
          contactPersonAppellationsId
        }
        controlCode1
        controlCode2
        controlCode3
        orderProcessingDate
        deliveryDate
        deadline
        transOrderDetailsByTransOrderId {
          totalCount
        }
      }

      # --- 出荷先顧客履歴id / 出荷先顧客id(⚠参照) ------------------------------------
      # 出荷先顧客名/読み/略称は sharedAppellationsId を「ShipOrderReadAppellation」で解決する。
      historyMstrStakeholderId
      mstrStakeholderId
      historyMstrStakeholderByHistoryMstrStakeholderIdAndMstrStakeholderId {
        historyId
        sharedAppellationsId
      }

      # --- 出荷予定数 --------------------------------------------------------------
      transShippingOrderDetailsByTransShippingId {
        totalCount
      }

      # --- 共通項: 更新者名(共通名前仕様)の呼称セットID -----------------------------
      # ⚠ 既知の制約により「ShipOrderReadAppellation」を別クエリで呼び出す。
      historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
        historyId
        infoStaffId
        sharedAppellationsId
      }
    }
  }
}

# --- 呼称(shared_appellations)の名前解決 -----------------------------------------
# 更新者名 / 顧客名 / 事業所名 / 部署名 / 担当者名 / 出荷先顧客名のいずれも、対応する
# sharedAppellationsId を渡してこのクエリを呼び出す。
query ShipOrderReadAppellation($sharedAppellationsId: UUID!, $ja: Boolean!, $en: Boolean!) {
  sharedAppellationBySharedAppellationsId(
    sharedAppellationsId: $sharedAppellationsId
  ) {
    sharedAppellationsId
    sharedDictionaryBySharedDictionaryNameId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
    sharedDictionaryBySharedDictionaryPronunciationId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
    sharedDictionaryBySharedDictionaryNicknameId {
      ja @include(if: $ja)
      en @include(if: $en)
    }
  }
}
