# Company画面 - Read(読み込み用クエリ)
#
# 画面仕様: source/views.md #Company / Read
# 作成ルール: CLAUDE.md 要件0006・0007
# 作成前に見つかった問題点: docs/0007_view_graphql_log.md を参照(⚠コメントは同ログの番号に対応)
#
# 共通項(CLAUDE.md #仕様): remarks, update_at, remove, 更新者名(共通名前仕様)を含める。
# 会社自身の呼称(会社名/読み)は info_company.shared_appellations_id 経由(共通名前仕様、別チェーン)。

query CompanyRead($infoCompanyId: UUID!) {
  infoCompanyByInfoCompanyId(infoCompanyId: $infoCompanyId) {
    infoCompanyId

    # --- 会社名 / 読み(共通名前仕様) ----------------------------------------
    # ⚠ ログ#1: shared_appellations.name/pronunciation -> shared_dictionary の
    #    外部キーが未定義のため、このネストは現状のDBでは生成されない。
    # ⚠ ログ#6: 列名はCLAUDE.md記載の "shared_dictionary_name_id" 等ではなく
    #    実DB列名 "name"/"pronunciation" を基に命名した。
    sharedAppellationsBySharedAppellationsId {
      sharedAppellationsId
      # 会社名(sharedDictionaryIdはEdit時の更新先特定に使用)
      sharedDictionaryByName {
        sharedDictionaryId
        ja
        en
      }
      # 読み(sharedDictionaryIdはEdit時の更新先特定に使用)
      sharedDictionaryByPronunciation {
        sharedDictionaryId
        ja
        en
      }
    }

    # --- ホームページ / 代表 -------------------------------------------------
    webPage
    ceo

    # --- 郵便番号 / 住所1~3 ---------------------------------------------------
    # ⚠ ログ#3: info_company.info_address_id -> info_address の外部キーが未定義。
    # ⚠ ログ#5: info_addressにaddress3に相当する列が存在しない(住所3行目は取得不可)。
    infoAddressByInfoAddressId {
      infoAddressId
      zipCode
      address1
      address2
    }

    # --- 所属するスタッフ数 ---------------------------------------------------
    # ⚠ ログ#4: info_staff.info_company_id -> info_company の外部キーが未定義のため
    #    この逆参照(Connection)は現状のDBでは生成されない。
    infoStaffsByInfoCompanyId {
      totalCount
    }

    # --- 事業所のリスト -------------------------------------------------------
    # ⚠ ログ#4: info_office.info_company_id -> info_company の外部キーが未定義のため
    #    この逆参照(Connection)は現状のDBでは生成されない。
    infoOfficesByInfoCompanyId {
      nodes {
        infoOfficeId
        sharedAppellationsBySharedAppellationsId {
          sharedDictionaryByName {
            ja
            en
          }
        }
      }
    }

    # --- 共通項: remarks / update_at / remove ---------------------------------
    remarks
    updateAt
    remove

    # --- 共通項: 更新者名(共通名前仕様) ----------------------------------------
    # ⚠ ログ#2: history_info_staff.shared_appellations_id -> shared_appellations の
    #    外部キーが未定義。
    # ⚠ ログ#7: CLAUDE.md記載の参照先は info_staff だが、実際の外部キーは
    #    history_info_staff(複合キー history_id, info_staff_id)を参照している。
    historyInfoStaffByUpdateUserHistoryIdAndUpdateUserId {
      sharedAppellationsBySharedAppellationsId {
        sharedDictionaryByName {
          ja
          en
        }
      }
    }
  }
}
