# --- read: 会社情報(info_company) 詳細画面 ---
CompanyPage:
  kind: read
  from: info_company
  condition: true
  columns:
    - info_company_id
    - web_page
    - name: ceo
      as: ceo_labels
      arrayType: toFirstOne
      using: ceo
      pick:
        - name
        - pronunciation
        - nickname
      <<: *appellationLabels
    - symbol
    - remarks
    - name: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressFields
      defaultWhere:
      - column: remove
        operator: "="
        value: false
    - name: offices
      arrayType: toMany #Q1:toManyであれば展開されず配列になる?
      limit: 50
      <<: *OfficePage 

OfficePage: &OfficePage
  kind: read
  from: info_office
  condition: true
  columns:
    - info_office_id
    - info_company_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: shared_appellations_id
      <<: *appellationLabels
    - name: info_address_id
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *updateStaff
      defaultWhere:
      - column: remove
        operator: "="
        value: false