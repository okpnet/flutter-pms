  columns:
    - info_staff_id
    - info_company_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: shared_appellations_id
      <<: *appellationLabels
    - sex
    - phone
    - private_phone
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *updateStaff
      defaultWhere:
      - column: remove
        operator: "="
        value: false

StaffpageEdit:
  kind: edit
  from: info_staff
  requiredWhere:
    - info_staff_id
  generateRfe: true
  columns:
    - info_staff_id
    - info_company_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: shared_appellations_id
      <<: *appellationLabels
    - sex
    - phone
    - private_phone
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

DepartmentPage:
  kind: read
  from: info_department
  condition: true
  columns:
    
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *updateStaff
      defaultWhere:
      - column: remove
        operator: "="
        value: false