  from: info_office
  requiredWhere:
    - info_office_id
    - info_company_id
  generateRfe: true
  columns:
    - info_office_id
    - info_company_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: shared_appellations_id
      <<: *appellationLabels
    - name: info_address_id
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

StaffPage:
