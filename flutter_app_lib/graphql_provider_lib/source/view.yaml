          <<: *appellationLabelsEdit
        - name: address
          arrayType: toFirstOne
          using: info_address_id
          <<: *addressEditFields
        - remarks
        - update_user_id
        - update_user_history_id
        - remove
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *appellationLabelsEdit
    - name: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressEditFields
    - name: kinds
      arrayType: toMany
      using: info_department_id
      from: info_department_kind
      columns:
        - info_department_kind_id
        - name: value
