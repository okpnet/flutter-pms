# --- read: 会社情報(info_company) 詳細画面 ---
CompanyPage:
  kind: read
  from: info_company
  condition: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_company_id
    - web_page
    - name: ceo
      as: ceo_labels
      arrayType: toFirstOne
      using: ceo_names
      pick:
        - name
        - pronunciation
        - nickname
      <<: *appellationLabels
    - name: provision #2026/09/29　追加
      arrayType: toMany
      as: provisions
      <<: *ProvisionPage
    - symbol
    - remarks
    - name: address
      as: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressFields
      defaultWhere:
      - column: remove
        operator: "="
        value: false
    - name: offices
      arrayType: toMany #Q1:toManyであれば展開されず配列になる?
      limit: 50
      <<: *OfficePage

# --- edit: 会社情報(info_company) 更新/新規作成
#     要件0037: generateRfe: trueにより、このcolumnsツリーから読み込み専用の
#     「read for editing」クエリを自動導出する(旧CompanyPageRFEノードは廃止)。
#     requiredWhereは、read for editing側が1件取得する際の必須引数(通常は主キー)。 ---
CompanyPageEdit:
  kind: edit
  from: info_company
  requiredWhere:
    - info_company_id
  generateRfe: true
  columns:
    - info_company_id
    - shared_appellations_id
    - name: info_address_id
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressEditFields
    - web_page
    - name: ceo
      arrayType: toFirstOne
      using: ceo_names
      <<: *appellationLabelsEdit
    - name: provision #2026/09/29　追加(CompanyPage.provisionsの入れ子編集)
      # ProvisionPageEdit(トップノード)をそのまま<<でmergeすると、node専用の
      # generateRfeプロパティがcolumnEntry位置では許可されずスキーマ違反になるため
      # (schema.jsonのnode.generateRfeはcolumnEntryに無い)、generateRfe/requiredWhereを
      # 除いたcolumnsのみをこの場で複製する(要件0044追記、ProvisionPageEditと同一内容を
      # 保つこと)。
      arrayType: toMany
      as: provisions
      kind: edit
      from: info_provision
      columns:
        - info_provision_id
        - info_company_id
        - code
        - name: labels
          arrayType: toFirstOne
          using: names
          <<: *appellationLabelsEdit
        - details
        - remarks
        - update_user_id
        - update_user_history_id
        - remove
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

