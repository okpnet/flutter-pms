    - identification
    - control_code
    - name: manufacture
      arrayType: toFirstOne
      as: manufacture
      using: mstr_manufacturer_id
      <<: *ManufacturePage
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - label_code
    - description
    - name: unit # IDの解決のみ(UnitReadFieldsは参照用アーム)
      arrayType: toFirstOne
      using:  shared_unit_id
      <<: *UnitReadFields
    - increment
    - lot
    - stock_quantity 
