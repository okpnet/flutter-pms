# 組織
DepartmentPage:
  kind: read
  from: info_department
  condition: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_department_id
    - info_company_id
    - name: parent
      arrayType: toFirstOne
      as: parent
      using: info_department_id
      from: info_department_tree
      # NULL許容(呼び出し側がNULLを渡したときは組織テーブルのトップノードを表す)。
      requiredWhere:
        - parent_info_department_id
      columns:
        - info_department_tree_id
        - parent_info_department_id
      defaultWhere:
        - column: remove
          operator: "="
          value: false
    - name: descendants
      arrayType: toFirstOne
      as: descendants
      using: info_department_id
      pick:
        - descendant_count
      from: v_department_descendants
    - info_office_id
    - name: office
      arrayType: toFirstOne
      as: office
      using: info_office_id      
      <<: *OfficePage
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      pick: # 2026/09/29　追加
        - name
        - pronunciation
        - nickname
      <<: *appellationLabels
    - name: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressFields
    - name: kinds
      arrayType: toMany
      using: info_department_id
      from: info_department_kind
      columns:
        - info_department_kind_id
        - name: value
          as: value
          using: info_department_kind_id
          arrayType: toMany
          from: info_department_kind_value
          columns:
            - info_department_kind_value_id
            - name: labels
              arrayType: toFirstOne
              using: names
              <<: *appellationLabels
              defaultWhere:
                - column: remove
                  operator: "="
                  value: false
        - info_department_id
        - symbol
        - remarks
        - update_at
        - name: update_user
          as: update_user
          using: [update_user_history_id,update_user_id]
          arrayType: toFirstOne
          <<: *updateStaff
          defaultWhere:
          - column: remove
            operator: "="
            value: false
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *updateStaff

