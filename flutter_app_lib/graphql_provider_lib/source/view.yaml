# yaml-language-server: $schema=schema.json

# --- Read用アーム: JA表示名のみを解決する(既存のshared_appellations_ja_label.yamlと同型) ---
# shared_appellationsが持つ3本のFK(shared_dictionary_name_id / _pronunciation_id / _nickname_id)は
# いずれも「shared_dictionaryへのFK1本を辿ってJA表示名を得る」という同じ形をしている。
# using(どのFK列を使うか)だけを変えて使い回せるよう、shared_dictionary以下を1本の
# 共有アームとして定義する(test.yamlのdictionaryLabelと同型)。
dictionaryLabel: &dictionaryLabel
  kind: read
  from: shared_dictionary
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - name: value
      arrayType: toFirstOne
      from: shared_dictionary_value
      defaultWhere:
        - column: remove
          operator: "="
          value: false
      columns:
        - dictionary_value
        # shared_language_code は絞り込み専用のJOIN。出力列は無い。
        # codeは呼び出し側が必ず指定する引数(requiredWhere)であり、ハードコードしない。
        # output: false … 常に出力から除外する。where/requiredWhere/defaultWhereはpickと違い
        # 除外されず、親(value)のLATERALサブクエリのJOIN/WHERE句の構築には使われ続ける。
        - name: language
          arrayType: toFirstOne
          from: shared_language_code
          output: false
          requiredWhere:
            - code
          defaultWhere:
            - column: remove
              operator: "="
              value: false

# --- Edit用アーム: shared_dictionary配下の言語別値(shared_dictionary_value)をまとめて編集する。
#     1辞書エントリは言語の数だけ行を持つ(1対N)ため、ReadのdictionaryLabelとは異なりarrayType: toMany(複数件)にする。
#     (下書きではtoFirstOneになっていたが、複数言語を同時に編集できなくなるため修正)
dictionaryEdit: &dictionaryEdit
  kind: edit
  from: shared_dictionary
  columns:
    - shared_dictionary_id
    - name: value
      arrayType: toMany
      from: shared_dictionary_value
      columns:
        - shared_dictionary_value_id
        - shared_language_code_id
        - dictionary_value
        - remarks
        - update_user_id
        - update_user_history_id
        - remove
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# --- edit: shared_appellations 更新/新規作成。name/pronunciation/nicknameそれぞれの
#     shared_dictionary(と配下のshared_dictionary_value)も同時に編集する。 ---
appellationLabelsEdit: &appellationLabelsEdit
  kind: edit
  from: shared_appellations
  requiredWhere:
    - shared_appellations_id
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - name: name #Q1:識別であれば、別々にすればアクセスできないか?
      as: name
      using: shared_dictionary_name_id
      arrayType: toFirstOne
      <<: *dictionaryEdit
    - name: pronunciatione
      as: pronunciation
      using: shared_dictionary_pronunciation_id
      arrayType: toFirstOne
      <<: *dictionaryEdit
    - name: nicknam
      as: nickname
      using: shared_dictionary_nickname_id
      arrayType: toFirstOne
      <<: *dictionaryEdit
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# --- read: shared_appellations 詳細(name/pronunciation/nicknameのJA表示名を取得) ---
appellationLabels: &appellationLabels
  kind: read
  from: shared_appellations
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - shared_appellations_id
    - name: name 
      as: name
      using: shared_dictionary_name_id 
      arrayType: toFirstOne
      <<: *dictionaryLabel
    - name: npronunciatione
      as: pronunciation
      using: shared_dictionary_pronunciation_id
      arrayType: toFirstOne
      <<: *dictionaryLabel
    - name: nickname
      as: nickname
      using: shared_dictionary_nickname_id
      arrayType: toFirstOne
      <<: *dictionaryLabel

# 共有(参照)定義: 住所情報 (点8) — info_address由来。company以外からも参照されうるため独立定義し、
# 実際の利用箇所ではYAMLエイリアス(*addressFields)で共有参照する。
addressFields: &addressFields
  kind: read
  from: info_address
  columns:
    - iso3166_3
    - zip_code
    - name: address1
      as: address1
      using: address1
      arrayType: toFirstOne
      pick:
        - name
        - pronunciation
        - nickname
      <<: *appellationLabels
    - name: address2
      as: address2
      using: address2
      arrayType: toFirstOne
      pick:
        - name
        - pronunciation
        - nickname
      <<: *appellationLabels
    - name: bill
      as: bill_name
      using: bill
      arrayType: toFirstOne
      pick:
        - name
        - pronunciation
        - nickname
      <<: *appellationLabels
    - phone
    - fax_number

addressEditFields: &addressEditFields
  kind: edit
  from: info_address
  columns:
    - info_address_id
    - iso3166_3
    - zip_code
    - name: address1
      using: address1
      arrayType: toFirstOne
      <<: *appellationLabelsEdit
    - name: address2
      using: address2
      arrayType: toFirstOne
      <<: *appellationLabelsEdit
    - name: bill
      as: bill_name
      using: bill
      arrayType: toFirstOne
      <<: *appellationLabelsEdit
    - phone
    - fax_number
    - remarks
    - update_user_id
    - update_user_history_id
    - remove 

languageCodeEdit: &languageCodeEdit
  kind: edit
  from: shared_language_code
  columns:
    - shared_language_code_id
    - code
    - label
    - priority
    - is_default
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# スタッフ履歴
# update_userに使用
updateStaff: &updateStaff
  kind: read
  from: history_info_staff
  columns:
    - history_id
    - info_staff_id
    - info_company_id
    - code
    - name: name
      as: name
      using: shared_appellations_id
      arrayType: toFirstOne
      <<: *appellationLabelsEdit
    - sex
    - phone
    - symbol
    - private_phone 

# --- read: 会社情報(info_company) 詳細画面 ---
CompanyPage:
  kind: read
  from: info_company
  condition: true
  columns:
    - info_company_id
    - web_page
    - name: ceo
      as: ceo_labels
      arrayType: toFirstOne
      using: ceo
      pick:
        - name
        - pronunciation
        - nickname
      <<: *appellationLabels
    - symbol
    - remarks
    - name: address
      as: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressFields
      defaultWhere:
      - column: remove
        operator: "="
        value: false
    - name: offices
      arrayType: toMany #Q1:toManyであれば展開されず配列になる?
      limit: 50
      <<: *OfficePage

# --- edit: 会社情報(info_company) 更新/新規作成
#     要件0037: generateRfe: trueにより、このcolumnsツリーから読み込み専用の
#     「read for editing」クエリを自動導出する(旧CompanyPageRFEノードは廃止)。
#     requiredWhereは、read for editing側が1件取得する際の必須引数(通常は主キー)。 ---
CompanyPageEdit:
  kind: edit
  from: info_company
  requiredWhere:
    - info_company_id
  generateRfe: true
  columns:
    - info_company_id
    - shared_appellations_id
    - name: info_address_id
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressEditFields
    - web_page
    - name: ceo
      arrayType: toFirstOne
      using: ceo
      <<: *appellationLabelsEdit
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 事業所の読み込み
OfficePage: &OfficePage
  kind: read
  from: info_office
  condition: true
  columns:
    - info_office_id
    - info_company_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: shared_appellations_id
      <<: *appellationLabels
    - name: info_address_id
      as: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *addressFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *updateStaff
      defaultWhere:
      - column: remove
        operator: "="
        value: false

OfficePageEdit:
