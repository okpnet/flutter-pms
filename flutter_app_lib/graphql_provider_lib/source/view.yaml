# yaml-language-server: $schema=schema.json

# --- Read用アーム: JA表示名のみを解決する(既存のshared_appellations_ja_label.yamlと同型) ---
# shared_appellationsが持つ3本のFK(shared_dictionary_name_id / _pronunciation_id / _nickname_id)は
# いずれも「shared_dictionaryへのFK1本を辿ってJA表示名を得る」という同じ形をしている。
# using(どのFK列を使うか)だけを変えて使い回せるよう、shared_dictionary以下を1本の
# 共有アームとして定義する(test.yamlのDictionaryLabelReadFieldsと同型)。
DictionaryLabelReadFields: &DictionaryLabelReadFields
  kind: read
  from: shared_dictionary
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - name: value
      arrayType: toFirstOne
      from: shared_dictionary_value
      defaultWhere:
        - column: remove
          operator: "="
          value: false
      columns:
        - dictionary_value
        # shared_language_code は絞り込み専用のJOIN。出力列は無い。
        # codeは呼び出し側が必ず指定する引数(requiredWhere)であり、ハードコードしない。
        # output: false … 常に出力から除外する。where/requiredWhere/defaultWhereはpickと違い
        # 除外されず、親(value)のLATERALサブクエリのJOIN/WHERE句の構築には使われ続ける。
        # 要件0043: DictionaryLabelReadFieldsは画面のツリーの深い位置(子・孫)で使い回されるため、
        # 祖先・兄弟の別ノードが持つ同名列(例: 各マスタ自身のcode列)とGraphQL引数名が
        # 衝突しうる。{column, as}でこの1箇所だけ明示的にlanguageCodeへ改名しておけば、
        # DictionaryLabelReadFieldsを経由する全画面に自動的に反映され、各画面での個別対応は不要になる。
        - name: language
          arrayType: toFirstOne
          from: shared_language_code
          output: false
          requiredWhere:
            - column: code
              as: languageCode
          defaultWhere:
            - column: remove
              operator: "="
              value: false

# --- Edit用アーム: shared_dictionary配下の言語別値(shared_dictionary_value)をまとめて編集する。
#     1辞書エントリは言語の数だけ行を持つ(1対N)ため、ReadのDictionaryLabelReadFieldsとは異なりarrayType: toMany(複数件)にする。
#     (下書きではtoFirstOneになっていたが、複数言語を同時に編集できなくなるため修正)
DictionaryEditFields: &DictionaryEditFields
  kind: edit
  from: shared_dictionary
  columns:
    - shared_dictionary_id
    - name: value
      arrayType: toMany
      from: shared_dictionary_value
      columns:
        - shared_dictionary_value_id
        - shared_language_code_id
        - dictionary_value
        - remarks
        - update_user_id
        - update_user_history_id
        - remove
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# --- edit: shared_appellations 更新/新規作成。name/pronunciation/nicknameそれぞれの
#     shared_dictionary(と配下のshared_dictionary_value)も同時に編集する。 ---
AppellationLabelsEditFields: &AppellationLabelsEditFields
  kind: edit
  from: shared_appellations
  requiredWhere:
    - shared_appellations_id
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - name: name #Q1:識別であれば、別々にすればアクセスできないか?
      as: name
      using: shared_dictionary_name_id
      arrayType: toFirstOne
      <<: *DictionaryEditFields
    - name: pronunciatione
      as: pronunciation
      using: shared_dictionary_pronunciation_id
      arrayType: toFirstOne
      <<: *DictionaryEditFields
    - name: nicknam
      as: nickname
      using: shared_dictionary_nickname_id
      arrayType: toFirstOne
      <<: *DictionaryEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# --- read: shared_appellations 詳細(name/pronunciation/nicknameのJA表示名を取得) ---
AppellationLabelsReadFields: &AppellationLabelsReadFields
  kind: read
  from: shared_appellations
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - shared_appellations_id
    - name: name 
      as: name
      using: shared_dictionary_name_id 
      arrayType: toFirstOne
      <<: *DictionaryLabelReadFields
    - name: npronunciatione
      as: pronunciation
      using: shared_dictionary_pronunciation_id
      arrayType: toFirstOne
      <<: *DictionaryLabelReadFields
    - name: nickname
      as: nickname
      using: shared_dictionary_nickname_id
      arrayType: toFirstOne
      <<: *DictionaryLabelReadFields

# 共有(参照)定義: 住所情報 (点8) — info_address由来。company以外からも参照されうるため独立定義し、
# 実際の利用箇所ではYAMLエイリアス(*AddressReadFields)で共有参照する。
AddressReadFields: &AddressReadFields
  kind: read
  from: info_address
  columns:
    - iso3166_3
    - zip_code
    - name: address1
      as: address1
      using: address1
      arrayType: toFirstOne
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: address2
      as: address2
      using: address2
      arrayType: toFirstOne
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: bill
      as: bill_name
      using: bill
      arrayType: toFirstOne
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - phone
    - fax_number

AddressEditFields: &AddressEditFields
  kind: edit
  from: info_address
  columns:
    - info_address_id
    - iso3166_3
    - zip_code
    - name: address1
      using: address1
      arrayType: toFirstOne
      <<: *AppellationLabelsEditFields
    - name: address2
      using: address2
      arrayType: toFirstOne
      <<: *AppellationLabelsEditFields
    - name: bill
      as: bill_name
      using: bill
      arrayType: toFirstOne
      <<: *AppellationLabelsEditFields
    - phone
    - fax_number
    - remarks
    - update_user_id
    - update_user_history_id
    - remove 

LanguageCodeEditFields: &LanguageCodeEditFields
  kind: edit
  from: shared_language_code
  columns:
    - shared_language_code_id
    - code
    - label
    - priority
    - is_default
    - remarks
    - update_user_id
