# ツリーから選択したもの、設備など参照から選択されたものが編集として該当する
ItemPageEdit:
  kind: edit
  from: mstr_item
  requiredWhere:
    - mstr_item_id
  generateRfe: true
  columns:
    - mstr_item_id
    - name: parent
      arrayType: toFirstOne
      as: parent
      using: mstr_item_id
      from: mstr_item_tree
      # NULL許容(呼び出し側がNULLを渡したときは組織テーブルのトップノードを表す)。
      requiredWhere:
        - parent_mstr_item_id
      columns:
        - mstr_item_tree_id
        - parent_mstr_item_id
        - code
        - control_code
        - name: labels
          arrayType: toFirstOne
          using: names
          <<: *AppellationLabelsEditFields
        - quantity
        - detail 
      defaultWhere:
        - column: remove
          operator: "="
          value: false
    - name: descendants
      arrayType: toFirstOne
      as: descendants
      using: mstr_item_id
      pick:
        - descendant_count
      from: v_item_descendants
    - mstr_item_kind_id
    - name: kinds
      arrayType: toFirstOne
      using: mstr_item_kind_id
      editable: false # 要件0047: IDの割り当てのみ(子は書き込まず、usingのFK列だけを書き込む)
      <<: *ItemKindReadFields #IDの取得のみ
    - code
    - identification
    - control_code
    # 製造元
    - name: manufacture
      arrayType: toFirstOne
      using: mstr_manufacturer_id
      editable: true # 要件0047: 親とともに編集する(親のRFEにも含まれる)
      <<: *ManufacturePageEdit
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - label_code
    - description
    - name: unit # IDの解決のみ(UnitReadFieldsは参照用アーム)
      arrayType: toFirstOne
      using:  shared_unit_id
      editable: false # 要件0047: IDの割り当てのみ(子は書き込まず、usingのFK列だけを書き込む)
      <<: *UnitReadFields
    # 梱包サイズ
    - name: spec
      arrayType: toFirstOne
      using: mstr_item_id
      <<: *SpecMeasurementPageEdit
    - increment
    - lot
    - stock_quantity 
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

