    - name: holdeLicense # 要件0045レビュー: 元は内側に`from: mstr_license`の`licenses`
      # という不要な入れ子層があり、mstr_staff_license自身の列(mstr_staff_license_id/
      # info_staff_id)をmstr_license由来として重複宣言していた(コピー&ペースト起因の
      # 構造ミスと判断)。LicenseHoldersPage.licensesと対称になるよう1階層に平坦化した。
      arrayType: toMany
