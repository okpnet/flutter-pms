# yaml-language-server: $schema=../../schema.json

##### ステークホルダー

# 配送区分の読み込み
ShippingKindReadFields: &ShippingKindReadFields
  kind: read
  from: mstr_shipping_kind
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
  - mstr_shipping_kind_id
  - code
  - name: labels
    as: labels
    arrayType: toFirstOne
    using: names
    pick: 
      - name
      - pronunciation
      - nickname
    <<: *AppellationLabelsReadFields
  - symbol
  - remarks
  - update_at
  - name: update_user
    as: update_user
    using: [update_user_history_id,update_user_id]
    arrayType: toFirstOne
    <<: *UpdateStaffReadFields

# 配送区分の書き込み
ShippingKindEditFields: &ShippingKindEditFields
  kind: edit
  from: mstr_shipping_kind
  requiredWhere: 
    - mstr_shipping_kind_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_shipping_kind_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove
