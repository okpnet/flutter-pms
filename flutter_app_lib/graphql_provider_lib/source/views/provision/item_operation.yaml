# yaml-language-server: $schema=../../schema.json

# mstr_item_operationの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
ItemOperationPage: &ItemOperationPage
  kind: read
  from: mstr_item_operation
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_item_operation_id
    - mstr_operation_id
    - mstr_item_id
    - name: item
      as: item
      arrayType: toFirstOne
      using: mstr_item_id
      <<: *ItemReadFields
    - control_code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextReadFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# mstr_item_operationの書き込み
ItemOperationPageEdit:
  kind: edit
  from: mstr_item_operation
  requiredWhere:
    - mstr_item_operation_id
  generateRfe: true
  columns:
    - mstr_item_operation_id
    - mstr_operation_id
    - mstr_item_id
    - name: item
      as: item
      arrayType: toFirstOne
      using: mstr_item_id
      editable: false
      <<: *ItemReadFields
    - control_code
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FixTextEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# mstr_item_operation_taskの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
ItemOperationTaskPage: &ItemOperationTaskPage
  kind: read
  from: mstr_item_operation_task
  filter: true
  requiredWhere:
    - languageCode
    - mstr_item_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_item_operation_task_id
    - mstr_operation_task_id
    - mstr_item_id
    - sequence
    - default_interval
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# mstr_item_operation_taskの書き込み
ItemOperationTaskPageEdit:
  kind: edit
  from: mstr_item_operation_task
  requiredWhere:
    - mstr_item_operation_task_id
  generateRfe: true
  columns:
    - mstr_item_operation_task_id
    - mstr_operation_task_id
    - mstr_item_id
    - sequence
    - default_interval
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

