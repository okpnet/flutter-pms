# yaml-language-server: $schema=../../schema.json

# 品目区分読み込み。参照用。
ItemKindReadFields: &ItemKindReadFields
  kind: read
  from: mstr_item_kind
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_item_kind_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields

# 品目区分読み込み
ItemKindPage:
  kind: read
  from: mstr_item_kind
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_item_kind_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 品目区分書き込み
ItemKindPageEdit:
  kind: edit
  from: mstr_item_kind
  requiredWhere:
    - mstr_item_kind_id
  generateRfe: true
  columns:
    - mstr_item_kind_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: names # 要件0044レビュー: `ceo_names`(CompanyPageEditからのコピー&ペースト
        # 起因の誤り)になっていた。mstr_item_kindはcompanyのような複数呼称セットを
        # 持たないテーブルのため、他画面と同様の汎用列名`names`に修正した。
      <<: *AppellationLabelsEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

