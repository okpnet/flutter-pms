# yaml-language-server: $schema=../../schema.json

# trans_purchaseの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
PurchasePage: &PurchasePage
  kind: read
  from: trans_purchase
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_purchase_id
    - stakeholder_history_id
    - stakeholder_id
    - stakeholder_contact_history_id
    - stakeholder_contact_id
    - purchase_ctrl1
    - purchase_ctrl2
    - purchase_ctrl3
    - register_at
    - purchase_order_date
    - deadline
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: purchase_detail_count
      arrayType: toFirstOne
      as: purchase_detail_count
      using: trans_purchase_id
      from: v_purchase_purchase_detail_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_purchaseの書き込み
PurchasePageEdit:
  kind: edit
  from: trans_purchase
  requiredWhere:
    - trans_purchase_id
  generateRfe: true
  columns:
    - trans_purchase_id
    - stakeholder_history_id
    - stakeholder_id
    - stakeholder_contact_history_id
    - stakeholder_contact_id
    - purchase_ctrl1
    - purchase_ctrl2
    - purchase_ctrl3
    - register_at
    - purchase_order_date
    - deadline
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# trans_purchase_detailの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
