# yaml-language-server: $schema=../../schema.json

UnrecognizedPage: &UnrecognizedPage
  kind: read
  from: trans_unrecognized
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_unrecognized_id
    - control_code1
    - control_code2
    - control_code3
    - decision_date
    - deadline
    - expected_completion_date
    - planned_shipping_date
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_unrecognizedの書き込み
UnrecognizedPageEdit:
  kind: edit
  from: trans_unrecognized
  requiredWhere:
    - trans_unrecognized_id
  generateRfe: true
  columns:
    - trans_unrecognized_id
    - control_code1
    - control_code2
    - control_code3
    - decision_date
    - deadline
    - expected_completion_date
    - planned_shipping_date
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# trans_unrecognized_detailの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
UnrecognizedDetailPage: &UnrecognizedDetailPage
  kind: read
  from: trans_unrecognized_detail
  filter: true
  requiredWhere:
    - languageCode
    - trans_unrecognized_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_unrecognized_detail_id
    - trans_unrecognized_id
    - quantity
    - cost
    - deadline
    - item_history_id
    - item_id
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_unrecognized_detailの書き込み
UnrecognizedDetailPageEdit:
  kind: edit
  from: trans_unrecognized_detail
  requiredWhere:
    - trans_unrecognized_detail_id
  generateRfe: true
  columns:
    - trans_unrecognized_detail_id
    - trans_unrecognized_id
    - quantity
    - cost
    - deadline
    - item_history_id
    - item_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

