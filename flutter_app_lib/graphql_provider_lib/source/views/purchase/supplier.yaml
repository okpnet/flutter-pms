# yaml-language-server: $schema=../../schema.json

# サプライヤー
SupplierPage:
  kind: read
  <<: *StakeholderReadFields
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
    - column: is_supplier
      operator: =
      value: true

# サプライヤーの書き込み(0055追加: page.mdの外部供給者情報)
SupplierPageEdit:
  kind: edit
  <<: *StakeholderEditFields
  generateRfe: true
