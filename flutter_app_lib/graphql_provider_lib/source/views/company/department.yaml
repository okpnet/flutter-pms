# yaml-language-server: $schema=../../schema.json

# 組織区分
DepartmentCategoryPage: &DepartmentCategoryPage
  kind: read
  from: info_department_kind_value
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_department_kind_value_id
    - name: labels
      arrayType: toFirstOne
      using: names
      pick: # 2026/09/29　追加
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 組織区分編集
DepartmentCategoryPageEdit:
  kind: edit
  from: info_department_kind_value
  requiredWhere:
    - info_department_kind_value_id
  generateRfe: true
  columns:
    - info_department_kind_value_id
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 組織参照表示フィールド
DepartmentReadFields: &DepartmentReadFields
  kind: read
  from: info_department
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_department_id
    - info_company_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      pick: # 2026/09/29　追加
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *AddressReadFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 部署と区分の関連読み込み
DepartmentKindReadFields: &DepartmentKindReadFields
  kind: read
  from: info_department_kind
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_department_kind_id
    - name: kinds
      arrayType: toFirstOne
      using:  info_department_kind_id
      <<: *DepartmentCategoryPage
    - info_department_id
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

DepartmentKindEditFields: &DepartmentKindEditFields
  kind: edit
  from: info_department_kind
  requiredWhere:
    - info_department_kind_id
  columns:
    - info_department_kind_id
    - name: kinds
      arrayType: toMany
      using:  info_department_kind_id
      <<: *DepartmentCategoryPage
    - info_department_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 組織
DepartmentPage: &DepartmentPage
  kind: read
  from: info_department
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_department_id
    - info_company_id
    - name: parent
      arrayType: toFirstOne
      as: parent
      using: info_department_id
      from: info_department_tree
      # NULL許容(呼び出し側がNULLを渡したときは組織テーブルのトップノードを表す)。
      requiredWhere:
        - parent_info_department_id
      columns:
        - info_department_tree_id
        - parent_info_department_id
      defaultWhere:
        - column: remove
          operator: "="
          value: false
    # 要件0046確認(変換不可、要件0047): v_department_descendantsはschema.graphql上InfoDepartmentとの関連(FK)を持たず
    # (ビューのためPostGraphileが関連フィールドを生成しない)、allVDepartmentDescendantsからしか参照できないため、
    # 一覧の各行へ入れ子で取得できない。列もancestor_info_department_idでありusing: info_department_idと一致しない。
    # DB側でスマートコメント(@foreignKey (ancestor_info_department_id) references info_department (info_department_id))を
    # 付与しschema.graphqlを再取得するまで、department_page_read.graphqlには含めていない。確認後は削除可。
    - name: descendants
      arrayType: toFirstOne
      as: descendants
      using: info_department_id
      pick:
        - descendant_count
      from: v_department_descendants
    - info_office_id
    - name: office
      arrayType: toFirstOne
      as: office
      using: info_office_id      
      <<: *OfficePage
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      pick: # 2026/09/29　追加
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *AddressReadFields
    - name: kinds 
      arrayType: toFirstOne
      as: departmentKinds
      using: info_department_id
      <<: *DepartmentKindReadFields
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 組織編集
DepartmentPageEdit:
  kind: edit
  from: info_department # 要件0045レビュー: fromが未指定だった(他のEditノードとの
    # 一貫性、及びrequiredWhereのinfo_department_idから判断し追記)。
  generateRfe: true
  requiredWhere:
    - info_department_id
  columns:
    - info_department_id
    - info_company_id
    - name: office
      arrayType: toFirstOne
      as: office
      using: info_office_id
      kind: edit
      from: info_office
      columns:
        - info_office_id
        - code
        - name: labels
          arrayType: toFirstOne
          using: names
          <<: *AppellationLabelsEditFields
        - name: address
          arrayType: toFirstOne
          using: info_address_id
          <<: *AddressEditFields
        - remarks
        - update_user_id
        - update_user_history_id
        - remove
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - name: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *AddressEditFields
    - name: departmentkinds
      arrayType: toMany
      using: info_department_id
      <<: *DepartmentKindEditFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 部署体系の書き込み(ドラッグ&ドロップ等の親の付け替え。要件0054案A)
# ツリー行(info_department_tree)を直接更新する。parent_info_department_idがnullのときはトップノード。
DepartmentTreePageEdit:
  kind: edit
  from: info_department_tree
  requiredWhere:
    - info_department_tree_id
  generateRfe: true
  columns:
    - info_department_tree_id
    - parent_info_department_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove
