# yaml-language-server: $schema=../../schema.json

# 担当者
StaffPage: &StaffPage
  kind: read
  from: info_staff
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_staff_id
    - info_company_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: # 2026/09/29　追加
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - sex
    - phone
    - private_phone
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 5本)
    - name: staff_access_permission_count
      arrayType: toFirstOne
      as: staff_access_permission_count
      using: info_staff_id
      from: v_staff_staff_access_permission_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: staff_license_count
      arrayType: toFirstOne
      as: staff_license_count
      using: info_staff_id
      from: v_staff_staff_license_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: staff_capability_count
      arrayType: toFirstOne
      as: staff_capability_count
      using: info_staff_id
      from: v_staff_staff_capability_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: sign_count
      arrayType: toFirstOne
      as: sign_count
      using: info_staff_id
      from: v_staff_sign_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: assign_count
      arrayType: toFirstOne
      as: assign_count
      using: info_staff_id
      from: v_staff_assign_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 担当者編集
StaffPageEdit:
  kind: edit
  from: info_staff
  requiredWhere:
    - info_staff_id
  generateRfe: true
  columns:
    - info_staff_id
    - info_company_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - sex
    - phone
    - private_phone
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 担当者の力量の読み込み
# 担当者に適用した力量項目、及び力量評価結果を反映する
# 担当者がもつ評価された力量項目
# 2026/09/30変更:StaffToCapabilityPage->StaffCapabilityPage 
StaffCapabilityPage:
  kind: read
  from: info_staff
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_staff_id
    - info_company_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - sex
    - phone
    - private_phone
    - name: capabilitys
      arrayType: toMany
      as: capabilitys
      using: info_staff_id
      from: mstr_staff_capability
      columns:
        - mstr_staff_capability_id
        - info_staff_id
        - name: capability
          arrayType: toFirstOne
          as: capability
          using: mstr_capability_id
          <<: *CapabilityPage
        - value
        - stop 
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 5本)
    - name: staff_access_permission_count
      arrayType: toFirstOne
      as: staff_access_permission_count
      using: info_staff_id
      from: v_staff_staff_access_permission_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: staff_license_count
      arrayType: toFirstOne
      as: staff_license_count
      using: info_staff_id
      from: v_staff_staff_license_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: staff_capability_count
      arrayType: toFirstOne
      as: staff_capability_count
      using: info_staff_id
      from: v_staff_staff_capability_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: sign_count
      arrayType: toFirstOne
      as: sign_count
      using: info_staff_id
      from: v_staff_sign_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: assign_count
      arrayType: toFirstOne
      as: assign_count
      using: info_staff_id
      from: v_staff_assign_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 力量と担当者の書き込み
# 力量と担当者を関連付けする
StaffCapabilityEditFields: &StaffCapabilityEditFields
  kind: edit
  from: mstr_staff_capability
  # 要件0050: requiredWhere・generateRfeは共有する本体(~EditFields)には書かず、
  # 取り込む側の各~PageEdit(StaffCapabilityPageEdit・CapableStaffPageEdit)に書く。
  columns:
    - mstr_staff_capability_id
    #- info_staff_id
    - name: staff
      arrayType: toFirstOne
      using: info_staff_id
      editable: false # 要件0047: IDの割り当てのみ(子は書き込まず、usingのFK列だけを書き込む)
      <<: *StaffPage  #ここでStaffの編集は行わず、IDを割り当てるだけ
    #- mstr_capability_id
    - name: capability
      arrayType: toFirstOne
      using: mstr_capability_id
      editable: false # 要件0047: IDの割り当てのみ(子は書き込まず、usingのFK列だけを書き込む)
      <<: *CapabilityPage #ここでCapabilityの編集は行わず、IDを割り当てるだけ
    - value
    - stop
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 担当者の力量の書き込み(StaffCapabilityPage側の編集画面)
# 力量と担当者の関連付けの実体はmstr_staff_capabilityのため、StaffCapabilityEditFieldsと
# 完全に同一の内容をそのまま参照する。
# 0047:不要と判断した
# 0050: 7-2-3により、共有する本体をStaffCapabilityEditFieldsとし、各ページの編集画面として新設した。
StaffCapabilityPageEdit:
  <<: *StaffCapabilityEditFields
  requiredWhere: # 要件0028: 元は未指定だったため追記。mstr_staff_capabilityは
    # info_staff_idでパーティショニングされておりPostgraphileの一意キー更新は
    # ByMstrStaffCapabilityIdAndInfoStaffId(複合)のみ生成されるため、schema.graphqlを
    # 確認しrequiredWhereも複合にした(単独PKのミューテーションは存在しない)。
    - mstr_staff_capability_id
    - info_staff_id
  generateRfe: true

# 担当者の資格の読み込み
# 担当者が持つ資格が該当する
StaffHeldLicensePage:
  kind: read
  from: info_staff
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - info_staff_id
    - info_company_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - sex
    - phone
    - private_phone
    - name: holdeLicense # 要件0045レビュー: 元は内側に`from: mstr_license`の`licenses`
      # という不要な入れ子層があり、mstr_staff_license自身の列(mstr_staff_license_id/
      # info_staff_id)をmstr_license由来として重複宣言していた(コピー&ペースト起因の
      # 構造ミスと判断)。LicenseHoldersPage.licensesと対称になるよう1階層に平坦化した。
      arrayType: toMany
      as: holdeLicense
      using: info_staff_id
      from: mstr_staff_license
      defaultWhere:
        - column: remove
          operator: "="
          value: false
      columns:
        - mstr_staff_license_id
        - info_staff_id
        - mstr_license_id
        - name: license
          arrayType: toFirstOne
          as: license
          using: mstr_license_id
          <<: *LicensePage
        - start_at
        - stop_at
        - abeyance
        - abeyance_at
        - revocation
        - revocation_at
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 5本)
    - name: staff_access_permission_count
      arrayType: toFirstOne
      as: staff_access_permission_count
      using: info_staff_id
      from: v_staff_staff_access_permission_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: staff_license_count
      arrayType: toFirstOne
      as: staff_license_count
      using: info_staff_id
      from: v_staff_staff_license_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: staff_capability_count
      arrayType: toFirstOne
      as: staff_capability_count
      using: info_staff_id
      from: v_staff_staff_capability_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: sign_count
      arrayType: toFirstOne
      as: sign_count
      using: info_staff_id
      from: v_staff_sign_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: assign_count
      arrayType: toFirstOne
      as: assign_count
      using: info_staff_id
      from: v_staff_assign_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# 資格と担当者の紐付け書き込み
# 資格と担当者を関連付けする
StaffLicenseEditFields: &StaffLicenseEditFields
  kind: edit
  from: mstr_staff_license
  # 要件0050: requiredWhere・generateRfeは共有する本体(~EditFields)には書かず、
  # 取り込む側の各~PageEdit(StaffHeldLicensePageEdit・LicenseHoldersPageEdit)に書く。
  columns:
    - mstr_staff_license_id
    #- info_staff_id
    - name: staff
      arrayType: toFirstOne
      using: info_staff_id
      editable: false # 要件0047: IDの割り当てのみ(子は書き込まず、usingのFK列だけを書き込む)
      <<: *StaffPage  #ここでStaffの編集は行わず、IDを割り当てるだけ
    #- mstr_license_id
    - name: license
      arrayType: toFirstOne
      using: mstr_license_id
      editable: false # 要件0047: IDの割り当てのみ(子は書き込まず、usingのFK列だけを書き込む)
      <<: *LicensePage  #ここでLicenseの編集は行わず、IDを割り当てるだけ
    - start_at
    - stop_at
    - abeyance
    - abeyance_at
    - revocation
    - revocation_at
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 担当者が持つ資格の書き込み(StaffHeldLicensePage側の編集画面)
# 資格と担当者の関連付けの実体はmstr_staff_licenseのため、StaffLicenseEditFieldsと
# 完全に同一の内容をそのまま参照する。
StaffHeldLicensePageEdit:
  <<: *StaffLicenseEditFields
  requiredWhere: # 要件0028: info_staff_idは1対多で非一意のためRFEの単一レコード取得条件に
    # 使えない。from自身のPKに修正(元はinfo_staff_idだった)。
    - mstr_staff_license_id
  generateRfe: true
