    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: inspect_sch_detail_count
      arrayType: toFirstOne
      as: inspect_sch_detail_count
      using: trans_inspect_sch_id
      from: v_inspect_sch_inspect_sch_detail_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
