# yaml-language-server: $schema=../../schema.json

##### 場所

# 場所の選択フィールド読み込み
LocationReadFields: &LocationReadFields
  kind: read
  from: mstr_location
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_location_id
    - code
    - info_department_id
    - name: department
      arrayType: toFirstOne
      as: department
      using: info_department_id
      <<: *DepartmentReadFields
    - control_code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - info_address_id
    - name: info_address_id
      as: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *AddressReadFields
    - available
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

LocationPage: &LocationPage
  kind: read
  from: mstr_location
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_location_id
    - name: parent
      arrayType: toFirstOne
      as: parent
      using: mstr_location_id
      from: mstr_location_tree
      # NULL許容(呼び出し側がNULLを渡したときは組織テーブルのトップノードを表す)。
      requiredWhere:
        - parent_mstr_location_id
      columns:
        - mstr_location_tree_id
        - parent_mstr_location_id
      defaultWhere:
        - column: remove
          operator: "="
          value: false
    - name: descendants #子の数
      arrayType: toFirstOne
      as: descendants
      using: mstr_location_id
      pick:
        - descendant_count
      from: v_location_descendants
    - code
    - info_department_id
    - name: department
      arrayType: toFirstOne
      as: department
      using: info_department_id
      <<: *DepartmentPage
    - control_code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick: 
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - info_address_id
    - name: info_address_id
      as: address
      arrayType: toFirstOne
      using: info_address_id
      <<: *AddressReadFields
    - available
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

#場所便臭
LocationPageEdit:
  kind: edit
  from: mstr_location
  requiredWhere:
    - mstr_location_id
  generateRfe: true
  columns:
    - mstr_location_id
    - code
    - info_department_id
    - name: department  #IDの変更のみ
      arrayType: toFirstOne
      as: department
      using: info_department_id
      <<: *DepartmentPage
    - control_code
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - info_address_id
    - name: info_address_id
      arrayType: toFirstOne
      using: info_address_id
      <<: *AddressEditFields
    - available
    - remarks
    - update_at
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# 場所体系の書き込み(ドラッグ&ドロップ等の親の付け替え。要件0054案A)
# ツリー行(mstr_location_tree)を直接更新する。parent_mstr_location_idがnullのときはトップノード。
LocationTreePageEdit:
  kind: edit
  from: mstr_location_tree
  requiredWhere:
    - mstr_location_tree_id
  generateRfe: true
  columns:
    - mstr_location_tree_id
    - parent_mstr_location_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove
