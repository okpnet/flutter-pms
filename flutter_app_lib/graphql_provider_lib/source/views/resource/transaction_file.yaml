# ファイルの埋込読み込み
FileReadFields: &FileReadFields
  kind: read
  from: trans_file
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_file_id
    #- binary_data
    - name
    - media_type
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# ファイル読み込み
FilePage:
  kind: read
  from: trans_file
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_file_id
    #- binary_data
    - name
    - media_type
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 2本)
    - name: complaint_file_count
      arrayType: toFirstOne
      as: complaint_file_count
      using: trans_file_id
      from: v_file_complaint_file_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: staff_icon_count
      arrayType: toFirstOne
      as: staff_icon_count
      using: trans_file_id
      from: v_file_staff_icon_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# ファイル書き込み
FilePageEdit:
  kind: edit
  from: trans_file
  requiredWhere:
    - trans_file_id
  generateRfe: true
  columns:
    - trans_file_id
    - binary_data
    - name
    - media_type
    - remarks
    - update_at
    - remarks
    - update_user_id
    - update_user_history_id
    - remove