# yaml-language-server: $schema=../../schema.json

# trans_complaintの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
ComplaintPage: &ComplaintPage
  kind: read
  from: trans_complaint
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_complaint_id
    - occurent_at
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextReadFields
    - reporter_staff_history_id
    - reporter_staff_id
    - approvals
    - name: approvals
      as: approvals
      arrayType: toFirstOne
      using: approvals
      <<: *TransApprovalPatternReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 7本)
    - name: disposal_count
      arrayType: toFirstOne
      as: disposal_count
      using: trans_complaint_id
      from: v_complaint_disposal_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: complaint_stakeholder_count
      arrayType: toFirstOne
      as: complaint_stakeholder_count
      using: trans_complaint_id
      from: v_complaint_complaint_stakeholder_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: complaint_receive_count
      arrayType: toFirstOne
      as: complaint_receive_count
      using: trans_complaint_id
      from: v_complaint_complaint_receive_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: complaint_process_count
      arrayType: toFirstOne
      as: complaint_process_count
      using: trans_complaint_id
      from: v_complaint_complaint_process_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: complaint_order_count
      arrayType: toFirstOne
      as: complaint_order_count
      using: trans_complaint_id
      from: v_complaint_complaint_order_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: complaint_file_count
      arrayType: toFirstOne
      as: complaint_file_count
      using: trans_complaint_id
      from: v_complaint_complaint_file_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: complaint_equipment_count
      arrayType: toFirstOne
      as: complaint_equipment_count
      using: trans_complaint_id
      from: v_complaint_complaint_equipment_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_complaintの書き込み
ComplaintPageEdit:
  kind: edit
  from: trans_complaint
  requiredWhere:
    - trans_complaint_id
  generateRfe: true
  columns:
    - trans_complaint_id
    - occurent_at
    - name: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelEditFields
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextEditFields
    - reporter_staff_history_id
    - reporter_staff_id
    - approvals
    - name: approvals
      as: approvals
      arrayType: toFirstOne
      using: approvals
      editable: false
      <<: *TransApprovalPatternReadFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

