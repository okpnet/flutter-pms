# yaml-language-server: $schema=../../schema.json

# ドキュメント

# ドキュメントレベル読み込み
DocumentTierPage: &DocumentTierPage
  kind: read
  from: mstr_document_tier
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - mstr_document_tier_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: names
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - trans_file_id
    - attributive_noun
    - identifier # 0055: 列名は小文字(Identifier → identifier)
    - tier_number
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: document_count
      arrayType: toFirstOne
      as: document_count
      using: mstr_document_tier_id
      from: v_document_tier_document_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

DocumentTierPageEdit:
  kind: edit
  from: mstr_document_tier
  requiredWhere:
    - mstr_document_tier_id
  generateRfe: true
  columns:
    - mstr_document_tier_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: names
      <<: *AppellationLabelsEditFields
    - trans_file_id
    - attributive_noun
    - identifier
    - tier_number
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# ドキュメントの読み込み(体系)
# 0055: トップノード名の誤字(DocumnetPage → DocumentPage)、名称の列(mstr_document.titles)、
# 承認パターンの参照(trans_approval_pattern)を、スキーマに合わせて修正した。
DocumentPage: &DocumentPage
  kind: read
  from: mstr_document
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: "="
      value: false
  columns:
    - mstr_document_id
    - name: parent
      arrayType: toFirstOne
      using: mstr_document_id
      from: mstr_document_tree
      requiredWhere:
        - parent_mstr_document_id
      columns:
        - mstr_document_tree_id
        - parent_mstr_document_id
      defaultWhere:
        - column: remove
          operator: "="
          value: false
    - name: descendants
      arrayType: toFirstOne
      as: descendants
      using: mstr_document_id
      pick:
        - descendant_count
      from: v_document_descendants
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: titles
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - mstr_document_tier_id
    - name: tier
      as: tier
      arrayType: toFirstOne
      using: mstr_document_tier_id
      <<: *DocumentTierPage
    - trans_file_id
    - control_number
    - version_code
    - trans_approval_pattern_id
    - name: approvalPattern
      as: approval_pattern
      arrayType: toFirstOne
      using: trans_approval_pattern_id
      <<: *TransApprovalPatternReadFields
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 1本)
    - name: document_content_count
      arrayType: toFirstOne
      as: document_content_count
      using: mstr_document_id
      from: v_document_document_content_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

DocumentPageEdit:
  kind: edit
  from: mstr_document
  requiredWhere:
    - mstr_document_id
  generateRfe: true
  columns:
    - mstr_document_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: titles
      <<: *AppellationLabelsEditFields
    - mstr_document_tier_id
    - name: tier
      arrayType: toFirstOne
      using: mstr_document_tier_id
      editable: false # IDの割り当てのみ
      <<: *DocumentTierPage
    - trans_file_id
    - control_number
    - version_code
    - trans_approval_pattern_id
    - name: approvalPattern
      arrayType: toFirstOne
      using: trans_approval_pattern_id
      editable: false # IDの割り当てのみ(承認パターンの写しは承認の開始時に作られる)
      <<: *TransApprovalPatternReadFields
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

# ドキュメントの体系の書き込み(親の付け替え。要件0054案A)
DocumentTreePageEdit:
  kind: edit
  from: mstr_document_tree
  requiredWhere:
    - mstr_document_tree_id
  generateRfe: true
  columns:
    - mstr_document_tree_id
    - parent_mstr_document_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

######  0055: 雛形から追加
# mstr_document_contentの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
DocumentContentPage: &DocumentContentPage
  kind: read
  from: mstr_document_content
  filter: true
  requiredWhere:
    - languageCode
    - mstr_document_id
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - mstr_document_content_id
    - mstr_document_id
    - code
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: titles
      pick:
        - name
        - pronunciation
        - nickname
      <<: *AppellationLabelsReadFields
    - name: contentTexts
      as: contentTexts
      arrayType: toFirstOne
      using: contents
      <<: *FixTextReadFields
    - sequence
    - image_content
    - trans_file_id
    - symbol
    - remarks
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# mstr_document_contentの書き込み
DocumentContentPageEdit:
  kind: edit
  from: mstr_document_content
  requiredWhere:
    - mstr_document_content_id
  generateRfe: true
  columns:
    - mstr_document_content_id
    - mstr_document_id
    - code
    - name: labels
      arrayType: toFirstOne
      using: titles
      <<: *AppellationLabelsEditFields
    - name: contentTexts
      arrayType: toFirstOne
      using: contents
      <<: *FixTextEditFields
    - sequence
    - image_content
    - trans_file_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove


# ドキュメントコンテンツ体系の書き込み(親の付け替え。要件0054案A)
DocumentContentTreePageEdit:
  kind: edit
  from: mstr_document_content_tree
  requiredWhere:
    - mstr_document_content_tree_id
  generateRfe: true
  columns:
    - mstr_document_content_tree_id
    - parent_mstr_document_content_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove
