# yaml-language-server: $schema=../../schema.json

# trans_riskの読み込み(tool/scaffold_view.dartが出力した雛形、要件0055)
RiskPage: &RiskPage
  kind: read
  from: trans_risk
  filter: true
  requiredWhere:
    - languageCode
  defaultWhere:
    - column: remove
      operator: =
      value: false
  columns:
    - trans_risk_id
    - name: labels
      as: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelReadFields
    - name: detailTexts
      as: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextReadFields
    - frequency
    - momentous
    - action
    - residual_risk_id
    - symbol
    - remarks
    # 子のレコード数(要件0056。DBのビュー 4本)
    - name: task_risk_count
      arrayType: toFirstOne
      as: task_risk_count
      using: trans_risk_id
      from: v_risk_task_risk_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: prevention_detail_count
      arrayType: toFirstOne
      as: prevention_detail_count
      using: trans_risk_id
      from: v_risk_prevention_detail_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: order_risk_count
      arrayType: toFirstOne
      as: order_risk_count
      using: trans_risk_id
      from: v_risk_order_risk_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - name: order_detail_risk_count
      arrayType: toFirstOne
      as: order_detail_risk_count
      using: trans_risk_id
      from: v_risk_order_detail_risk_count
      pick:
        - all_count
        - enable_count
        - disable_count
    - update_at
    - name: update_user
      as: update_user
      using: [update_user_history_id,update_user_id]
      arrayType: toFirstOne
      <<: *UpdateStaffReadFields

# trans_riskの書き込み
RiskPageEdit:
  kind: edit
  from: trans_risk
  requiredWhere:
    - trans_risk_id
  generateRfe: true
  columns:
    - trans_risk_id
    - name: labels
      arrayType: toFirstOne
      using: titles
      <<: *FlexibleLabelEditFields
    - name: detailTexts
      arrayType: toFirstOne
      using: details
      <<: *FlexibleTextEditFields
    - frequency
    - momentous
    - action
    - residual_risk_id
    - remarks
    - update_user_id
    - update_user_history_id
    - remove

