name: flutter_pms_workspace
description: flutter-pms の pub workspace / melos ルート。
publish_to: none

environment:
  sdk: ^3.12.2

# ── pub workspace ─────────────────────────────────────────────
# ここに並べたパッケージの依存関係を「まとめて1回」解決する。
# ロックファイルはこのフォルダの pubspec.lock 1つだけになる。
workspace:
  - apps/*
  - packages/*/*
  # ↑ packages/model_providers/*(機能単位の GraphQL モデル)もこれに含まれる
  # tools/ のうち workspace に入れるのは GraphQL 生成ツールだけ(condition_pipeline 等は対象外)
  - tools/gql_schema_pruner
  - tools/gql_yaml2graphql
  # ↑ ワイルドカードが使えない SDK の場合は、次のように1つずつ列挙する:
  #   - apps/pms_app
  #   - packages/foundation/query_builder ...

# 層の構成(依存は上から下への一方向のみ):
#   apps/        … シェルアプリ
#   features/    … 機能(xxx_api = 契約 / xxx = 実装)
#   core/        … baton_lib, feature_shared(機能とアプリの仲介)
#   ui/ infra/   … UI基盤 / 通信・ログなどの基盤
#   foundation/  … 画面を持たない汎用部品
# workspace 対象外: legacy/(grid_lib など)、tools/(DB・Docker など)

dev_dependencies:
  melos: ^8.9.0

# ── melos ─────────────────────────────────────────────────────
# 対象パッケージは上の workspace から自動で決まる。
melos:
  name: flutter_pms

  # 層ごとにまとめて操作する: melos exec --category=features -- flutter test
  categories:
    apps: [apps/*]
    features: [packages/features/*]
    core: [packages/core/*]
    ui: [packages/ui/*]
    infra: [packages/infra/*]
    foundation: [packages/foundation/*]
    model_providers: [packages/model_providers/*]

  command:
    bootstrap:
      # 同期した行に「melos管理」のコメントを付ける
      markSharedDependencies: true

      # ▼ バージョンの集中管理
      #   melos bootstrap を実行すると、ここに書いた依存を
      #   「すでに宣言しているパッケージ」の pubspec.yaml へ上書き同期する。
      #   バージョンを上げるときはここだけ直して bootstrap する。
      environment:
        sdk: ^3.12.2
      dependencies:
        logger: ^2.7.0
        uuid: ^4.6.0
        slang: ^4.19.2
        flutter_riverpod: ^3.4.3
        go_router: ^18.1.0
      dev_dependencies:
        flutter_lints: ^6.0.0
        lints: ^6.0.0
        test: ^1.25.6
        # Flutter SDK が meta を 1.18.0 に固定しているため、新しい analyzer を要求しない範囲にする
        build_runner: ^2.9.0
        build: ">=4.0.0 <5.0.0"

  scripts:
    analyze:
      description: 全パッケージを静的解析
      exec: dart analyze .

    test:
      description: 全テスト(Flutter と純Dart の両方)
      steps:
        - test:flutter
        - test:dart

    test:flutter:
      description: Flutter パッケージのテスト
      exec: flutter test
      packageFilters:
        flutter: true
        dirExists: test

    test:dart:
      description: 純Dart パッケージのテスト
      exec: dart test
      packageFilters:
        flutter: false
        dirExists: test

    gen:
      description: build_runner を使うパッケージのコード生成
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    # ── GraphQL モデル生成(機能単位。CLAUDE.md「GraphQL モデル生成ルール」) ──
    gql:schema:
      description: 本家スキーマを .schema/ に取得(DB変更時のみ)
      run: dart run tools/gql_schema_pruner/bin/fetch_schema.dart --endpoint http://192.168.1.100:5000/graphql --endpoint http://192.168.9.245:5000/graphql --out .schema/schema.graphql

    gql:yaml:
      description: ① 全モデルパッケージの gql/*.yaml → lib/src/graphql/*.graphql
      run: dart run tools/gql_yaml2graphql/bin/gql_yaml2graphql.dart --root packages/model_providers

    gql:prune:
      description: ② 本家スキーマから画面用 schema.graphql を抜き出す(検証も兼ねる)
      run: dart run tools/gql_schema_pruner/bin/gql_schema_pruner.dart --schema .schema/schema.graphql --root packages/model_providers

    gql:check:
      description: ② の差分チェック(書き出さずに、差分があれば失敗する。CI用)
      run: dart run tools/gql_schema_pruner/bin/gql_schema_pruner.dart --schema .schema/schema.graphql --root packages/model_providers --check

    gql:build:
      description: ③ モデル生成(検索条件の対応表・バレルも更新する)
      steps:
        - gql:filter
        - gql:build:runner
        - gql:barrel

    gql:filter:
      description: 検索条件の対応表(lib/src/contents/*_filter_spec.dart)を生成
      run: dart run tools/gql_yaml2graphql/bin/gen_filter_spec.dart --root packages/model_providers

    gql:build:runner:
      description: graphql_codegen(build_runner)でモデルを生成
      exec: dart run build_runner build -d
      packageFilters:
        dirExists: gql

    gql:barrel:
      description: モデルパッケージのバレルファイルを更新
      run: dart run tools/gql_yaml2graphql/bin/gen_barrel.dart --root packages/model_providers

    gql:
      description: ①→②→③ をまとめて実行
      steps:
        - gql:yaml
        - gql:prune
        - gql:build

    gql:property-list:
      description: 生成モデルのプロパティ一覧 CSV を doc/contents/property_list.csv に出力(gql:build の後)
      run: dart run tools/gql_yaml2graphql/bin/gen_property_list.dart --root packages/model_providers
